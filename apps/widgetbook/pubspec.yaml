name: plot_widgetbook

environment:
  sdk: ">=3.3.0 <4.0.0"

scripts:
  build: dart run build_runner build -d
  watch: dart run build_runner watch

dependencies:
  widgetbook_annotation: ^3.9.0
  widgetbook: ^3.20.0
  plot:
    path: ../plot
  platform_builder: ^3.0.0
  font_awesome_flutter:
    git:
      url: git@github.com:plotday/font_awesome_flutter.git

dev_dependencies:
  build_runner: ^2.4.13
  widgetbook_generator: ^3.20.0
  flutter_driver:
    sdk: flutter
