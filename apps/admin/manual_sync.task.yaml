slug: manual_sync
name: Manual sync
parameters:
  - slug: account_id
    name: Account ID
    type: integer
  - slug: type
    name: Type
    type: shorttext
    required: false
    default: full
    options:
      - full
      - partial
      - incremental
  - slug: calendar_id
    name: Calendar ID
    description: Provider calendar ID
    type: shorttext
    required: false
rest:
  resource: sync_api
  method: POST
  path: /
  bodyType: json
  body: '{"accountId": {{params.account_id}}, "syncType": "{{params.type}}", "providerCalendarId": {{params.calendar_id ?? "null"}}}'
  retryFailures: "{{ false }}"
