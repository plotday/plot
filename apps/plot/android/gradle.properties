org.gradle.jvmargs=-Xmx6G
# Reuse task outputs across builds (pairs with the ~/.gradle cache in CI).
org.gradle.caching=true
# Run independent tasks in parallel across modules.
org.gradle.parallel=true
android.useAndroidX=true
# TODO: verify still needed via `./gradlew checkJetifier`; Jetifier rewrites the
# bytecode of every dependency on each build and is a measurable build tax once
# no legacy support-library deps remain.
android.enableJetifier=true
android.newDsl=false
# Disable resource name obfuscation — flutter_local_notifications looks up
# ic_stat_notification by name at runtime via getResources().getIdentifier()
android.enableResourceOptimizations=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
