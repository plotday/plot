        width:100%; height:100%;

        width:100%; height:100%;

      .cover {
        display:block;

      .bottom {
        position: absolute;

        left: 50%;

        transform: translate(-50%, 0);
      }

      .bottomLeft {
        position: absolute;
        bottom: 0;
        left: 0;
      }

      .bottomRight {
        position: absolute;
        bottom: 0;
        right: 0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1f2221;

      }
