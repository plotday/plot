<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">
    <title>Plot</title>

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <meta name="description" content="A focused workspace for progress on your priorities">
    <meta name="google-signin-client_id" content="535301598151-k717hhbgqe9jfoko9epc8m8c1jeqp2s4.apps.googleusercontent.com">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Plot">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/favicon-96x96.png?v=20250908" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=20250908">
    <link rel="shortcut icon" href="icons/favicon.ico?v=20250908">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20250908">
  
    <style id="splash-screen-style">
      html {
        height: 100%
      }

      body {
        margin: 0;
        min-height: 100%;
        background-color: #f2f5f3;
            background-size: 100% 100%;
      }

      .center {
        margin: 0;
        position: absolute;
        top: 50%;
        left: 50%;
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }

      .contain {
        display:block;
        width:100%; height:100%;
        object-fit: contain;
      }

      .stretch {
        display:block;
        width:100%; height:100%;
      }

      .cover {
        display:block;
        width:100%; height:100%;
        object-fit: cover;
      }

      .bottom {
        position: absolute;
        bottom: 0;
        left: 50%;
        -ms-transform: translate(-50%, 0);
        transform: translate(-50%, 0);
      }

      .bottomLeft {
        position: absolute;
        bottom: 0;
        left: 0;
      }

      .bottomRight {
        position: absolute;
        bottom: 0;
        right: 0;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1f2221;
            }
      }
    </style>

    <script id="splash-screen-script">
      function removeSplashFromWeb() {
        document.getElementById("splash")?.remove();
        document.getElementById("splash-branding")?.remove();
        document.getElementById("splash-screen-style")?.remove();
        document.getElementById("splash-screen-script")?.remove();
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.body.style.background = dark ? "#1f2221" : "#f2f5f3";
      }
    </script>
  </head>
  <body>
    <picture id="splash">
        <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
        <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
        <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
    </picture>
    
    <div id="clerk-captcha"></div>

    <script src="flutter_bootstrap.js" async=""></script>
  </body>
</html>
