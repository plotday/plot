name: plot
description: "A focused workspace for progress on your priorities"
publish_to: "none"

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.5.0+372

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0 <3.45.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  bloc_concurrency: ^0.3.0

  google_sign_in: ^7.1.1
  sign_in_with_apple: ^8.0.0
  dart_date: ^1.4.0
  http: ^1.2.0
  intl: ^0.20.2
  flutter_web_auth_2: ^5.0.2
  rxdart: ^0.28.0
  collection: ^1.18.0
  macos_ui: ^2.2.2
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.2.6
  platform_builder: ^3.0.0
  uuid: ^4.4.2
  meta: ^1.12.0
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  device_info_plus: ">=10.0.1 <12.0.0"
  flutter_resizable_container: ^4.2.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.5
  macos_window_utils: ^1.9.1
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  font_awesome_flutter:
    git:
      url: git@github.com:plotday/font_awesome_flutter.git
      ref: ef8d4cf
  injector: ^4.0.0
  posthog_flutter: ^5.23.1
  # Pinned directly because clerk_auth (transitive) brings this in but pub on
  # GitHub Actions runners has been dropping it from resolution, leaving
  # package_graph.json inconsistent and breaking `flutter pub get`.
  retry: ^3.1.2
  b: ^0.2.0
  super_editor: 0.3.0-dev.51
  super_editor_spellcheck:
    git:
      url: https://github.com/Flutter-Bounty-Hunters/super_editor.git
      path: super_editor_spellcheck
      ref: 291a69308f64863fee813df1bd483515038483f9
  sliver_tools: ^0.2.12
  timeago: ^3.7.0
  stack_trace: ^1.12.0
  provider: ^6.1.2
  forui: ^0.22.1
  auto_route: ^11.1.0
  flutter_debouncer: ^2.0.0
  flutter_hooks: ^0.21.2
  logging: ^1.3.0
  remove_markdown: ^0.0.2
  file_picker: ^11.0.2
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0
  rrule: ^0.2.17
  change_case: ^2.2.0
  flutter_svg: ^2.2.1
  google_sign_in_web: ^1.0.1
  web_socket_channel: ^3.0.1
  follow_the_leader: ^0.5.1
  synchronized: ^3.3.0+3
  prism: ^2.1.0
  prism_flutter: ^2.1.0
  flutter_spinkit: ^5.2.2
  app_links: ^6.3.3
  share_handler: ^0.0.25
  mime: ^2.0.0
  image_picker: ^1.1.2
  clerk_auth:
    git:
      url: https://github.com/clerk/clerk-sdk-flutter.git
      path: packages/clerk_auth
      ref: clerk_auth-v0.0.15-beta
  crypto: ^3.0.0
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^5.0.2
  sqlite3: ^3.2.0
  re_highlight: ^0.0.3
  super_clipboard: ^0.9.1
  markdown: ^7.3.0
  html2md: ^1.3.2
  # Used by lib/widget/linkedin_login_modal.dart to host an in-app LinkedIn
  # login page, capture the `li_at`/`JSESSIONID` session cookies, and post
  # them to the server. Broader platform reach than webview_flutter
  # (macOS + Windows out of the box) and exposes a rich cookie API.
  flutter_inappwebview: ^6.1.5

  # StoreKit IAP for iOS and Mac App Store distribution (App Store guideline
  # 3.1.1). Used exclusively by lib/api/iap_api.dart, which is conditionally
  # imported so non-Apple platforms never pull this in. See
  # lib/api/upgrade_api.dart `UpgradeUi.isAppStoreBuild`.
  in_app_purchase: ^3.2.0
  # StoreKit-specific purchase details. iap_api.dart reads the raw
  # `SKPaymentTransactionStateWrapper` to tell `.purchasing` (the native
  # purchase/password sheet is on screen) from `.deferred` (Ask-to-Buy: sheet
  # dismissed) — both of which collapse to `PurchaseStatus.pending` in the
  # cross-platform API. Already pulled in transitively by `in_app_purchase`;
  # declared directly because we import it.
  in_app_purchase_storekit: ^0.4.9

dependency_overrides:
  # ⚠️  PATCHED LOCAL FORK — see third_party/sqlite3/hook/build.dart
  # When upgrading sqlite3, copy the new version to third_party/sqlite3/ and
  # re-apply the macOS platform check (one if-statement at the top of build()).
  # See apps/plot/README.md for full context.
  sqlite3:
    path: third_party/sqlite3

  # flutter_driver is imported from lib/main.dart to register the VM service
  # driver extension when the app is launched with --enable-driver-extension
  # (debug builds only). This lets agents drive the running app via dart-mcp's
  # flutter_driver tool. Listed as a regular dependency (not dev) because pub
  # blocks imports of dev_dependencies from lib/. The extension call is gated
  # by kDebugMode so release builds incur no behavior change.
  flutter_driver:
    sdk: flutter

dev_dependencies:
  analyzer: ^10.0.1
  code_assets: ^1.0.0
  hooks: ^1.0.0
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.10.4
  build_verify: ^3.1.1
  test: ^1.25.2
  drift_dev: ^2.32.0
  auto_route_generator: ^10.4.0
  msix: ^3.16.7
  flutter_native_splash: ^2.4.2
  fake_async: ^1.3.3
  plugin_platform_interface: ^2.1.0
  url_launcher_platform_interface: ^2.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # `app.env` (not `.env`) — Cloudflare's WAF blocks request paths whose
    # final segment is `.env`, so a `.env` asset is unreachable from
    # app.plot.day. See lib/env.dart for the matching dotenv.load call.
    - app.env
    - assets/
    - shorebird.yaml

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/figtree/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/figtree/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/figtree/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/figtree/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/figtree/Figtree-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/figtree/Figtree-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/figtree/Figtree-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/figtree/Figtree-BoldItalic.ttf
          weight: 700
          style: italic

    # Noto Color Emoji — the color (CBDT/CBLC bitmap) variant, bundled so
    # reactions render identically on every OS rather than falling back to
    # each platform's native emoji set. ~10MB. Refresh from:
    #   https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/noto-emoji/NotoColorEmoji.ttf

scripts:
  build:
    watch: flutter pub run build_runner watch
    build: flutter pub run build_runner build
    macos: flutter pub run build_runner build && flutter build macos
    web: flutter pub run build_runner build && flutter build web --release --source-maps --base-href=/
  dev:
    macos: flutter run -d macOS
    web: flutter run -d chrome --web-port 8788 --wasm
    android: flutter run -d emulator-5554
    android-emulator:
      - flutter emulators -d android_medium | grep android_medium || flutter emulators --launch Medium_Phone_API_34 --name android_medium
      - flutter emulators --launch android_medium
  deploy:
    web: wrangler pages deploy build/web --project-name=app --commit-hash ${GITHUB_SHA:-$(git rev-parse HEAD)}

# NOTE: Android launcher icons now use custom adaptive icons for crisp rendering:
# - android/app/src/main/res/drawable/ic_launcher_foreground.xml
# - android/app/src/main/res/drawable/ic_launcher_background.xml
# - android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
# These override the auto-generated PNG assets from flutter_launcher_icons on Android API 26+.
# Background color is #f2f5f3 (light) and #1f2221 (dark) to match the app interface.
# The configuration below is kept for iOS, web, Windows, macOS, and older Android versions.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/plot-512x512.png"
  min_sdk_android: 21
  web:
    generate: true
    background_color: "#239870"
    theme_color: "#239870"
  windows:
    generate: true
    image_path: "assets/plot-windows-512x512.png"
  macos:
    generate: true

msix_config:
  display_name: "Plot: All your work, organized"
  publisher_display_name: Plot Technologies Inc.
  identity_name: PlotTechnologiesInc.Plot-TractiononPriorities
  msix_version: 1.5.0+359
  logo_path: assets/plot-windows-512x512.png
  icons_background_color: "#01845e"
  protocol_activation: plotday
  app_uri_handler_hosts: app.plot.day
  capabilities: internetClient
  install_certificate: false
  sign_msix: false
  publisher: CN=3C1B8AFA-75E1-42FE-9717-EB9D1B1820CB

# NOTE: Android splash screen now uses custom vector drawables for crisp rendering:
# - android/app/src/main/res/drawable/ic_splash_logo.xml (pre-Android 12)
# - android/app/src/main/res/drawable/ic_splash_foreground.xml (Android 12+ adaptive icon)
# These override the auto-generated PNG assets from flutter_native_splash.
# The configuration below is kept for iOS, web, and color reference.
flutter_native_splash:
  color: "#f2f5f3"
  color_dark: "#1f2221"
  image: assets/p-1024x1024.png
  android: true
  ios: true
  web: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: assets/p-1024x1024.png
    color: "#f2f5f3"
    color_dark: "#1f2221"
