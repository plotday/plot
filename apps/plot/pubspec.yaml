name: plot
description: "A calendar for being better than busy"
publish_to: "none"

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: 3.29.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.0.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  bloc_concurrency: ^0.3.0
  adaptive_theme: ^3.4.1
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.4+3
  social_login_buttons: ^1.0.7
  dart_date: ^1.4.0
  http: ^1.2.0
  sentry_dart_plugin: ^2.1.0
  flutter_web_auth_2: ^4.0.0-alpha.0
  flutter_adaptive_scaffold: ^0.1.8
  rxdart: ^0.28.0
  collection: ^1.18.0
  macos_ui: ^2.0.7
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.6
  platform_builder: ^3.0.0
  sentry_flutter: ^8.13.0
  uuid: ^4.4.2
  meta: ^1.12.0
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  device_info_plus: ^11.1.0
  flutter_resizable_container: ^3.0.3
  macos_window_utils: ^1.6.1
  font_awesome_flutter:
    git:
      url: git@github.com:plotday/font_awesome_flutter.git
  injector: ^3.0.0
  posthog_flutter: ^4.7.1
  figma_squircle: # It was on 0.5.3 before being broken by Flutter 3.27.0. This is a fork that fixes it.
    git:
      url: https://github.com/Ax0elz/figma_squircle
  b: ^0.2.0
  super_editor: ^0.3.0-dev.15
  super_editor_markdown: ^0.1.7
  sliver_tools: ^0.2.12
  timeago: ^3.7.0
  stack_trace: ^1.12.0
  provider: ^6.1.2
  forui: ^0.11.1
  auto_route: ^10.0.1
  flutter_debouncer: ^2.0.0
  flutter_hooks: ^0.21.2
  logging: ^1.3.0
  openai_dart: ^0.4.5
  remove_markdown: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"
  build_runner: ^2.4.14
  build_verify: ^3.1.0
  test: ^1.25.2
  drift_dev: ^2.26.0
  auto_route_generator: ^10.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

scripts:
  env:
    dev:
      echo: ../../scripts/gen-env development SENTRY_PROJECT=app SUPABASE_URL SUPABASE_ANON_KEY API_ROOT SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_DSN:SENTRY_APP_DSN GOOGLE_CLIENT_ID GOOGLE_IOS_CLIENT_ID GOOGLE_ANDROID_CLIENT_ID MICROSOFT_CLIENT_ID AUTH_CALLBACK_URL
      default: $env:dev:echo > .env
      android: $env:dev:echo | sed 's/localhost/10.0.2.2/' > .env
    prod: ../../scripts/gen-env production SENTRY_PROJECT=app SUPABASE_URL SUPABASE_ANON_KEY API_ROOT SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_DSN:SENTRY_APP_DSN GOOGLE_CLIENT_ID GOOGLE_IOS_CLIENT_ID GOOGLE_ANDROID_CLIENT_ID MICROSOFT_CLIENT_ID AUTH_CALLBACK_URL > .env
  build:
    watch: flutter pub run build_runner watch
    macos:
      - $env:prod
      - flutter pub run build_runner build && flutter build macos
    web:
      - $env:prod
      - flutter pub run build_runner build && flutter build web --release --source-maps --base-href=/ && flutter packages pub run sentry_dart_plugin
  dev:
    macos:
      - $env:dev:default
      - flutter run -d macOS
    android:
      - flutter emulators -d android_medium | grep android_medium || flutter emulators --launch Medium_Phone_API_34 --name android_medium
      - flutter emulators --launch android_medium
      - $env:dev:android
      - flutter run -d emulator-5554
    web:
      - $env:dev:default
      - flutter run -d chrome --web-port 8788
  deploy:
    web: wrangler pages deploy build/web --project-name=app --commit-hash ${GITHUB_SHA:-$(git rev-parse HEAD)}

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  upload_sources: false
  project: app
  org: plotday

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/plot-512x512.png"
  min_sdk_android: 21
  web:
    generate: true
    background_color: "#239870"
    theme_color: "#239870"
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true
