name: Deploy Agents

env:
  AGENTS: "plot"

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "libs/**"
      - ".github/workflows/deploy-agents.yml"
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Detect if workflow file changed
        id: workflow_changed
        run: |
          if git diff --name-only HEAD~1 | grep -q "^.github/workflows/deploy-agents.yml$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for affected agents
        id: filter
        run: |
          AGENT_LIST=(${AGENTS//,/ })
          if [ "${{ steps.workflow_changed.outputs.changed }}" = "true" ]; then
            AGENTS_JSON=$(printf '%s\n' "${AGENT_LIST[@]}" | jq -R -s -c 'split("\n")[:-1]')
            echo "agents=$AGENTS_JSON" >> $GITHUB_OUTPUT
            echo "Workflow file changed, deploying all agents: $AGENTS_JSON"
            exit 0
          fi

          AGENTS=()
          for agent in "${AGENT_LIST[@]}"; do
            AFFECTED_OUTPUT=$(pnpm dlx nx show projects --affected --base=HEAD~1 --head=HEAD --json 2>/dev/null || echo "[]")
            if echo "$AFFECTED_OUTPUT" | jq -r '.[]' 2>/dev/null | grep -q "^@plotday/agent-$agent$"; then
              AGENTS+=("\"$agent\"")
            fi
          done

          if [ ${#AGENTS[@]} -eq 0 ]; then
            echo "agents=[]" >> $GITHUB_OUTPUT
            echo "No agents have changes"
          else
            AGENTS_JSON=$(printf '%s\n' "${AGENTS[@]}" | jq -s . | tr -d '\n')
            echo "agents=$AGENTS_JSON" >> $GITHUB_OUTPUT
            echo "Changed agents: ${AGENTS[*]}"
          fi

  deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.agents != '[]'
    strategy:
      matrix:
        agent: ${{ fromJson(needs.check-changes.outputs.agents) }}

    env:
      PLOT_DEPLOY_TOKEN: ${{ secrets.PLOT_DEPLOY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies for ${{ matrix.agent }}
        run: |
          cd agents/${{ matrix.agent }}
          pnpm install

      - name: Deploy ${{ matrix.agent }} agent
        run: |
          cd agents/${{ matrix.agent }}
          pnpm plot agent deploy -e review
        continue-on-error: true
