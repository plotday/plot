name: Deploy App (Web)
on:
  workflow_run:
    workflows: ["Version Bump"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Get version from pubspec.yaml
        id: version
        run: |
          cd apps/plot
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          {
            echo "version=$CURRENT_VERSION"
            echo "version_name=$VERSION_NAME"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

          echo "Deploying version: $CURRENT_VERSION"

      - name: Load secrets from .env
        uses: 1password/load-secrets-action@v3
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .env
          ENV: Production

      - name: Load secrets from .env.production
        uses: 1password/load-secrets-action@v3
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .env.production
          ENV: Production

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Write .env file
        run: |
          cd apps/plot && pnpm run env:prod

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: apps/plot/pubspec.yaml
          cache: true

      - name: Install derry
        run: dart pub global activate derry

      - name: Get dependencies
        run: cd apps/plot && flutter pub get

      - name: Build
        run: cd apps/plot && derry build web

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install wrangler
        run: pnpm install -w wrangler

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/plot/build/web --project-name=app --commit-hash ${{ env.GITHUB_SHA }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment summary
        run: |
          {
            echo "## ✅ Web App Deployment Complete"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.version }}"
            echo "**Platform:** Web (Flutter)"
            echo ""
            echo "### URLs"
            echo "- Production: https://app.plot.day"
            echo "- Cloudflare Pages: Project 'app'"
          } >> "$GITHUB_STEP_SUMMARY"
