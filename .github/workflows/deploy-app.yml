name: Deploy App (Web)
on:
  push:
    branches: [main]
    paths:
      - "apps/plot/**"
      - ".env"
      - ".env.production"
  workflow_dispatch:

concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  refresh-secrets:
    uses: ./.github/workflows/refresh-secrets.yml
    secrets: inherit

  deploy:
    name: Deploy
    needs: refresh-secrets
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate build number
        id: version
        run: |
          BUILD_TIMESTAMP=$(date -u +"%y%m%d.%H%M")
          VERSION_NAME=$(cd apps/plot && grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')

          {
            echo "build_number=$BUILD_TIMESTAMP"
            echo "version_name=$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Build number: $BUILD_TIMESTAMP"
          echo "Version name: $VERSION_NAME"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Write app.env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        # NOTE: bundled as `app.env`, not `.env`, because Cloudflare's WAF
        # blocks any request path ending in `/.env`. See apps/plot/lib/env.dart.
        run: printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/app.env

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: .flutter-version
          cache: true

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Get dependencies
        run: cd apps/plot && flutter pub get

      - name: Build
        run: |
          cd apps/plot
          flutter pub run build_runner build
          flutter build web --release --source-maps --base-href=/ --build-number="${{ steps.version.outputs.build_number }}"

      - name: Cache-bust web font URLs
        run: cd apps/plot && bash scripts/cache-bust-fonts.sh

      - name: Smoke test web build
        run: |
          cd apps/plot
          npm install --silent --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/smoke-test-web.mjs --dir build/web

      - name: Upload smoke test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-artifacts
          path: apps/plot/build/smoke-test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Install wrangler
        run: pnpm install -w wrangler --ignore-scripts

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/plot/build/web --project-name=app --commit-hash ${{ env.GITHUB_SHA }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-deploy smoke test
        run: |
          cd apps/plot
          # Cloudflare Pages can take a moment to roll the new deployment to
          # the production domain. Retry the smoke test for a short window.
          attempt=1
          max_attempts=6
          until node scripts/smoke-test-web.mjs --url https://app.plot.day; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Post-deploy smoke test failed against https://app.plot.day after $attempt attempts"
              exit 1
            fi
            echo "::warning::Post-deploy smoke test attempt $attempt failed, retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Upload post-deploy smoke test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-smoke-test-artifacts
          path: apps/plot/build/smoke-test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Deployment summary
        run: |
          {
            echo "## ✅ Web App Deployment Complete"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.version_name }}"
            echo "**Build:** ${{ steps.version.outputs.build_number }}"
            echo "**Platform:** Web (Flutter)"
            echo ""
            echo "### URLs"
            echo "- Production: https://app.plot.day"
            echo "- Cloudflare Pages: Project 'app'"
          } >> "$GITHUB_STEP_SUMMARY"
