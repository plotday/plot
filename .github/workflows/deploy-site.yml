name: Deploy Site

# Triggered manually (workflow_dispatch) or as a reusable workflow called by
# Deploy Production (deploy-production.yml). No longer auto-deploys on push to
# main — production deploys must be triggered.
on:
  workflow_call:
  workflow_dispatch:

env:
  NX_NO_CLOUD: true

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-secrets:
    uses: ./.github/workflows/refresh-secrets.yml
    secrets: inherit

  deploy:
    needs: refresh-secrets
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      # Use the `...` filter suffix so pnpm also installs the dev deps of
      # workspace packages the site depends on (e.g. @plotday/pricing needs
      # @plotday/tsconfig to type-check during the build). Name-based filter
      # (not path-based) — pnpm only honors `...` on name filters.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter="." --filter="@plotday/site..."

      - name: Build
        run: pnpm exec nx build @plotday/site

      - name: Deploy secrets and variables for site
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SITE_SECRETS: ${{ secrets.SITE_SECRETS_JSON }}
          SITE_VARS: ${{ secrets.SITE_VARS }}
        run: |
          if [ -n "$SITE_SECRETS" ] && [ "$SITE_SECRETS" != "{}" ] && [ "$SITE_SECRETS" != "null" ]; then
            printf '%s' "$SITE_SECRETS" | pnpm wrangler secret bulk
          fi
          if [ -n "$SITE_VARS" ]; then
            echo "DEPLOY_VARS=$SITE_VARS" >> $GITHUB_ENV
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec nx deploy:site
