name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/deploy-site.yml"

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter="." --filter=./apps/site

      - name: Build
        run: pnpm exec nx build @plotday/site

      - name: Load secrets from .env
        uses: 1password/load-secrets-action@564bf5b01fef43a94b74742a38636197d3336379
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .env
          ENV: Production

      - name: Load secrets from .env.production
        uses: 1password/load-secrets-action@564bf5b01fef43a94b74742a38636197d3336379
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENV_FILE: .env.production
          ENV: Production

      - name: Deploy secrets and variables for site
        working-directory: apps/site
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # Read deploy_vars from package.json
          DEPLOY_VARS=$(node -pe "require('./package.json').config?.deploy_vars || ''")

          if [ -z "$DEPLOY_VARS" ]; then
            echo "No deploy_vars configured for site"
            exit 0
          fi

          echo "Deploying variables: $DEPLOY_VARS"

          # Generate all variables from .env files + 1Password
          ALL=$(../../scripts/gen-env production $DEPLOY_VARS)

          # Split into secrets (containing SECRET, KEY, or TOKEN)
          SECRETS=$(echo "$ALL" | grep -E 'SECRET|KEY|TOKEN' || true)
          SECRETS_JSON=$(echo "$SECRETS" | ../../scripts/env-to-json)

          # Split into regular variables (not containing SECRET, KEY, or TOKEN)
          VARS=$(echo "$ALL" | grep -Ev 'SECRET|KEY|TOKEN' || true)
          VARS_FORMATTED=$(echo "$VARS" | sed 's/=/:/g' | tr '\n' ' ' | sed 's/ $//')

          # Deploy secrets via wrangler secret bulk (no --env flag for site)
          if [ -n "$SECRETS_JSON" ] && [ "$SECRETS_JSON" != "{}" ]; then
            echo "Deploying secrets..."
            echo "$SECRETS_JSON" | pnpm wrangler secret bulk
          else
            echo "No secrets to deploy"
          fi

          # Export variables for deploy step
          if [ -n "$VARS_FORMATTED" ]; then
            echo "DEPLOY_VARS=$VARS_FORMATTED" >> $GITHUB_ENV
            echo "Variables to deploy: $VARS_FORMATTED"
          else
            echo "No regular variables to deploy"
          fi

      - name: Deploy
        run: pnpm exec nx deploy:site
