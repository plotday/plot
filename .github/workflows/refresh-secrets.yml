name: Refresh Secrets

# Reusable workflow: call as the first job in any deploying workflow.
# Tries to pull fresh values from 1Password into GitHub secrets.
# Always exits 0 — if 1Password is unreachable the cached values are kept.
#
# Usage in calling workflow:
#   jobs:
#     refresh-secrets:
#       uses: ./.github/workflows/refresh-secrets.yml
#       secrets: inherit
#
#     your-job:
#       needs: refresh-secrets
#       ...

on:
  workflow_call:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Sync secrets from 1Password
        continue-on-error: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if op account get &>/dev/null 2>&1; then
            bash scripts/sync-github-secrets
          else
            echo "::warning::1Password unavailable — using cached GitHub secrets"
          fi
