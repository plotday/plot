name: Refresh Secrets

# Reusable workflow: call as the first job in any deploying workflow.
# Tries to pull fresh values from 1Password into GitHub secrets.
# Always exits 0 — if 1Password is unreachable the cached values are kept.
#
# Usage in calling workflow:
#   jobs:
#     refresh-secrets:
#       uses: ./.github/workflows/refresh-secrets.yml
#       secrets: inherit
#
#     your-job:
#       needs: refresh-secrets
#       ...

on:
  workflow_call:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # Hash exactly what would be pushed (no GitHub writes). When it matches a
      # prior successful sync, the cache below short-circuits the push. If
      # 1Password is unreachable the hash is empty, which forces the sync path
      # (the existing fall-back to cached GitHub secrets still applies there).
      - name: Compute secrets hash
        id: hash
        continue-on-error: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if op account get &>/dev/null 2>&1; then
            value=$(bash scripts/sync-github-secrets --hash-only)
            echo "value=$value" >> "$GITHUB_OUTPUT"
            echo "Secrets hash: $value"
          else
            echo "::warning::1Password unavailable — will use cached GitHub secrets"
          fi

      # A cache hit means this exact secret state was already pushed — skip.
      - name: Check secrets-sync marker
        id: marker
        if: steps.hash.outputs.value != ''
        uses: actions/cache/restore@v6
        with:
          path: .secrets-sync-marker
          key: secrets-sync-${{ steps.hash.outputs.value }}

      - name: Sync secrets from 1Password
        if: steps.marker.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if op account get &>/dev/null 2>&1; then
            # Marker written only on full success, so a failed push leaves no
            # cache entry and the next run retries.
            bash scripts/sync-github-secrets && printf done > .secrets-sync-marker
          else
            echo "::warning::1Password unavailable — using cached GitHub secrets"
          fi

      # Persist the marker under the hash key so the next run with the same
      # secrets skips the push. Only after a successful sync (marker present).
      - name: Save secrets-sync marker
        if: steps.hash.outputs.value != '' && steps.marker.outputs.cache-hit != 'true' && hashFiles('.secrets-sync-marker') != ''
        uses: actions/cache/save@v6
        with:
          path: .secrets-sync-marker
          key: secrets-sync-${{ steps.hash.outputs.value }}
