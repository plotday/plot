name: Deploy Twists & Sources

env:
  TWISTS: "plot,chat"
  SOURCES: "github,gmail,google-calendar,google-contacts,google-drive,linear"

on:
  push:
    branches: [main]
    paths:
      - "twists/**"
      - "libs/**"
      - "public"
      - "public/**"
      - ".github/workflows/deploy-twists.yml"
  workflow_dispatch:
    inputs:
      twists:
        description: 'Twists to deploy (comma-separated, or "all" for all twists)'
        required: false
        default: "all"
        type: string
      sources:
        description: 'Sources to deploy (comma-separated, or "all" for all sources)'
        required: false
        default: "all"
        type: string

concurrency:
  group: deploy-twists-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      twists: ${{ steps.filter.outputs.twists }}
      sources: ${{ steps.filter.outputs.sources }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect if workflow file changed
        id: workflow_changed
        run: |
          if git diff --name-only HEAD~1 | grep -q "^.github/workflows/deploy-twists.yml$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for submodule changes
        id: submodule_check
        run: |
          if git diff --name-only HEAD~1 | grep -q "^public$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            # Get old and new submodule commits for logging
            OLD_COMMIT=$(git diff HEAD~1 -- public | grep "^-Subproject" | cut -d' ' -f3 || echo "unknown")
            NEW_COMMIT=$(git diff HEAD~1 -- public | grep "^+Subproject" | cut -d' ' -f3 || echo "unknown")
            echo "Submodule changed from $OLD_COMMIT to $NEW_COMMIT"

            # Show what changed inside the submodule (first 20 files for logging)
            if [ "$OLD_COMMIT" != "unknown" ] && [ "$NEW_COMMIT" != "unknown" ]; then
              cd public
              echo "Changed files in submodule:"
              git diff --name-only $OLD_COMMIT..$NEW_COMMIT | head -20 || true
              cd ..
            fi
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for affected twists and sources
        id: filter
        run: |
          TWIST_LIST=(${TWISTS//,/ })
          SOURCE_LIST=(${SOURCES//,/ })
          TWISTS_TO_DEPLOY=()
          SOURCES_TO_DEPLOY=()

          # Check if this is a manual dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Handle twists
            MANUAL_TWISTS="${{ github.event.inputs.twists }}"
            if [ -z "$MANUAL_TWISTS" ] || [ "$MANUAL_TWISTS" = "all" ]; then
              echo "Manual trigger: deploying all twists"
              TWISTS_TO_DEPLOY=("${TWIST_LIST[@]}")
            else
              echo "Manual trigger: deploying specified twists"
              IFS=',' read -ra INPUT_LIST <<< "$MANUAL_TWISTS"
              for twist in "${INPUT_LIST[@]}"; do
                twist=$(echo "$twist" | xargs)
                if [ -d "twists/$twist" ] || [ -d "public/twists/$twist" ]; then
                  TWISTS_TO_DEPLOY+=("$twist")
                else
                  echo "Warning: twist '$twist' not found in twists/ or public/twists/"
                fi
              done
            fi

            # Handle sources
            MANUAL_SOURCES="${{ github.event.inputs.sources }}"
            if [ -z "$MANUAL_SOURCES" ] || [ "$MANUAL_SOURCES" = "all" ]; then
              echo "Manual trigger: deploying all sources"
              SOURCES_TO_DEPLOY=("${SOURCE_LIST[@]}")
            else
              echo "Manual trigger: deploying specified sources"
              IFS=',' read -ra INPUT_LIST <<< "$MANUAL_SOURCES"
              for source in "${INPUT_LIST[@]}"; do
                source=$(echo "$source" | xargs)
                if [ -d "public/sources/$source" ]; then
                  SOURCES_TO_DEPLOY+=("$source")
                else
                  echo "Warning: source '$source' not found in public/sources/"
                fi
              done
            fi

            # Output twists
            if [ ${#TWISTS_TO_DEPLOY[@]} -eq 0 ]; then
              echo "twists=[]" >> $GITHUB_OUTPUT
              echo "No valid twists to deploy"
            else
              TWISTS_JSON=$(printf '%s\n' "${TWISTS_TO_DEPLOY[@]}" | jq -R -s -c 'split("\n")[:-1]')
              echo "twists=$TWISTS_JSON" >> $GITHUB_OUTPUT
              echo "Twists to deploy: ${TWISTS_TO_DEPLOY[*]}"
            fi

            # Output sources
            if [ ${#SOURCES_TO_DEPLOY[@]} -eq 0 ]; then
              echo "sources=[]" >> $GITHUB_OUTPUT
              echo "No valid sources to deploy"
            else
              SOURCES_JSON=$(printf '%s\n' "${SOURCES_TO_DEPLOY[@]}" | jq -R -s -c 'split("\n")[:-1]')
              echo "sources=$SOURCES_JSON" >> $GITHUB_OUTPUT
              echo "Sources to deploy: ${SOURCES_TO_DEPLOY[*]}"
            fi
            exit 0
          fi

          # If workflow file changed or submodule changed, deploy everything
          if [ "${{ steps.workflow_changed.outputs.changed }}" = "true" ] || [ "${{ steps.submodule_check.outputs.changed }}" = "true" ]; then
            REASON="Workflow file changed"
            if [ "${{ steps.submodule_check.outputs.changed }}" = "true" ]; then
              REASON="Submodule changed"
            fi

            TWISTS_JSON=$(printf '%s\n' "${TWIST_LIST[@]}" | jq -R -s -c 'split("\n")[:-1]')
            echo "twists=$TWISTS_JSON" >> $GITHUB_OUTPUT
            echo "$REASON, deploying all twists: $TWISTS_JSON"

            SOURCES_JSON=$(printf '%s\n' "${SOURCE_LIST[@]}" | jq -R -s -c 'split("\n")[:-1]')
            echo "sources=$SOURCES_JSON" >> $GITHUB_OUTPUT
            echo "$REASON, deploying all sources: $SOURCES_JSON"
            exit 0
          fi

          # Automatic deployment: only deploy changed packages
          echo "Automatic trigger: checking for affected twists and sources"
          AFFECTED_OUTPUT=$(pnpm dlx nx show projects --affected --base=${{ github.event.before }} --head=HEAD --json 2>/dev/null || echo "[]")

          for twist in "${TWIST_LIST[@]}"; do
            if echo "$AFFECTED_OUTPUT" | jq -r '.[]' 2>/dev/null | grep -q "^@plotday/twist-$twist$"; then
              TWISTS_TO_DEPLOY+=("\"$twist\"")
            fi
          done

          for source in "${SOURCE_LIST[@]}"; do
            if echo "$AFFECTED_OUTPUT" | jq -r '.[]' 2>/dev/null | grep -q "^@plotday/source-$source$"; then
              SOURCES_TO_DEPLOY+=("\"$source\"")
            fi
          done

          if [ ${#TWISTS_TO_DEPLOY[@]} -eq 0 ]; then
            echo "twists=[]" >> $GITHUB_OUTPUT
            echo "No twists have changes"
          else
            TWISTS_JSON=$(printf '%s\n' "${TWISTS_TO_DEPLOY[@]}" | jq -s . | tr -d '\n')
            echo "twists=$TWISTS_JSON" >> $GITHUB_OUTPUT
            echo "Changed twists: ${TWISTS_TO_DEPLOY[*]}"
          fi

          if [ ${#SOURCES_TO_DEPLOY[@]} -eq 0 ]; then
            echo "sources=[]" >> $GITHUB_OUTPUT
            echo "No sources have changes"
          else
            SOURCES_JSON=$(printf '%s\n' "${SOURCES_TO_DEPLOY[@]}" | jq -s . | tr -d '\n')
            echo "sources=$SOURCES_JSON" >> $GITHUB_OUTPUT
            echo "Changed sources: ${SOURCES_TO_DEPLOY[*]}"
          fi

  deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.twists != '[]'
    strategy:
      matrix:
        twist: ${{ fromJson(needs.check-changes.outputs.twists) }}

    env:
      PLOT_DEPLOY_TOKEN: ${{ secrets.PLOT_DEPLOY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build Twister
        run: |
          cd public/twister
          pnpm install --frozen-lockfile
          pnpm build

      - name: Locate twist directory
        id: locate
        run: |
          if [ -d "twists/${{ matrix.twist }}" ]; then
            echo "dir=twists/${{ matrix.twist }}" >> $GITHUB_OUTPUT
            echo "Found twist in private repo: twists/${{ matrix.twist }}"
          elif [ -d "public/twists/${{ matrix.twist }}" ]; then
            echo "dir=public/twists/${{ matrix.twist }}" >> $GITHUB_OUTPUT
            echo "Found twist in public repo: public/twists/${{ matrix.twist }}"
          else
            echo "ERROR: Twist ${{ matrix.twist }} not found in twists/ or public/twists/"
            exit 1
          fi

      - name: Install dependencies for ${{ matrix.twist }}
        run: |
          cd ${{ steps.locate.outputs.dir }}
          pnpm install --frozen-lockfile --filter="."

      - name: Deploy ${{ matrix.twist }} twist
        run: |
          cd ${{ steps.locate.outputs.dir }}
          pnpm plot deploy -e review

  deploy-sources:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.sources != '[]'
    strategy:
      matrix:
        source: ${{ fromJson(needs.check-changes.outputs.sources) }}

    env:
      PLOT_DEPLOY_TOKEN: ${{ secrets.PLOT_DEPLOY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build Twister
        run: |
          cd public/twister
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies for ${{ matrix.source }}
        run: |
          cd public/sources/${{ matrix.source }}
          pnpm install --frozen-lockfile --filter="."

      - name: Deploy ${{ matrix.source }} source
        run: |
          cd public/sources/${{ matrix.source }}
          pnpm plot deploy -e review
