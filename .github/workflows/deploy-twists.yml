name: Deploy Twists & Connectors

env:
  NX_NO_CLOUD: true

# Triggered manually (workflow_dispatch) or as a reusable workflow called by
# Deploy Production (deploy-production.yml). No longer auto-deploys on push to
# main — production deploys must be triggered. Keep the input list in sync
# between workflow_call and workflow_dispatch below.
on:
  workflow_call:
    inputs:
      twists:
        description: 'Twists to deploy (comma-separated, or "all" for all twists)'
        required: false
        default: "all"
        type: string
      connectors:
        description: 'Connectors to deploy (comma-separated, or "all" for all connectors)'
        required: false
        default: "all"
        type: string
  workflow_dispatch:
    inputs:
      twists:
        description: 'Twists to deploy (comma-separated, or "all" for all twists)'
        required: false
        default: "all"
        type: string
      connectors:
        description: 'Connectors to deploy (comma-separated, or "all" for all connectors)'
        required: false
        default: "all"
        type: string

concurrency:
  group: deploy-twists-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-for-workers:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Deploy Workers to complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          echo "Checking for Deploy Workers run at commit $SHA"

          # Initial delay to let GitHub queue both workflows
          sleep 15

          # Poll for the deploy-workers run
          TIMEOUT=1800  # 30 minutes
          INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Find a deploy-workers run for this commit
            RUN_JSON=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=deploy-workers.yml \
              --commit="$SHA" \
              --json status,conclusion,databaseId \
              --limit 1 2>/dev/null || echo "[]")

            RUN_COUNT=$(echo "$RUN_JSON" | jq length)

            if [ "$RUN_COUNT" -eq 0 ]; then
              echo "No Deploy Workers run found for this commit. Proceeding."
              exit 0
            fi

            STATUS=$(echo "$RUN_JSON" | jq -r '.[0].status')
            CONCLUSION=$(echo "$RUN_JSON" | jq -r '.[0].conclusion')
            RUN_ID=$(echo "$RUN_JSON" | jq -r '.[0].databaseId')

            echo "Deploy Workers run $RUN_ID: status=$STATUS conclusion=$CONCLUSION (${ELAPSED}s elapsed)"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Deploy Workers completed successfully. Proceeding."
                exit 0
              else
                echo "Deploy Workers failed with conclusion: $CONCLUSION. Aborting."
                exit 1
              fi
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Timed out waiting for Deploy Workers after ${TIMEOUT}s. Aborting."
          exit 1

  check-changes:
    needs: wait-for-workers
    runs-on: ubuntu-latest
    outputs:
      twists: ${{ steps.filter.outputs.twists }}
      connectors: ${{ steps.filter.outputs.connectors }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect if workflow file changed
        id: workflow_changed
        run: |
          if git diff --name-only HEAD~1 | grep -q "^.github/workflows/deploy-twists.yml$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for submodule changes
        id: submodule_check
        run: |
          if git diff --name-only HEAD~1 | grep -q "^public$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            # Get old and new submodule commits for logging
            OLD_COMMIT=$(git diff HEAD~1 -- public | grep "^-Subproject" | cut -d' ' -f3 || echo "unknown")
            NEW_COMMIT=$(git diff HEAD~1 -- public | grep "^+Subproject" | cut -d' ' -f3 || echo "unknown")
            echo "Submodule changed from $OLD_COMMIT to $NEW_COMMIT"

            # Show what changed inside the submodule (first 20 files for logging)
            if [ "$OLD_COMMIT" != "unknown" ] && [ "$NEW_COMMIT" != "unknown" ]; then
              cd public
              echo "Changed files in submodule:"
              git diff --name-only $OLD_COMMIT..$NEW_COMMIT | head -20 || true
              cd ..
            fi
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Discover all twists and connectors
        id: discover
        run: |
          # Discover twists: directories in twists/ or public/twists/ with a plotTwistId in package.json
          ALL_TWISTS=()
          for dir in twists/*/package.json public/twists/*/package.json; do
            [ -f "$dir" ] || continue
            if jq -e '.plotTwistId' "$dir" > /dev/null 2>&1; then
              ALL_TWISTS+=("$(basename "$(dirname "$dir")")")
            fi
          done

          # Discover connectors: directories in connectors/ or public/connectors/
          # with a plotTwistId in package.json
          ALL_CONNECTORS=()
          for dir in connectors/*/package.json public/connectors/*/package.json; do
            [ -f "$dir" ] || continue
            if jq -e '.plotTwistId' "$dir" > /dev/null 2>&1; then
              ALL_CONNECTORS+=("$(basename "$(dirname "$dir")")")
            fi
          done

          echo "Discovered twists: ${ALL_TWISTS[*]}"
          echo "Discovered connectors: ${ALL_CONNECTORS[*]}"

          # Save as comma-separated for later steps
          ALL_TWISTS_CSV=$(IFS=,; echo "${ALL_TWISTS[*]}")
          ALL_CONNECTORS_CSV=$(IFS=,; echo "${ALL_CONNECTORS[*]}")
          echo "all_twists=$ALL_TWISTS_CSV" >> $GITHUB_OUTPUT
          echo "all_connectors=$ALL_CONNECTORS_CSV" >> $GITHUB_OUTPUT

          # Validate connectors/deploy.json: every listed package must be discovered.
          if [ -f connectors/deploy.json ]; then
            DISCOVERED_NAMES=""
            for dir in connectors/*/package.json public/connectors/*/package.json; do
              [ -f "$dir" ] || continue
              jq -e '.plotTwistId' "$dir" > /dev/null 2>&1 && DISCOVERED_NAMES+="$(jq -r '.name' "$dir")"$'\n'
            done
            MISSING=0
            for name in $(jq -r '.public[]' connectors/deploy.json); do
              if ! printf '%s' "$DISCOVERED_NAMES" | grep -qxF "$name"; then
                echo "::error::connectors/deploy.json lists unknown connector: $name"
                MISSING=1
              fi
            done
            [ "$MISSING" -eq 0 ] || exit 1
          fi

      - name: Check for affected twists and connectors
        id: filter
        run: |
          # Parse discovered lists
          IFS=',' read -ra TWIST_LIST <<< "${{ steps.discover.outputs.all_twists }}"
          IFS=',' read -ra CONNECTOR_LIST <<< "${{ steps.discover.outputs.all_connectors }}"
          TWISTS_TO_DEPLOY=()
          CONNECTORS_TO_DEPLOY=()

          # Check if this is a manual dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Handle twists
            MANUAL_TWISTS="${{ inputs.twists }}"
            if [ "$MANUAL_TWISTS" = "all" ]; then
              echo "Manual trigger: deploying all twists"
              TWISTS_TO_DEPLOY=("${TWIST_LIST[@]}")
            elif [ -n "$MANUAL_TWISTS" ]; then
              echo "Manual trigger: deploying specified twists"
              IFS=',' read -ra INPUT_LIST <<< "$MANUAL_TWISTS"
              for twist in "${INPUT_LIST[@]}"; do
                twist=$(echo "$twist" | xargs)
                if [ -d "twists/$twist" ] || [ -d "public/twists/$twist" ]; then
                  TWISTS_TO_DEPLOY+=("$twist")
                else
                  echo "Warning: twist '$twist' not found in twists/ or public/twists/"
                fi
              done
            else
              echo "Manual trigger: no twists specified, skipping"
            fi

            # Handle connectors
            MANUAL_CONNECTORS="${{ inputs.connectors }}"
            if [ "$MANUAL_CONNECTORS" = "all" ]; then
              echo "Manual trigger: deploying all connectors"
              CONNECTORS_TO_DEPLOY=("${CONNECTOR_LIST[@]}")
            elif [ -n "$MANUAL_CONNECTORS" ]; then
              echo "Manual trigger: deploying specified connectors"
              IFS=',' read -ra INPUT_LIST <<< "$MANUAL_CONNECTORS"
              for connector in "${INPUT_LIST[@]}"; do
                connector=$(echo "$connector" | xargs)
                if [ -d "connectors/$connector" ] || [ -d "public/connectors/$connector" ]; then
                  CONNECTORS_TO_DEPLOY+=("$connector")
                else
                  echo "Warning: connector '$connector' not found in connectors/ or public/connectors/"
                fi
              done
            else
              echo "Manual trigger: no connectors specified, skipping"
            fi

            # Output twists
            if [ ${#TWISTS_TO_DEPLOY[@]} -eq 0 ]; then
              echo "twists=[]" >> $GITHUB_OUTPUT
              echo "No valid twists to deploy"
            else
              TWISTS_JSON=$(printf '%s\n' "${TWISTS_TO_DEPLOY[@]}" | jq -R -s -c 'split("\n")[:-1]')
              echo "twists=$TWISTS_JSON" >> $GITHUB_OUTPUT
              echo "Twists to deploy: ${TWISTS_TO_DEPLOY[*]}"
            fi

            # Output connectors
            if [ ${#CONNECTORS_TO_DEPLOY[@]} -eq 0 ]; then
              echo "connectors=[]" >> $GITHUB_OUTPUT
              echo "No valid connectors to deploy"
            else
              CONNECTORS_JSON=$(printf '%s\n' "${CONNECTORS_TO_DEPLOY[@]}" | jq -R -s -c 'split("\n")[:-1]')
              echo "connectors=$CONNECTORS_JSON" >> $GITHUB_OUTPUT
              echo "Connectors to deploy: ${CONNECTORS_TO_DEPLOY[*]}"
            fi
            exit 0
          fi

          # If workflow file changed or submodule changed, deploy everything
          if [ "${{ steps.workflow_changed.outputs.changed }}" = "true" ] || [ "${{ steps.submodule_check.outputs.changed }}" = "true" ]; then
            REASON="Workflow file changed"
            if [ "${{ steps.submodule_check.outputs.changed }}" = "true" ]; then
              REASON="Submodule changed"
            fi

            TWISTS_JSON=$(printf '%s\n' "${TWIST_LIST[@]}" | jq -R -s -c 'split("\n")[:-1]')
            echo "twists=$TWISTS_JSON" >> $GITHUB_OUTPUT
            echo "$REASON, deploying all twists: $TWISTS_JSON"

            CONNECTORS_JSON=$(printf '%s\n' "${CONNECTOR_LIST[@]}" | jq -R -s -c 'split("\n")[:-1]')
            echo "connectors=$CONNECTORS_JSON" >> $GITHUB_OUTPUT
            echo "$REASON, deploying all connectors: $CONNECTORS_JSON"
            exit 0
          fi

          # Automatic deployment: only deploy changed packages
          echo "Automatic trigger: checking for affected twists and connectors"
          AFFECTED_OUTPUT=$(pnpm dlx nx show projects --affected --base=${{ github.event.before }} --head=HEAD --json 2>/dev/null || echo "[]")

          for twist in "${TWIST_LIST[@]}"; do
            if echo "$AFFECTED_OUTPUT" | jq -r '.[]' 2>/dev/null | grep -q "^@plotday/twist-$twist$"; then
              TWISTS_TO_DEPLOY+=("\"$twist\"")
            fi
          done

          for connector in "${CONNECTOR_LIST[@]}"; do
            if echo "$AFFECTED_OUTPUT" | jq -r '.[]' 2>/dev/null | grep -q "^@plotday/connector-$connector$"; then
              CONNECTORS_TO_DEPLOY+=("\"$connector\"")
            fi
          done

          if [ ${#TWISTS_TO_DEPLOY[@]} -eq 0 ]; then
            echo "twists=[]" >> $GITHUB_OUTPUT
            echo "No twists have changes"
          else
            TWISTS_JSON=$(printf '%s\n' "${TWISTS_TO_DEPLOY[@]}" | jq -s . | tr -d '\n')
            echo "twists=$TWISTS_JSON" >> $GITHUB_OUTPUT
            echo "Changed twists: ${TWISTS_TO_DEPLOY[*]}"
          fi

          if [ ${#CONNECTORS_TO_DEPLOY[@]} -eq 0 ]; then
            echo "connectors=[]" >> $GITHUB_OUTPUT
            echo "No connectors have changes"
          else
            CONNECTORS_JSON=$(printf '%s\n' "${CONNECTORS_TO_DEPLOY[@]}" | jq -s . | tr -d '\n')
            echo "connectors=$CONNECTORS_JSON" >> $GITHUB_OUTPUT
            echo "Changed connectors: ${CONNECTORS_TO_DEPLOY[*]}"
          fi

  deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.twists != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        twist: ${{ fromJson(needs.check-changes.outputs.twists) }}

    env:
      PLOT_DEPLOY_TOKEN: ${{ secrets.PLOT_DEPLOY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Locate twist directory
        id: locate
        env:
          TWIST: ${{ matrix.twist }}
        run: |
          if [ -d "twists/$TWIST" ]; then
            DIR="twists/$TWIST"
          elif [ -d "public/twists/$TWIST" ]; then
            DIR="public/twists/$TWIST"
          else
            echo "ERROR: Twist $TWIST not found in twists/ or public/twists/"
            exit 1
          fi
          NAME=$(jq -r '.name' "$DIR/package.json")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Found twist $NAME at $DIR"

      # Install from the root workspace so a stale public/pnpm-lock.yaml in
      # any other connector/twist can't block this deploy. Twister must be
      # installed and built before the twist is installed, so its generated
      # bin/plot.cjs exists when pnpm links `.bin/plot` in the twist's
      # node_modules.
      - name: Install Twister dependencies
        run: pnpm install --frozen-lockfile --filter=@plotday/twister

      - name: Build Twister
        run: pnpm --filter=@plotday/twister build

      # Use the `...` filter suffix so pnpm also installs deps of workspace
      # packages the twist depends on (e.g. one connector importing another).
      # Name-based filter (not path-based) — pnpm only honors `...` on name
      # filters. Use the actual package name from package.json since the
      # directory name doesn't always match (e.g. twists/twist-creator →
      # @plotday/twist-creator, not @plotday/twist-twist-creator).
      - name: Install twist dependencies
        env:
          PKG: ${{ steps.locate.outputs.name }}
        run: pnpm install --frozen-lockfile --filter=@plotday/twister --filter="${PKG}..."

      - name: Deploy ${{ matrix.twist }} twist
        run: |
          cd ${{ steps.locate.outputs.dir }}
          pnpm plot deploy -e review

  deploy-connectors:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.connectors != '[]'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        connector: ${{ fromJson(needs.check-changes.outputs.connectors) }}

    env:
      PLOT_DEPLOY_TOKEN: ${{ secrets.PLOT_DEPLOY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Locate connector directory
        id: locate
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          if [ -d "connectors/$CONNECTOR" ]; then
            DIR="connectors/$CONNECTOR"
          elif [ -d "public/connectors/$CONNECTOR" ]; then
            DIR="public/connectors/$CONNECTOR"
          else
            echo "ERROR: connector $CONNECTOR not found in connectors/ or public/connectors/"
            exit 1
          fi
          NAME=$(jq -r '.name' "$DIR/package.json")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Found connector $NAME at $DIR"

      # Install from the root workspace so a stale public/pnpm-lock.yaml in
      # any other connector/twist can't block this deploy. Twister must be
      # installed and built before the connector is installed, so its
      # generated bin/plot.cjs exists when pnpm links `.bin/plot` in the
      # connector's node_modules.
      - name: Install Twister dependencies
        run: pnpm install --frozen-lockfile --filter=@plotday/twister

      - name: Build Twister
        run: pnpm --filter=@plotday/twister build

      # Use the `...` filter suffix so pnpm also installs deps of workspace
      # packages the connector depends on (e.g. google-calendar imports
      # google-contacts). Name-based filter (not path-based) — pnpm only
      # honors `...` on name filters.
      - name: Install connector dependencies
        env:
          PKG: ${{ steps.locate.outputs.name }}
        run: pnpm install --frozen-lockfile --filter=@plotday/twister --filter="${PKG}..."

      - name: Deploy ${{ matrix.connector }} connector
        env:
          NAME: ${{ steps.locate.outputs.name }}
        run: |
          if jq -e --arg n "$NAME" '.public | index($n)' connectors/deploy.json > /dev/null; then
            TARGET_ENV=public
          else
            TARGET_ENV=review
          fi
          echo "Deploying $NAME to $TARGET_ENV"
          cd ${{ steps.locate.outputs.dir }}
          pnpm plot deploy -e "$TARGET_ENV"
