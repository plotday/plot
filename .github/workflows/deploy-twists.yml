name: Deploy Twists

env:
  TWISTS: "plot"

on:
  push:
    branches: [main]
    paths:
      - "twists/**"
      - "libs/**"
      - "public/**"
      - ".github/workflows/deploy-twists.yml"
  workflow_dispatch:
    inputs:
      twists:
        description: 'Twists to deploy (comma-separated, or "all" for all twists)'
        required: false
        default: 'all'
        type: string

concurrency:
  group: deploy-twists-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      twists: ${{ steps.filter.outputs.twists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Detect if workflow file changed
        id: workflow_changed
        run: |
          if git diff --name-only HEAD~1 | grep -q "^.github/workflows/deploy-twists.yml$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for affected twists
        id: filter
        run: |
          TWIST_LIST=(${TWISTS//,/ })
          TWISTS_TO_DEPLOY=()

          # Check if this is a manual dispatch with specific twists
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MANUAL_INPUT="${{ github.event.inputs.twists }}"

            if [ -z "$MANUAL_INPUT" ] || [ "$MANUAL_INPUT" = "all" ]; then
              # Deploy all twists
              echo "Manual trigger: deploying all twists"
              TWISTS_TO_DEPLOY=("${TWIST_LIST[@]}")
            else
              # Deploy specific twists from comma-separated input
              echo "Manual trigger: deploying specified twists"
              IFS=',' read -ra INPUT_LIST <<< "$MANUAL_INPUT"
              for twist in "${INPUT_LIST[@]}"; do
                # Trim whitespace
                twist=$(echo "$twist" | xargs)
                if [ -d "twists/$twist" ]; then
                  TWISTS_TO_DEPLOY+=("$twist")
                else
                  echo "Warning: twist '$twist' not found"
                fi
              done
            fi

            if [ ${#TWISTS_TO_DEPLOY[@]} -eq 0 ]; then
              echo "twists=[]" >> $GITHUB_OUTPUT
              echo "No valid twists to deploy"
            else
              TWISTS_JSON=$(printf '%s\n' "${TWISTS_TO_DEPLOY[@]}" | jq -R -s -c 'split("\n")[:-1]')
              echo "twists=$TWISTS_JSON" >> $GITHUB_OUTPUT
              echo "Twists to deploy: ${TWISTS_TO_DEPLOY[*]}"
            fi
            exit 0
          fi

          # If workflow file changed, deploy all twists
          if [ "${{ steps.workflow_changed.outputs.changed }}" = "true" ]; then
            TWISTS_JSON=$(printf '%s\n' "${TWIST_LIST[@]}" | jq -R -s -c 'split("\n")[:-1]')
            echo "twists=$TWISTS_JSON" >> $GITHUB_OUTPUT
            echo "Workflow file changed, deploying all twists: $TWISTS_JSON"
            exit 0
          fi

          # Automatic deployment: only deploy changed twists
          echo "Automatic trigger: checking for affected twists"
          for twist in "${TWIST_LIST[@]}"; do
            AFFECTED_OUTPUT=$(pnpm dlx nx show projects --affected --base=${{ github.event.before }} --head=HEAD --json 2>/dev/null || echo "[]")
            if echo "$AFFECTED_OUTPUT" | jq -r '.[]' 2>/dev/null | grep -q "^@plotday/twist-$twist$"; then
              TWISTS_TO_DEPLOY+=("\"$twist\"")
            fi
          done

          if [ ${#TWISTS_TO_DEPLOY[@]} -eq 0 ]; then
            echo "twists=[]" >> $GITHUB_OUTPUT
            echo "No twists have changes"
          else
            TWISTS_JSON=$(printf '%s\n' "${TWISTS_TO_DEPLOY[@]}" | jq -s . | tr -d '\n')
            echo "twists=$TWISTS_JSON" >> $GITHUB_OUTPUT
            echo "Changed twists: ${TWISTS_TO_DEPLOY[*]}"
          fi

  deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.twists != '[]'
    strategy:
      matrix:
        twist: ${{ fromJson(needs.check-changes.outputs.twists) }}

    env:
      PLOT_DEPLOY_TOKEN: ${{ secrets.PLOT_DEPLOY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build Twister
        run: |
          cd public/twister
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies for ${{ matrix.twist }}
        run: |
          cd twists/${{ matrix.twist }}
          pnpm install --frozen-lockfile --filter="."

      - name: Deploy ${{ matrix.twist }} twist
        run: |
          cd twists/${{ matrix.twist }}
          pnpm plot deploy -e review
