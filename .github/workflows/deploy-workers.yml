name: Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "libs/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build SDK
        run: |
          cd public/builder
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install root dependencies only
        run: pnpm install --ignore-scripts --frozen-lockfile --filter="."

      - name: Check for changes
        id: filter
        run: |
          WORKERS=()

          # Check each worker for changes
          for worker in api calendar-webhook contact-sync event-sync mailer onboarding sync; do
            # Check if worker has changes by looking at affected projects
            AFFECTED_OUTPUT=$(pnpm exec nx show projects --affected --base=HEAD~1 --head=HEAD --json 2>/dev/null || echo "[]")
            if echo "$AFFECTED_OUTPUT" | jq -r '.[]' 2>/dev/null | grep -q "^@plotday/$worker$"; then
              WORKERS+=("\"$worker\"")
            fi
          done

          # Convert array to JSON array
          if [ ${#WORKERS[@]} -eq 0 ]; then
            echo "workers=[]" >> $GITHUB_OUTPUT
            echo "No workers have changes"
          else
            WORKERS_JSON=$(printf '%s\n' "${WORKERS[@]}" | jq -s . | tr -d '\n')
            echo "workers=$WORKERS_JSON" >> $GITHUB_OUTPUT
            echo "Changed workers: ${WORKERS[*]}"
          fi

  deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.workers != '[]'
    strategy:
      matrix:
        worker: ${{ fromJson(needs.check-changes.outputs.workers) }}

    env:
      SKIP_PYTHON: 1
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN}}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Load secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://Production/Cloudflare/username
          CLOUDFLARE_API_TOKEN: op://Production/Cloudflare/credential
          POSTHOG_HOST: op://Production/PostHog/hostname
          POSTHOG_PROJECT: op://Production/PostHog/username
          POSTHOG_CLI_KEY: op://Production/PostHog/sourcemaps/credential

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build SDK
        run: |
          cd public/builder
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies
        run: pnpm install

      - name: Deploy ${{ matrix.worker }}
        run: pnpm exec nx deploy @plotday/${{ matrix.worker }}
