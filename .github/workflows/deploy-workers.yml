name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Check for changes
        id: filter
        run: |
          WORKERS=()

          # Check each worker for changes
          for worker in api calendar-webhook contact-sync event-sync mailer onboarding sync; do
            # Use nx to check if the worker project has changes
            if pnpm dlx nx show projects --affected --base=HEAD~1 --head=HEAD --json | jq -r '.[]' | grep -q "^@plotday/$worker$"; then
              WORKERS+=("\"$worker\"")
            fi
          done

          # Convert array to JSON array
          WORKERS_JSON=$(printf '%s\n' "${WORKERS[@]}" | jq -s .)
          echo "workers=$WORKERS_JSON" >> $GITHUB_OUTPUT

  deploy:
    needs: check-changes
    runs-on: ubuntu-latest
    if: needs.check-changes.outputs.workers != '[]'
    strategy:
      matrix:
        worker: ${{ fromJson(needs.check-changes.outputs.workers) }}

    env:
      SKIP_PYTHON: 1
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN}}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN}}

    steps:
      - uses: actions/checkout@v4

      - name: Load secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://Production/Cloudflare/username
          CLOUDFLARE_API_TOKEN: op://Production/Cloudflare/credential

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Deploy ${{ matrix.worker }}
        run: pnpm exec nx deploy @plotday/${{ matrix.worker }}
