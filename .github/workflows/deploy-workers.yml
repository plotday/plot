name: Deploy Workers

# Triggered manually (workflow_dispatch) or as a reusable workflow called by
# Deploy Production (deploy-production.yml). No longer auto-deploys on push to
# main — production deploys must be triggered. Keep the input list in sync
# between workflow_call and workflow_dispatch below.
on:
  workflow_call:
    inputs:
      api:
        description: 'Deploy API'
        type: boolean
        default: true
      beat:
        description: 'Deploy Beat'
        type: boolean
        default: true
      mailer:
        description: 'Deploy Mailer'
        type: boolean
        default: true
      migrate_only:
        description: "Only run migrations, skip worker deployment"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      api:
        description: 'Deploy API'
        type: boolean
        default: true
      beat:
        description: 'Deploy Beat'
        type: boolean
        default: true
      mailer:
        description: 'Deploy Mailer'
        type: boolean
        default: true
      migrate_only:
        description: "Only run migrations, skip worker deployment"
        required: false
        default: false
        type: boolean

env:
  NX_NO_CLOUD: true

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-secrets:
    uses: ./.github/workflows/refresh-secrets.yml
    secrets: inherit

  check-changes:
    needs: refresh-secrets
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      # Install from the root workspace (not public/) so we don't depend on
      # public/pnpm-lock.yaml being in sync with every connector's
      # package.json. A broken public lockfile should not block workers.
      - name: Install dependencies for Twister + root
        run: pnpm install --ignore-scripts --frozen-lockfile --filter=@plotday/twister --filter=.

      - name: Build Twister
        run: pnpm --filter=@plotday/twister build

      - name: Check for changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_API: ${{ inputs.api }}
          INPUT_BEAT: ${{ inputs.beat }}
          INPUT_MAILER: ${{ inputs.mailer }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          WORKERS=()

          # Check if this is a manual dispatch with checkbox inputs
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger: deploying selected workers"
            if [ "$INPUT_API" = "true" ]; then WORKERS+=("\"api\""); fi
            if [ "$INPUT_BEAT" = "true" ]; then WORKERS+=("\"beat\""); fi
            if [ "$INPUT_MAILER" = "true" ]; then WORKERS+=("\"mailer\""); fi
          else
            # Automatic deployment: only deploy changed workers.
            #
            # `nx affected` runs at the workspace root and only sees the
            # parent repo's diff. A submodule pointer change shows up as a
            # single "public" path, which nx can't map to a project. Walk
            # into the submodule and decide whether any worker is actually
            # affected:
            #   - public/twister/**  → api (imports @plotday/twister)
            #   - public/connectors/**, public/twists/**  → NOT a worker
            #     change. Connectors and twists deploy as their own
            #     Cloudflare workers (via Deploy Twists & Connectors) and
            #     are loaded dynamically by the api at runtime via R2,
            #     not bundled into the api worker.
            #   - any other submodule path (lockfile, root configs)  →
            #     conservatively redeploy api.
            #
            # Without this narrowing, every "Update public" commit drains
            # the api worker's dynamic Worker Loader cache, evicting every
            # warm twist isolate and surfacing as "Network connection
            # lost" in scheduled tasks that were mid-RPC.
            SUBMODULE_NEEDS_API="false"
            SUBMODULE_HANDLED="false"
            if git diff --name-only "$BEFORE_SHA" HEAD | grep -qx public; then
              SUBMODULE_HANDLED="true"
              OLD_COMMIT=$(git diff "$BEFORE_SHA" HEAD -- public | awk '/^-Subproject commit/ {print $3}')
              NEW_COMMIT=$(git diff "$BEFORE_SHA" HEAD -- public | awk '/^\+Subproject commit/ {print $3}')
              if [ -n "$OLD_COMMIT" ] && [ -n "$NEW_COMMIT" ]; then
                SUB_DIFF=$(cd public && git diff --name-only "$OLD_COMMIT" "$NEW_COMMIT" 2>/dev/null || echo "")
                echo "Submodule pointer: $OLD_COMMIT -> $NEW_COMMIT"
                echo "Submodule files changed (first 30):"
                printf '%s\n' "$SUB_DIFF" | head -30 | sed 's/^/  /'

                # Anything outside connectors/ and twists/ may affect a
                # worker: twister/ exports are bundled into api, and
                # lockfile / root config changes can shift transitive
                # bundle output.
                if printf '%s\n' "$SUB_DIFF" | grep -qvE "^(connectors|twists)/"; then
                  echo "Submodule change includes non-connector/twist paths — api needs redeploy."
                  SUBMODULE_NEEDS_API="true"
                else
                  echo "Submodule change is connectors/twists only — no worker redeploy needed."
                fi
              else
                echo "Could not determine submodule commit range — conservatively redeploying api."
                SUBMODULE_NEEDS_API="true"
              fi
            fi

            echo "Automatic trigger: checking for affected workers"
            for worker_dir in workers/*/; do
              worker=$(basename "$worker_dir")

              # Skip workers without a deploy script (e.g. dev)
              if ! node -pe "!!require('./workers/' + '$worker' + '/package.json').scripts?.deploy" 2>/dev/null | grep -q "true"; then
                continue
              fi

              # Check if worker has changes by looking at affected projects
              AFFECTED_OUTPUT=$(pnpm exec nx show projects --affected --base="$BEFORE_SHA" --head=HEAD --json 2>/dev/null || echo "[]")
              if echo "$AFFECTED_OUTPUT" | jq -r '.[]' 2>/dev/null | grep -q "^@plotday/$worker$"; then
                WORKERS+=("\"$worker\"")
              fi
            done

            # Belt-and-suspenders: every consumer of libs/email bundles its
            # EmailType registry at build time, so a shared-template change
            # that lands without redeploying a consumer leaves production
            # throwing "Unknown email type" on the next invocation. nx
            # --affected should catch this via workspace:^ deps, but we
            # force the redeploy explicitly to eliminate any drift window.
            if git diff --name-only "$BEFORE_SHA" HEAD -- libs/email/ | grep -q .; then
              echo "libs/email changed — forcing redeploy of all email consumers"
              for worker in api mailer; do
                if ! printf '%s\n' "${WORKERS[@]}" | grep -qx "\"$worker\""; then
                  WORKERS+=("\"$worker\"")
                fi
              done
            fi

            # Submodule diff says api needs to be in the set, but nx
            # didn't pick it up (because nx can't see inside the
            # submodule). Add it.
            if [ "$SUBMODULE_NEEDS_API" = "true" ]; then
              if ! printf '%s\n' "${WORKERS[@]}" | grep -qx "\"api\""; then
                echo "Adding api to deploy set due to submodule change."
                WORKERS+=("\"api\"")
              fi
            fi

            # Conversely: if the ONLY parent-repo change was the submodule
            # pointer and the submodule diff is connectors/twists only,
            # nx may have spuriously reported a worker as affected (e.g.
            # via an implicit dep on `public`). Trust the submodule
            # narrowing in that case and clear the worker list.
            if [ "$SUBMODULE_HANDLED" = "true" ] && [ "$SUBMODULE_NEEDS_API" = "false" ]; then
              PARENT_NON_PUBLIC=$(git diff --name-only "$BEFORE_SHA" HEAD | grep -vx public || true)
              if [ -z "$PARENT_NON_PUBLIC" ]; then
                echo "Parent repo only changed the submodule pointer and submodule diff is connectors/twists only — skipping all workers."
                WORKERS=()
              fi
            fi
          fi

          # Convert array to JSON array
          if [ ${#WORKERS[@]} -eq 0 ]; then
            echo "workers=[]" >> $GITHUB_OUTPUT
            echo "No workers to deploy"
          else
            WORKERS_JSON=$(printf '%s\n' "${WORKERS[@]}" | jq -s . | tr -d '\n')
            echo "workers=$WORKERS_JSON" >> $GITHUB_OUTPUT
            echo "Workers to deploy: ${WORKERS[*]}"
          fi

  migrate-lint:
    needs: refresh-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=@plotday/db

      - name: Install Atlas
        uses: ariga/setup-atlas@v0

      - name: Start ephemeral Postgres
        run: cd libs/db && pnpm run start

      - name: Apply migrations and run plpgsql_check
        run: cd libs/db && pnpm run apply-migrations

  migrate:
    needs: [refresh-secrets, migrate-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history incl. deploy/* tags — the contract drain uses the
          # previous deploy tag as its soak boundary.
          fetch-depth: 0

      - name: Install Atlas
        uses: ariga/setup-atlas@v0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Download and start Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.21.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy plot-core:northamerica-northeast2:plot-prod \
            --port=5432 &
          sleep 3

      # Apply destructive "contract" migrations that have SOAKED — committed
      # before the previous deploy tag, so the workers that stopped using the
      # dropped column have been live since that deploy. Runs BEFORE the expand
      # migrations and before workers deploy; contracts from this deploy's batch
      # wait for the next deploy. No-op when nothing has soaked.
      # See libs/db/scripts/drain-contracts.sh.
      - name: Drain soaked contract migrations
        working-directory: libs/db
        env:
          MIGRATOR_PASSWORD: ${{ secrets.MIGRATOR_PASSWORD }}
        run: |
          MIGRATE_URL="postgres://migrator:${MIGRATOR_PASSWORD}@localhost:5432/plot?sslmode=disable" \
            ./scripts/drain-contracts.sh

      - name: Apply pending migrations
        working-directory: libs/db
        env:
          MIGRATOR_PASSWORD: ${{ secrets.MIGRATOR_PASSWORD }}
        run: |
          atlas migrate apply \
            --dir "file://migrations" \
            --url "postgres://migrator:${MIGRATOR_PASSWORD}@localhost:5432/plot?sslmode=disable"

  deploy:
    needs: [check-changes, migrate]
    runs-on: ubuntu-latest
    if: |
      needs.check-changes.outputs.workers != '[]' &&
      inputs.migrate_only != true
    strategy:
      matrix:
        worker: ${{ fromJson(needs.check-changes.outputs.workers) }}

    env:
      SKIP_PYTHON: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Twister
        run: pnpm --filter=@plotday/twister build

      - name: Deploy secrets and variables for ${{ matrix.worker }}
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_CONFIGS: ${{ secrets.WORKER_CONFIGS_JSON }}
        run: |
          WORKER="${{ matrix.worker }}"
          SECRETS_JSON=$(printf '%s' "$WORKER_CONFIGS" | jq -c ".\"$WORKER\".secrets // {}")
          VARS_FORMATTED=$(printf '%s' "$WORKER_CONFIGS" | jq -r ".\"$WORKER\".vars // \"\"")

          if [ "$SECRETS_JSON" != "{}" ] && [ "$SECRETS_JSON" != "null" ]; then
            echo "Deploying secrets..."
            printf '%s' "$SECRETS_JSON" | pnpm wrangler secret bulk --env production
          else
            echo "No secrets to deploy"
          fi

          if [ -n "$VARS_FORMATTED" ]; then
            echo "DEPLOY_VARS=$VARS_FORMATTED" >> $GITHUB_ENV
            echo "Variables to deploy: $VARS_FORMATTED"
          else
            echo "No regular variables to deploy"
          fi

      - name: Deploy ${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          POSTHOG_PROJECT: ${{ secrets.POSTHOG_PROJECT }}
          POSTHOG_CLI_KEY: ${{ secrets.POSTHOG_CLI_KEY }}
        run: pnpm exec nx deploy @plotday/${{ matrix.worker }}
