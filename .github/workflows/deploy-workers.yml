name: Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "libs/**"
      - "public/twister/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:
    inputs:
      workers:
        description: 'Workers to deploy (comma-separated, or "all" for all workers)'
        required: false
        default: "all"
        type: string
      migrate_only:
        description: "Only run migrations, skip worker deployment"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build SDK
        run: |
          cd public/twister
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install root dependencies only
        run: pnpm install --ignore-scripts --frozen-lockfile --filter="."

      - name: Check for changes
        id: filter
        run: |
          WORKERS=()

          # Check if this is a manual dispatch with specific workers
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MANUAL_INPUT="${{ github.event.inputs.workers }}"

            if [ -z "$MANUAL_INPUT" ] || [ "$MANUAL_INPUT" = "all" ]; then
              # Deploy all workers
              echo "Manual trigger: deploying all workers"
              for worker_dir in workers/*/; do
                worker=$(basename "$worker_dir")
                WORKERS+=("\"$worker\"")
              done
            else
              # Deploy specific workers from comma-separated input
              echo "Manual trigger: deploying specified workers"
              IFS=',' read -ra WORKER_LIST <<< "$MANUAL_INPUT"
              for worker in "${WORKER_LIST[@]}"; do
                # Trim whitespace
                worker=$(echo "$worker" | xargs)
                if [ -d "workers/$worker" ]; then
                  WORKERS+=("\"$worker\"")
                else
                  echo "Warning: worker '$worker' not found"
                fi
              done
            fi
          else
            # Automatic deployment: only deploy changed workers
            echo "Automatic trigger: checking for affected workers"
            for worker_dir in workers/*/; do
              worker=$(basename "$worker_dir")

              # Check if worker has changes by looking at affected projects
              AFFECTED_OUTPUT=$(pnpm exec nx show projects --affected --base=${{ github.event.before }} --head=HEAD --json 2>/dev/null || echo "[]")
              if echo "$AFFECTED_OUTPUT" | jq -r '.[]' 2>/dev/null | grep -q "^@plotday/$worker$"; then
                WORKERS+=("\"$worker\"")
              fi
            done
          fi

          # Convert array to JSON array
          if [ ${#WORKERS[@]} -eq 0 ]; then
            echo "workers=[]" >> $GITHUB_OUTPUT
            echo "No workers to deploy"
          else
            WORKERS_JSON=$(printf '%s\n' "${WORKERS[@]}" | jq -s . | tr -d '\n')
            echo "workers=$WORKERS_JSON" >> $GITHUB_OUTPUT
            echo "Workers to deploy: ${WORKERS[*]}"
          fi

  migrate:
    needs: check-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Atlas
        uses: ariga/setup-atlas@v0

      - name: Load database secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GCP_SA_KEY: "op://Production/Database/service account/plot-ci-migrator-key.json"
          MIGRATOR_PASSWORD: op://Production/Database/migrator/password

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Download and start Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.21.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy plot-core:northamerica-northeast2:plot-prod \
            --port=5432 &
          sleep 3

      - name: Apply pending migrations
        working-directory: libs/db
        run: |
          atlas migrate apply \
            --dir "file://migrations" \
            --url "postgres://migrator:${MIGRATOR_PASSWORD}@localhost:5432/plot"

  deploy:
    needs: [check-changes, migrate]
    runs-on: ubuntu-latest
    if: |
      needs.check-changes.outputs.workers != '[]' &&
      github.event.inputs.migrate_only != 'true'
    strategy:
      matrix:
        worker: ${{ fromJson(needs.check-changes.outputs.workers) }}

    env:
      SKIP_PYTHON: 1
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN}}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Load secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://Production/Cloudflare/credential
          CLOUDFLARE_ACCOUNT_ID: op://Production/Cloudflare/username
          POSTHOG_PROJECT: op://Production/PostHog/username
          POSTHOG_CLI_KEY: op://Production/PostHog/sourcemaps/credential

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build Twister
        run: |
          cd public/twister
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy secrets and variables for ${{ matrix.worker }}
        working-directory: workers/${{ matrix.worker }}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          # Read deploy_vars from package.json
          DEPLOY_VARS=$(node -pe "require('./package.json').config?.deploy_vars || ''")

          if [ -z "$DEPLOY_VARS" ]; then
            echo "No deploy_vars configured for ${{ matrix.worker }}"
            exit 0
          fi

          echo "Deploying variables: $DEPLOY_VARS"

          # Generate all variables from .env files + 1Password
          ALL=$(../../scripts/gen-env production $DEPLOY_VARS)

          # Split into secrets (containing SECRET, KEY, or TOKEN)
          SECRETS=$(echo "$ALL" | grep -E 'SECRET|KEY|TOKEN' || true)
          SECRETS_JSON=$(echo "$SECRETS" | ../../scripts/env-to-json)

          # Split into regular variables (not containing SECRET, KEY, or TOKEN)
          VARS=$(echo "$ALL" | grep -Ev 'SECRET|KEY|TOKEN' || true)
          VARS_FORMATTED=$(echo "$VARS" | sed 's/=/:/g' | tr '\n' ' ' | sed 's/ $//')

          # Deploy secrets via wrangler secret bulk
          if [ -n "$SECRETS_JSON" ] && [ "$SECRETS_JSON" != "{}" ]; then
            echo "Deploying secrets..."
            echo "$SECRETS_JSON" | pnpm wrangler secret bulk --env production
          else
            echo "No secrets to deploy"
          fi

          # Export variables for deploy step
          if [ -n "$VARS_FORMATTED" ]; then
            echo "DEPLOY_VARS=$VARS_FORMATTED" >> $GITHUB_ENV
            echo "Variables to deploy: $VARS_FORMATTED"
          else
            echo "No regular variables to deploy"
          fi

      - name: Deploy ${{ matrix.worker }}
        run: pnpm exec nx deploy @plotday/${{ matrix.worker }}
