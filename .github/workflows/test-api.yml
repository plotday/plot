name: Test API

on:
  pull_request:
    branches:
      - main
    paths:
      - "workers/api/**"
      - "libs/**"
      - "public"
      - "public/twister/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/test-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Twister
        run: pnpm --filter=@plotday/twister build

      - name: Run API Tests
        run: pnpm --filter @plotday/api run test:all
