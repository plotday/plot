name: Build macOS App

on:
  workflow_dispatch:
    inputs:
      shorebird_release:
        description: 'Create a Shorebird release (registers baseline for OTA patches)'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Load secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_ID: op://Production/Apple/Signing/apple id
          APPLE_TEAM_ID: op://Production/Apple/Signing/team id
          APPLE_APP_SPECIFIC_PASSWORD: op://Production/Apple/Signing/app specific password
          MACOS_CERTIFICATE_BASE64: op://Production/Apple/Signing/p12
          MACOS_CERTIFICATE_PASSWORD: op://Production/Apple/Signing/password

      - name: Get version from pubspec.yaml
        id: version
        run: |
          cd apps/plot
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)

          {
            echo "new_version=$CURRENT_VERSION"
            echo "version_name=$VERSION_NAME"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

          echo "Building version: $CURRENT_VERSION"

      - name: Detect branch and set build metadata
        id: build_type
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          GIT_HASH=$(git rev-parse --short HEAD)
          IS_MAIN=$([[ "$BRANCH_NAME" == "main" ]] && echo "true" || echo "false")

          if [ "$IS_MAIN" == "true" ]; then
            # Main branch: standard release
            TAG_SUFFIX=""
            FILE_SUFFIX=""
            RELEASE_TYPE="latest"
            RELEASE_TITLE_PREFIX=""
            SKIP_NOTARIZATION="false"
          else
            # Feature branch: prerelease with branch name and git hash
            TAG_SUFFIX="-${BRANCH_NAME}-${GIT_HASH}"
            FILE_SUFFIX="-${BRANCH_NAME}-${GIT_HASH}"
            RELEASE_TYPE="prerelease"
            RELEASE_TITLE_PREFIX="[${BRANCH_NAME}] "
            SKIP_NOTARIZATION="true"
          fi

          {
            echo "is_main=$IS_MAIN"
            echo "branch_name=$BRANCH_NAME"
            echo "git_hash=$GIT_HASH"
            echo "tag_suffix=$TAG_SUFFIX"
            echo "file_suffix=$FILE_SUFFIX"
            echo "release_type=$RELEASE_TYPE"
            echo "release_title_prefix=$RELEASE_TITLE_PREFIX"
            echo "skip_notarization=$SKIP_NOTARIZATION"
          } >> "$GITHUB_OUTPUT"

          echo "Branch: $BRANCH_NAME"
          echo "Git Hash: $GIT_HASH"
          echo "Is Main: $IS_MAIN"
          echo "Skip Notarization: $SKIP_NOTARIZATION"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/plot/pubspec.yaml
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Write .env file
        run: |
          cd apps/plot && pnpm get-env && pnpm set-env prod

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build macOS app
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          cd apps/plot
          if [ "${{ inputs.shorebird_release }}" == "true" ]; then
            curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash
            export PATH="$HOME/.shorebird/bin:$PATH"
            shorebird release macos
          else
            flutter build macos --release
          fi

      - name: Import code signing certificate
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Add to keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Set key partition list (allows codesign to access the key)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify certificate is available
          security find-identity -v -p codesigning

      - name: Code sign macOS app
        run: |
          cd apps/plot/build/macos/Build/Products/Release

          # Get the Developer ID Application identity
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          if [ -z "$IDENTITY" ]; then
            echo "Error: Developer ID Application certificate not found"
            exit 1
          fi

          echo "Signing with identity: $IDENTITY"

          # Sign all frameworks and libraries first
          find Plot.app/Contents/Frameworks -name "*.dylib" -o -name "*.framework" | while read -r file; do
            codesign --force --sign "$IDENTITY" --timestamp --options runtime "$file" || true
          done

          # Sign the app bundle
          codesign --force --sign "$IDENTITY" --timestamp --options runtime --deep Plot.app

          # Verify signature
          codesign -dvv Plot.app
          codesign --verify --verbose Plot.app

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-create-dmg
          restore-keys: |
            ${{ runner.os }}-homebrew-

      - name: Create DMG installer
        run: |
          cd apps/plot/build/macos/Build/Products/Release

          DMG_FILE="Plot-${{ steps.version.outputs.new_version }}${{ steps.build_type.outputs.file_suffix }}.dmg"

          # Install create-dmg if not available
          brew install create-dmg || true

          # Create DMG
          create-dmg \
            --volname "Plot Installer" \
            --volicon "Plot.app/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Plot.app" 200 190 \
            --hide-extension "Plot.app" \
            --app-drop-link 600 185 \
            "$DMG_FILE" \
            "Plot.app" || true

          # Fallback: If create-dmg fails, create simple DMG
          if [ ! -f "$DMG_FILE" ]; then
            echo "create-dmg failed, using hdiutil fallback"
            hdiutil create -volname "Plot" -srcfolder "Plot.app" -ov -format UDZO "$DMG_FILE"
          fi

          ls -lh "$DMG_FILE"

      - name: Code sign DMG
        run: |
          cd apps/plot/build/macos/Build/Products/Release

          # Get the Developer ID Application identity
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          if [ -z "$IDENTITY" ]; then
            echo "Error: Developer ID Application certificate not found"
            exit 1
          fi

          DMG_FILE="Plot-${{ steps.version.outputs.new_version }}${{ steps.build_type.outputs.file_suffix }}.dmg"
          echo "Signing DMG with identity: $IDENTITY"

          # Sign the DMG
          codesign --force --sign "$IDENTITY" --timestamp "$DMG_FILE"

          # Verify DMG signature
          codesign -dvv "$DMG_FILE"
          codesign --verify --verbose "$DMG_FILE"

      - name: Notarize DMG with Apple
        if: steps.build_type.outputs.skip_notarization != 'true'
        run: |
          cd apps/plot/build/macos/Build/Products/Release

          DMG_FILE="Plot-${{ steps.version.outputs.new_version }}${{ steps.build_type.outputs.file_suffix }}.dmg"

          echo "Submitting $DMG_FILE for notarization..."
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_FILE"

          echo "Verifying notarization..."
          spctl -a -vv -t install "$DMG_FILE"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ steps.version.outputs.new_version }}${{ steps.build_type.outputs.file_suffix }}
          path: apps/plot/build/macos/Build/Products/Release/Plot-${{ steps.version.outputs.new_version }}${{ steps.build_type.outputs.file_suffix }}.dmg
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/plot/build/macos/Build/Products/Release

          DMG_FILE="Plot-${{ steps.version.outputs.new_version }}${{ steps.build_type.outputs.file_suffix }}.dmg"
          TAG_NAME="macos@${{ steps.version.outputs.new_version }}${{ steps.build_type.outputs.tag_suffix }}"
          RELEASE_TITLE="${{ steps.build_type.outputs.release_title_prefix }}Plot macOS ${{ steps.version.outputs.new_version }}"

          # Calculate file metadata
          FILE_SIZE=$(stat -f%z "$DMG_FILE")
          FILE_HASH=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Create release notes
          cat > release-notes.md << EOF
          ## ${{ steps.build_type.outputs.release_title_prefix }}Plot macOS ${{ steps.version.outputs.new_version }}

          **Version:** ${{ steps.version.outputs.version_name }}
          **Build Number:** ${{ steps.version.outputs.build_number }}
          **Platform:** macOS
          **Branch:** ${{ steps.build_type.outputs.branch_name }}
          **Git Hash:** ${{ steps.build_type.outputs.git_hash }}
          **Release Date:** ${RELEASE_DATE}

          ### Download

          - **Size**: ${FILE_SIZE} bytes
          - **SHA256**: \`${FILE_HASH}\`

          ### Requirements

          - **Minimum macOS Version:** 10.14 (Mojave)
          EOF

          # Add prerelease warning if not main
          if [ "${{ steps.build_type.outputs.is_main }}" != "true" ]; then
            echo "" >> release-notes.md
            echo "---" >> release-notes.md
            echo "" >> release-notes.md
            echo "⚠️ **This is a branch build and may be unstable.**" >> release-notes.md
            echo "" >> release-notes.md
            echo "This build was created from the \`${{ steps.build_type.outputs.branch_name }}\` branch at commit \`${{ steps.build_type.outputs.git_hash }}\`. It has not been notarized and is intended for testing purposes only." >> release-notes.md
          fi

          # Create release (with or without --latest/--prerelease)
          if [ "${{ steps.build_type.outputs.is_main }}" == "true" ]; then
            gh release create "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest \
              "$DMG_FILE"
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --prerelease \
              "$DMG_FILE"
          fi

          echo "Release created: $TAG_NAME"

      - name: Build summary
        run: |
          {
            echo "## ✅ macOS Build Complete"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.new_version }}"
            echo "**Branch:** ${{ steps.build_type.outputs.branch_name }}"
            echo "**Git Hash:** ${{ steps.build_type.outputs.git_hash }}"
            echo "**Build Type:** ${{ steps.build_type.outputs.is_main == 'true' && 'Production (Main)' || 'Branch Build' }}"
            echo "**Platform:** macOS"
            echo "**File:** Plot-${{ steps.version.outputs.new_version }}${{ steps.build_type.outputs.file_suffix }}.dmg"
            echo "**Notarized:** ${{ steps.build_type.outputs.skip_notarization == 'true' && 'No (branch build)' || 'Yes' }}"
            echo ""
            echo "### GitHub Release"
            echo "- **Tag:** macos@${{ steps.version.outputs.new_version }}${{ steps.build_type.outputs.tag_suffix }}"
            echo "- **Type:** ${{ steps.build_type.outputs.release_type }}"
            echo "- **Status:** Created"
          } >> "$GITHUB_STEP_SUMMARY"
