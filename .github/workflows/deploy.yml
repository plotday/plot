name: Deploy
on:
  push:
    branches:
      - "**"
permissions:
  contents: read
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    env:
      CALENDAR_WEBHOOK_URL: ${{ vars.CALENDAR_WEBHOOK_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_OAUTH_SECRET: ${{ secrets.GOOGLE_OAUTH_SECRET }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      MICROSOFT_OAUTH_SECRET: ${{ secrets.MICROSOFT_OAUTH_SECRET }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      TEST_GOOGLE_ACCOUNT_ACCESS_TOKEN: ${{ secrets.TEST_GOOGLE_ACCOUNT_ACCESS_TOKEN }}
      TEST_GOOGLE_ACCOUNT_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_ACCOUNT_REFRESH_TOKEN }}
      TEST_OUTLOOK_ACCOUNT_ACCESS_TOKEN: ${{ secrets.TEST_OUTLOOK_ACCOUNT_ACCESS_TOKEN }}
      TEST_OUTLOOK_ACCOUNT_REFRESH_TOKEN: ${{ secrets.TEST_OUTLOOK_ACCOUNT_REFRESH_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - run: git config --global user.email "github-actions@users.noreply.github.com"
      - run: git config --global user.name "GitHub Actions"

      - name: Lint
        run: pnpm lint

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start supabase
        run: pnpm --filter @plotday/db test:setup

      # - name: Run tests
      #   run: pnpm test

      - name: Migrate DB
        run: pnpm --filter @plotday/db run link $SUPABASE_PROJECT_ID && pnpm --filter @plotday/db run push

      - name: Deploy workers
        run: pnpm run deploy:workers:changed

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Deploy calendar (web)
        run: pnpm run deploy:calendar:web
