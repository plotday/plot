name: Version Bump

on:
  push:
    branches:
      - main
    paths:
      - "apps/plot/**"
      - ".env"
      - ".env.production"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: version-bump
  cancel-in-progress: true

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip version]')
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Get GitHub App User ID
        id: app-user
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
          echo "Bot name: ${{ steps.app-token.outputs.app-slug }}[bot]"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Get current version and increment build number
        id: version
        run: |
          cd apps/plot
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_NAME=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$CURRENT_VERSION" | cut -d'+' -f2)
          NEW_BUILD_NUMBER=$((BUILD_NUMBER + 1))
          NEW_VERSION="${VERSION_NAME}+${NEW_BUILD_NUMBER}"

          {
            echo "current_version=$CURRENT_VERSION"
            echo "version_name=$VERSION_NAME"
            echo "build_number=$NEW_BUILD_NUMBER"
            echo "new_version=$NEW_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

      - name: Update version in pubspec.yaml
        run: |
          cd apps/plot
          sed -i "s/version: .*/version: ${{ steps.version.outputs.new_version }}/" pubspec.yaml
          echo "Updated pubspec.yaml to version ${{ steps.version.outputs.new_version }}"

      - name: Commit and push version bump
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add apps/plot/pubspec.yaml
          git commit -m "Bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git push

      - name: Summary
        run: |
          {
            echo "## 🔢 Version Bump Complete"
            echo ""
            echo "**New Version:** ${{ steps.version.outputs.new_version }}"
            echo "**Version Name:** ${{ steps.version.outputs.version_name }}"
            echo "**Build Number:** ${{ steps.version.outputs.build_number }}"
            echo ""
            echo "This version will be used by all platform builds."
          } >> "$GITHUB_STEP_SUMMARY"
