name: Release

on:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Release iOS'
        type: boolean
        default: true
      android:
        description: 'Release Android'
        type: boolean
        default: true
      macos:
        description: 'Release macOS'
        type: boolean
        default: true
      windows:
        description: 'Release Windows'
        type: boolean
        default: true
      submit_for_review:
        description: 'Submit uploaded builds for review on every released store (Apple App Store iOS+macOS, Google Play production, Microsoft Store); off = stage as draft (TestFlight / Play internal / Store draft) to finish by hand'
        type: boolean
        default: false
      update_metadata:
        description: 'Update store listing text (titles, descriptions, features, keywords) for the released stores — off = listings left untouched'
        type: boolean
        default: false
      update_screenshots:
        description: 'Update store screenshots for the released stores — off = screenshots left untouched'
        type: boolean
        default: false

concurrency:
  group: native-release
  cancel-in-progress: false

env:
  # super_clipboard's Rust extension (Cargokit) downloads crates from the
  # registry during the native build of every platform. Cargo's default HTTP/2
  # multiplexing intermittently fails on GitHub runners with
  # "[16] Error in the HTTP2 framing layer", which non-deterministically breaks
  # the build (e.g. release-ios run 27807580473 failed downloading `syn`).
  # Force HTTP/1.1 and add generous retries so transient download blips are
  # retried instead of failing the whole release. Inherited by the cargo
  # process spawned inside the Xcode/Gradle/MSBuild build phase.
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_NET_RETRY: '10'

jobs:
  refresh-secrets:
    uses: ./.github/workflows/refresh-secrets.yml
    secrets: inherit

  prepare-release:
    runs-on: ubuntu-latest
    concurrency:
      group: version-bump
    env:
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_branch: ${{ steps.version.outputs.release_branch }}
      release_sha: ${{ steps.branch.outputs.sha }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Get GitHub App User ID
        id: app-user
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set up Ruby + fastlane (for ASC version query)
        run: sudo gem install fastlane --no-document

      - name: Write ASC API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 0600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Read current version and auto-bump marketing version after approval
        id: version
        run: |
          set -euo pipefail
          cd apps/plot
          RELEASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_NAME=$(echo "$RELEASE_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$RELEASE_VERSION" | cut -d'+' -f2)

          # Query App Store Connect for the highest already-approved marketing
          # version across iOS + macOS. The query is load-bearing (no separate
          # pre-flight check): retry transient failures, then fail the release if
          # it never succeeds, rather than risk Apple error 90062. An empty
          # APPROVED after a SUCCESSFUL lane run means "no approved version yet"
          # (brand-new app) — a valid no-bump case.
          APPROVED=""
          QUERY_OK=false
          for attempt in 1 2 3 4 5; do
            if OUT=$(cd ios && fastlane latest_approved_version 2>&1); then
              APPROVED=$(echo "$OUT" | sed -ne 's/.*LATEST_APPROVED_VERSION=\([0-9][0-9.]*\).*/\1/p' | tail -1)
              QUERY_OK=true
              break
            fi
            echo "ASC version query attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep "$((attempt * 10))"
          done

          if [ "$QUERY_OK" != "true" ]; then
            echo "ERROR: could not reach App Store Connect to determine the approved version. Aborting to avoid Apple error 90062." >&2
            exit 1
          fi

          # Bump VERSION_NAME to APPROVED's patch+1 when the current marketing
          # version is not strictly higher than the approved one.
          if [ -n "$APPROVED" ]; then
            higher=$(printf '%s\n%s\n' "$APPROVED" "$VERSION_NAME" | sort -V | tail -1)
            if [ "$VERSION_NAME" = "$APPROVED" ] || [ "$higher" = "$APPROVED" ]; then
              IFS='.' read -r MA MI PA <<< "$APPROVED"
              VERSION_NAME="${MA}.${MI}.$((PA + 1))"
              echo "Marketing version <= approved ($APPROVED); bumped to $VERSION_NAME"
            else
              echo "Marketing version $VERSION_NAME already > approved ($APPROVED); no bump"
            fi
          else
            echo "No approved App Store version found; keeping $VERSION_NAME"
          fi

          RELEASE_VERSION="${VERSION_NAME}+${BUILD_NUMBER}"
          {
            echo "release_version=$RELEASE_VERSION"
            echo "version_name=$VERSION_NAME"
            echo "build_number=$BUILD_NUMBER"
            echo "release_branch=release/$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "Release version: $RELEASE_VERSION"

      - name: Create release branch
        id: branch
        run: |
          RELEASE_BRANCH="${{ steps.version.outputs.release_branch }}"
          git checkout -b "$RELEASE_BRANCH"
          # Ensure the release commit's pubspec carries the (possibly auto-bumped)
          # marketing version, so the built binaries' CFBundleShortVersionString
          # matches what we submit. Without this, an auto-bump would leave the
          # build on the old, already-approved version and Apple rejects it (90062).
          # Idempotent: when no bump happened this rewrites pubspec to the same
          # value, git diff stays clean, and no commit is made (release_sha
          # unchanged, preserving existing behavior). Anchored on ^version: so the
          # msix_version: line is untouched.
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.release_version }}/" apps/plot/pubspec.yaml
          if ! git diff --quiet apps/plot/pubspec.yaml; then
            git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
            git config user.email '${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
            git add apps/plot/pubspec.yaml
            git commit -m "Release ${{ steps.version.outputs.release_version }}: set marketing version [skip ci]"
          fi
          git push origin "$RELEASE_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Created release branch: $RELEASE_BRANCH"

      - name: Stamp changelog and bump main to next build number
        run: |
          RELEASE_VERSION="${{ steps.version.outputs.release_version }}"
          STAMP_DATE="$(date -u +%Y-%m-%d)"
          NEXT_BUILD_NUMBER=$((${{ steps.version.outputs.build_number }} + 1))
          NEXT_VERSION="${{ steps.version.outputs.version_name }}+${NEXT_BUILD_NUMBER}"

          # We're still on the freshly-created release branch, which sits at the
          # release commit (== main's tip). Make the stamp + bump commit here and
          # fast-forward it onto main with `git push origin HEAD:main`, instead of
          # `git checkout main`. The branch switch mutated the worktree and could
          # leave apps/plot/pubspec.yaml unstaged ("pathspec did not match") by
          # the time `git add` ran; pushing HEAD lands the identical commit on
          # main (parent = release commit) without touching the worktree.
          node scripts/stamp-updates.mjs "$RELEASE_VERSION" "$STAMP_DATE"
          # Anchor on ^version: so we don't also rewrite the msix_version: line.
          sed -i "s/^version: .*/version: ${NEXT_VERSION}/" apps/plot/pubspec.yaml

          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add apps/plot/pubspec.yaml docs/updates.md docs/updates.d
          git commit -m "Release ${RELEASE_VERSION}: stamp changelog + bump to ${NEXT_VERSION} [skip ci]"
          git push origin HEAD:main

          echo "Stamped changelog for $RELEASE_VERSION; bumped main to: $NEXT_VERSION"

      - name: Summary
        run: |
          {
            echo "## Release Prepared"
            echo ""
            echo "**Release version:** ${{ steps.version.outputs.release_version }}"
            echo "**Release branch:** ${{ steps.version.outputs.release_branch }}"
            echo "**Main bumped to:** ${{ steps.version.outputs.version_name }}+$((${{ steps.version.outputs.build_number }} + 1))"
          } >> "$GITHUB_STEP_SUMMARY"

  release-ios:
    needs: [prepare-release, refresh-secrets]
    if: inputs.ios
    runs-on: macos-26
    env:
      APPLE_DIST_CERT_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
      APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Decode signing files
        id: profiles
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_SHARE_EXT_MOBILEPROVISION_BASE64: ${{ secrets.IOS_SHARE_EXT_MOBILEPROVISION_BASE64 }}
          FIREBASE_IOS_GOOGLE_SERVICE_INFO: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO }}
        run: |
          # App Store Connect API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 0600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # iOS App Store provisioning profile (day.plot.app)
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/ios.mobileprovision"
          chmod 0600 "$RUNNER_TEMP/ios.mobileprovision"

          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios.mobileprovision")")
          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios.mobileprovision")")
          cp "$RUNNER_TEMP/ios.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.mobileprovision"
          echo "Installed app profile: $APP_PROFILE_NAME ($APP_PROFILE_UUID)"
          echo "app_profile_name=$APP_PROFILE_NAME" >> "$GITHUB_OUTPUT"

          # iOS App Store provisioning profile for ShareExtension (day.plot.app.ShareExtension)
          echo "$IOS_SHARE_EXT_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-share-extension.mobileprovision"
          chmod 0600 "$RUNNER_TEMP/ios-share-extension.mobileprovision"

          EXT_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios-share-extension.mobileprovision")")
          EXT_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios-share-extension.mobileprovision")")
          cp "$RUNNER_TEMP/ios-share-extension.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${EXT_PROFILE_UUID}.mobileprovision"
          echo "Installed extension profile: $EXT_PROFILE_NAME ($EXT_PROFILE_UUID)"
          echo "ext_profile_name=$EXT_PROFILE_NAME" >> "$GITHUB_OUTPUT"

          # Firebase config for iOS
          echo "$FIREBASE_IOS_GOOGLE_SERVICE_INFO" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/ios/Runner/GoogleService-Info.plist"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/ios/Runner/GoogleService-Info.plist"

      - name: Import code signing certificates
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Apple Distribution certificate
          DIST_CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$APPLE_DIST_CERT_BASE64" | base64 --decode > "$DIST_CERT_PATH"
          security import "$DIST_CERT_PATH" -P "$APPLE_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$DIST_CERT_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Configure manual signing for CI
        env:
          APP_PROFILE_NAME: ${{ steps.profiles.outputs.app_profile_name }}
          EXT_PROFILE_NAME: ${{ steps.profiles.outputs.ext_profile_name }}
        run: |
          cd apps/plot/ios

          PBXPROJ="Runner.xcodeproj/project.pbxproj"

          # Switch from automatic to manual signing for all targets
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"

          # Set distribution signing identity for all targets
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' "$PBXPROJ"

          # Add provisioning profile specifier for Runner target
          python3 -c "
          import re, sys
          content = open('$PBXPROJ').read()
          # Runner target: day.plot.app but not .ShareExtension or .RunnerTests
          content = re.sub(
              r'(PRODUCT_BUNDLE_IDENTIFIER = day\.plot\.app;(?!\.))',
              r'\1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$APP_PROFILE_NAME\";',
              content
          )
          # ShareExtension target
          content = content.replace(
              'PRODUCT_BUNDLE_IDENTIFIER = day.plot.app.ShareExtension;',
              'PRODUCT_BUNDLE_IDENTIFIER = day.plot.app.ShareExtension;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$EXT_PROFILE_NAME\";'
          )
          open('$PBXPROJ', 'w').write(content)
          "

          # Create ExportOptions.plist for app-store distribution
          /usr/libexec/PlistBuddy -c "Clear dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string 789MAH2W6P" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:day.plot.app string $APP_PROFILE_NAME" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:day.plot.app.ShareExtension string $EXT_PROFILE_NAME" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" ExportOptions.plist

          echo "Manual signing configured. ExportOptions.plist created."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Write app.env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: |
          printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/.env.production
          cp apps/plot/.env.production apps/plot/app.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Pin Shorebird to v1.6.102
        shell: bash
        run: |
          # Pinned so a setup-shorebird@v1 upgrade can't silently change build
          # behavior. Bump when the Shorebird server rejects this version as
          # too old, or when adopting a needed fix/feature.
          # Install dir varies per OS (macOS: ~/.shorebird, Linux:
          # $XDG_CONFIG_HOME/shorebird), so resolve it from `which shorebird`.
          SHOREBIRD_DIR="$(dirname "$(dirname "$(command -v shorebird)")")"
          # Checking out the tag re-bootstraps Shorebird's bundled Flutter, which
          # downloads the engine from download.shorebird.dev. That download is
          # prone to transient DNS/network failures on CI, so retry with backoff
          # rather than failing the whole release on one hiccup. The engine is
          # cached locally on success, so the later `shorebird release` reuses it.
          for attempt in 1 2 3 4 5; do
            if git -C "$SHOREBIRD_DIR" fetch --tags --depth=1 origin refs/tags/v1.6.102:refs/tags/v1.6.102 \
              && git -C "$SHOREBIRD_DIR" checkout v1.6.102 \
              && shorebird --version; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: Failed to pin Shorebird to v1.6.102 after 5 attempts" >&2
              exit 1
            fi
            echo "Pin attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep "$((attempt * 10))"
          done

      - name: Build iOS app (Shorebird release)
        run: |
          cd apps/plot
          FLUTTER_VERSION=$(jq -r .flutter ../../.fvmrc)
          shorebird release ios --flutter-version="$FLUTTER_VERSION" -- --export-options-plist=ios/ExportOptions.plist

      - name: Verify app.env in IPA
        run: |
          IPA_PATH=$(find apps/plot/build/ios/ipa -name "*.ipa" -print -quit)
          TEMP_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$TEMP_DIR"
          ENV_CONTENT=$(find "$TEMP_DIR" -path "*/flutter_assets/app.env" -exec cat {} \;)
          if [ -z "$ENV_CONTENT" ]; then
            echo "ERROR: app.env is empty in the IPA bundle!"
            rm -rf "$TEMP_DIR"
            exit 1
          fi
          echo "✓ app.env is correctly bundled ($(echo "$ENV_CONTENT" | wc -l) lines)"
          rm -rf "$TEMP_DIR"

      - name: Upload to App Store Connect
        run: |
          IPA_PATH=$(find apps/plot/build/ios/ipa -name "*.ipa" -print -quit 2>/dev/null)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file found in apps/plot/build/ios/ipa/"
            exit 1
          fi

          echo "Uploading $IPA_PATH..."
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      # When submit_for_review is set, push the just-uploaded build to App Store
      # review. Best-effort (continue-on-error): the binary is already in
      # TestFlight, so a review-submission hiccup (build still processing, a
      # version already In Review, missing compliance answers) must not fail the
      # release. deliver waits out the altool processing delay automatically
      # when submit_for_review is set.
      - name: Submit to App Store for review
        id: submit
        if: ${{ inputs.submit_for_review }}
        continue-on-error: true
        env:
          SUBMIT_APP_VERSION: ${{ needs.prepare-release.outputs.version_name }}
        run: |
          cd apps/plot/ios
          fastlane submit

      # The submit step is continue-on-error so a review-submission hiccup can't
      # fail an otherwise-successful binary release, but that also makes a
      # failure invisible in the job status. Surface it as a warning annotation
      # so a silent breakage (e.g. a fastlane option that stopped being valid)
      # is caught instead of shipping as a green run that never submitted.
      - name: Warn if review submission failed
        if: ${{ inputs.submit_for_review && steps.submit.outcome == 'failure' }}
        run: |
          echo "::warning title=iOS review submission failed::Binary uploaded to App Store Connect but 'fastlane submit' failed — submit by hand in App Store Connect. See the 'Submit to App Store for review' step logs."

      # Push the listing text and/or screenshots — only when explicitly
      # requested via the update_metadata / update_screenshots inputs (a regular
      # release uploads the binary only). continue-on-error so a listing whose
      # metadata is temporarily locked (a version In Review / Pending Developer
      # Release) can't fail an otherwise-successful binary release. The SKIP_*
      # env vars flow into fastlane's deliver to honor each flag independently.
      - name: Upload metadata and screenshots to App Store Connect
        id: metadata
        if: ${{ inputs.update_metadata || inputs.update_screenshots }}
        continue-on-error: true
        env:
          SKIP_METADATA: ${{ inputs.update_metadata && 'false' || 'true' }}
          SKIP_SCREENSHOTS: ${{ inputs.update_screenshots && 'false' || 'true' }}
        run: |
          set -euo pipefail
          # deliver classifies each screenshot by its pixel dimensions, so iPhone
          # (portrait) and iPad (landscape) shots can share the one en-US folder.
          # The device-name prefix only keeps filenames unique and ordering
          # stable; the ipad-* glob picks up iPad assets automatically once they
          # are generated and committed.
          SRC="apps/plot/screenshots/store/app-store"
          DEST="apps/plot/ios/fastlane/screenshots/en-US"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          shopt -s nullglob
          count=0
          for devdir in "$SRC"/iphone-* "$SRC"/ipad-*; do
            [ -d "$devdir" ] || continue
            dev="$(basename "$devdir")"
            for png in "$devdir"/*.png; do
              cp "$png" "$DEST/${dev}-$(basename "$png")"
              count=$((count + 1))
            done
          done
          if [ "$count" -eq 0 ] && [ "${SKIP_SCREENSHOTS:-true}" != "true" ]; then
            echo "ERROR: no iPhone/iPad App Store screenshots found under $SRC" >&2
            exit 1
          fi
          echo "Staged $count iOS screenshot(s) into $DEST"

          cd apps/plot/ios
          fastlane metadata

      - name: Tag store submission
        run: |
          git tag "ios/${{ needs.prepare-release.outputs.release_version }}"
          git push origin "ios/${{ needs.prepare-release.outputs.release_version }}"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-${{ needs.prepare-release.outputs.release_version }}
          path: apps/plot/build/ios/ipa/*.ipa
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## iOS Release Complete"
            echo ""
            echo "**Version:** ${{ needs.prepare-release.outputs.release_version }}"
            echo "**Uploaded to:** App Store Connect (TestFlight)"
            echo "**Review submission:** ${{ inputs.submit_for_review && (steps.submit.outcome == 'success' && 'submitted for App Store review' || 'submit FAILED — see the Submit step logs (build may still be processing or a version is already In Review)') || 'not requested (TestFlight only; submit by hand in App Store Connect)' }}"
            echo "**Metadata + screenshots:** ${{ (inputs.update_metadata || inputs.update_screenshots) && (steps.metadata.outcome == 'success' && 'uploaded to App Store listing' || 'upload failed — see the metadata step logs (listing may be locked while a version is in review)') || 'not requested (set update_metadata / update_screenshots to push)' }}"
            echo ""
            echo "### Admin"
            echo "- [TestFlight (iOS)](https://appstoreconnect.apple.com/teams/0a55108e-af39-475a-a7f1-aada0c1decae/apps/6756905242/testflight/ios)"
          } >> "$GITHUB_STEP_SUMMARY"

  release-android:
    needs: [prepare-release, refresh-secrets]
    if: inputs.android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      # The Shorebird Android release (Flutter engine download + Gradle caches +
      # NDK + AAB outputs) overflows the runner's root filesystem, failing with
      # "No space left on device" during mergeReleaseNativeLibs/ExtractJniTransform.
      # Reclaim space by removing pre-installed toolchains this job never uses.
      # Runs first so nothing it deletes is recreated by later setup steps; it
      # deliberately leaves the Android SDK/NDK, Java, Flutter, and Rust intact.
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium /usr/local/share/chrome_driver
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Decode signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_STORE_SERVICE_KEY: ${{ secrets.PLAY_STORE_SERVICE_KEY }}
          FIREBASE_ANDROID_GOOGLE_SERVICES: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES }}
        run: |
          # Android signing keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/android/plot-release.jks"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/android/plot-release.jks"

          # Google Play API service key
          mkdir -p "$GITHUB_WORKSPACE/apps/plot/android"
          echo "$PLAY_STORE_SERVICE_KEY" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/android/play-deployer-service-key.json"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/android/play-deployer-service-key.json"

          # Firebase config for Android
          echo "$FIREBASE_ANDROID_GOOGLE_SERVICES" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/android/app/google-services.json"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/android/app/google-services.json"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/plot/android/**/*.gradle*', 'apps/plot/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Write app.env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/app.env

      - name: Create key.properties
        run: |
          cat > apps/plot/android/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=plot-release
          storeFile=../plot-release.jks
          EOF

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Pin Shorebird to v1.6.102
        shell: bash
        run: |
          # Pinned so a setup-shorebird@v1 upgrade can't silently change build
          # behavior. Bump when the Shorebird server rejects this version as
          # too old, or when adopting a needed fix/feature.
          # Install dir varies per OS (macOS: ~/.shorebird, Linux:
          # $XDG_CONFIG_HOME/shorebird), so resolve it from `which shorebird`.
          SHOREBIRD_DIR="$(dirname "$(dirname "$(command -v shorebird)")")"
          # Checking out the tag re-bootstraps Shorebird's bundled Flutter, which
          # downloads the engine from download.shorebird.dev. That download is
          # prone to transient DNS/network failures on CI, so retry with backoff
          # rather than failing the whole release on one hiccup. The engine is
          # cached locally on success, so the later `shorebird release` reuses it.
          for attempt in 1 2 3 4 5; do
            if git -C "$SHOREBIRD_DIR" fetch --tags --depth=1 origin refs/tags/v1.6.102:refs/tags/v1.6.102 \
              && git -C "$SHOREBIRD_DIR" checkout v1.6.102 \
              && shorebird --version; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: Failed to pin Shorebird to v1.6.102 after 5 attempts" >&2
              exit 1
            fi
            echo "Pin attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep "$((attempt * 10))"
          done

      - name: Build Android app (Shorebird release)
        run: |
          cd apps/plot
          FLUTTER_VERSION=$(jq -r .flutter ../../.fvmrc)
          shorebird release android --flutter-version="$FLUTTER_VERSION"

      - name: Verify app.env in AAB
        run: |
          AAB_PATH="apps/plot/build/app/outputs/bundle/release/app-release.aab"
          ENV_CONTENT=$(unzip -p "$AAB_PATH" "base/assets/flutter_assets/app.env")
          if [ -z "$ENV_CONTENT" ]; then
            echo "ERROR: app.env is empty in the AAB bundle!"
            exit 1
          fi
          echo "✓ app.env is correctly bundled ($(echo "$ENV_CONTENT" | wc -l) lines)"

      - name: Install fastlane
        run: |
          sudo gem install fastlane --no-document

      - name: Upload to Google Play (internal testing)
        run: |
          cd apps/plot/android
          fastlane beta "aab:$GITHUB_WORKSPACE/apps/plot/build/app/outputs/bundle/release/app-release.aab"

      # When submit_for_review is set, promote the build just uploaded to the
      # internal track up to Production (release_status completed => submitted
      # for review). Best-effort: the AAB is already on internal testing, so a
      # promotion hiccup (a halted rollout, changes pending review) must not
      # fail the release.
      - name: Promote to Google Play production
        id: submit
        if: ${{ inputs.submit_for_review }}
        continue-on-error: true
        run: |
          cd apps/plot/android
          fastlane submit_production

      # continue-on-error hides a failed promotion from the job status; surface
      # it as a warning annotation so a silent breakage is caught rather than
      # shipping as a green run that never reached Production review.
      - name: Warn if promotion failed
        if: ${{ inputs.submit_for_review && steps.submit.outcome == 'failure' }}
        run: |
          echo "::warning title=Google Play promotion failed::AAB uploaded to internal testing but 'fastlane submit_production' failed — promote by hand in Play Console. See the 'Promote to Google Play production' step logs."

      # Push the listing text and/or screenshots — only when explicitly
      # requested via the update_metadata / update_screenshots inputs (a regular
      # release uploads the binary only). continue-on-error so a listing whose
      # metadata is temporarily locked (changes pending review, a halted
      # rollout) can't fail an otherwise-successful binary release. The SKIP_*
      # env vars flow into fastlane's supply to honor each flag independently.
      - name: Upload metadata and screenshots to Google Play
        id: metadata
        if: ${{ inputs.update_metadata || inputs.update_screenshots }}
        continue-on-error: true
        env:
          SKIP_METADATA: ${{ inputs.update_metadata && 'false' || 'true' }}
          SKIP_SCREENSHOTS: ${{ inputs.update_screenshots && 'false' || 'true' }}
        run: |
          set -euo pipefail
          # The committed store assets are the source of truth. Supply uploads
          # whatever sits in metadata/android/en-US/images/<type>Screenshots, so
          # stage each device set there, replacing prior shots (rm -rf first) so
          # we never append stale ones. featureGraphic/ is committed source and
          # is left untouched.
          SRC="apps/plot/screenshots/store/play"
          IMAGES="apps/plot/android/fastlane/metadata/android/en-US/images"
          shopt -s nullglob

          stage() {
            local src_dir="$SRC/$1" dest_dir="$IMAGES/$2"
            rm -rf "$dest_dir"
            local pngs=("$src_dir"/*.png)
            if [ "${#pngs[@]}" -eq 0 ]; then
              echo "  (no screenshots in $src_dir — skipping $2)" >&2
              return 0
            fi
            mkdir -p "$dest_dir"
            cp "${pngs[@]}" "$dest_dir/"
            echo "Staged ${#pngs[@]} screenshot(s) into $dest_dir"
          }

          # A Play listing needs phone + 7-inch tablet + 10-inch tablet sets
          # (plus the committed 1024x500 featureGraphic, uploaded as-is). The
          # Galaxy Tab S8 Ultra shots (2560x1600) satisfy both tablet slots, so
          # stage the same tablet set into sevenInch and tenInch.
          stage android-phone phoneScreenshots
          stage android-tablet sevenInchScreenshots
          stage android-tablet tenInchScreenshots

          phone=("$IMAGES/phoneScreenshots"/*.png)
          if [ "${#phone[@]}" -eq 0 ] && [ "${SKIP_SCREENSHOTS:-true}" != "true" ]; then
            echo "ERROR: no Android phone screenshots found under $SRC/android-phone" >&2
            exit 1
          fi

          cd apps/plot/android
          fastlane metadata

      - name: Tag store submission
        run: |
          git tag "android/${{ needs.prepare-release.outputs.release_version }}"
          git push origin "android/${{ needs.prepare-release.outputs.release_version }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-build-${{ needs.prepare-release.outputs.release_version }}
          path: apps/plot/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## Android Release Complete"
            echo ""
            echo "**Version:** ${{ needs.prepare-release.outputs.release_version }}"
            echo "**Uploaded to:** Google Play (internal testing)"
            echo "**Review submission:** ${{ inputs.submit_for_review && (steps.submit.outcome == 'success' && 'promoted to Production for review' || 'promote FAILED — see the Promote step logs (rollout may be halted or changes pending review)') || 'not requested (internal testing only; promote by hand in Play Console)' }}"
            echo "**Metadata + screenshots:** ${{ (inputs.update_metadata || inputs.update_screenshots) && (steps.metadata.outcome == 'success' && 'uploaded to Google Play listing' || 'upload failed — see the metadata step logs (listing may be locked while changes are pending review)') || 'not requested (set update_metadata / update_screenshots to push)' }}"
            echo ""
            echo "### Admin"
            echo "- [Google Play Console (Open Testing)](https://play.google.com/console/u/0/developers/6311596685182865378/app/4972513621080206656/tracks/open-testing)"
          } >> "$GITHUB_STEP_SUMMARY"

  release-macos:
    needs: [prepare-release, refresh-secrets]
    if: inputs.macos
    runs-on: macos-26
    env:
      APPLE_DIST_CERT_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
      APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
      APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Decode signing files
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          MACOS_PROVISIONPROFILE_BASE64: ${{ secrets.MACOS_PROVISIONPROFILE_BASE64 }}
        run: |
          # App Store Connect API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 0600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

          # Distribution provisioning profile
          echo "$MACOS_PROVISIONPROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/macos.provisionprofile"
          chmod 0600 "$RUNNER_TEMP/macos.provisionprofile"

      - name: Import code signing certificates
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Apple Distribution certificate
          DIST_CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$APPLE_DIST_CERT_BASE64" | base64 --decode > "$DIST_CERT_PATH"
          security import "$DIST_CERT_PATH" -P "$APPLE_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$DIST_CERT_PATH"

          # Import Mac Installer Distribution certificate
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer_cert.p12"
          echo "$APPLE_INSTALLER_CERT_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$APPLE_INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$INSTALLER_CERT_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Write app.env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: |
          printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/.env.production
          cp apps/plot/.env.production apps/plot/app.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Configure manual signing for CI
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Install macOS provisioning profile
          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/macos.provisionprofile")")
          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/macos.provisionprofile")")
          cp "$RUNNER_TEMP/macos.provisionprofile" "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.provisionprofile"
          echo "Installed macOS profile: $APP_PROFILE_NAME ($APP_PROFILE_UUID)"

          PBXPROJ="apps/plot/macos/Runner.xcodeproj/project.pbxproj"

          # Switch from automatic to manual signing for all targets
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"

          # Set distribution signing identity (CI only has Apple Distribution, not Mac Development)
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development"/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Apple Distribution"/g' "$PBXPROJ"

          # Set provisioning profile specifier for the Runner target
          python3 -c "
          import re
          content = open('$PBXPROJ').read()
          profile_name = '$APP_PROFILE_NAME'
          content = re.sub(
              r'(PRODUCT_BUNDLE_IDENTIFIER = day\.plot\.app;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";)',
              f'PRODUCT_BUNDLE_IDENTIFIER = day.plot.app;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"{profile_name}\";',
              content
          )
          open('$PBXPROJ', 'w').write(content)
          "

          echo "Manual signing configured for macOS."

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Pin Shorebird to v1.6.102
        shell: bash
        run: |
          # Pinned so a setup-shorebird@v1 upgrade can't silently change build
          # behavior. Bump when the Shorebird server rejects this version as
          # too old, or when adopting a needed fix/feature.
          # Install dir varies per OS (macOS: ~/.shorebird, Linux:
          # $XDG_CONFIG_HOME/shorebird), so resolve it from `which shorebird`.
          SHOREBIRD_DIR="$(dirname "$(dirname "$(command -v shorebird)")")"
          # Checking out the tag re-bootstraps Shorebird's bundled Flutter, which
          # downloads the engine from download.shorebird.dev. That download is
          # prone to transient DNS/network failures on CI, so retry with backoff
          # rather than failing the whole release on one hiccup. The engine is
          # cached locally on success, so the later `shorebird release` reuses it.
          for attempt in 1 2 3 4 5; do
            if git -C "$SHOREBIRD_DIR" fetch --tags --depth=1 origin refs/tags/v1.6.102:refs/tags/v1.6.102 \
              && git -C "$SHOREBIRD_DIR" checkout v1.6.102 \
              && shorebird --version; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: Failed to pin Shorebird to v1.6.102 after 5 attempts" >&2
              exit 1
            fi
            echo "Pin attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep "$((attempt * 10))"
          done

      - name: Build macOS app (Shorebird release)
        run: |
          cd apps/plot
          FLUTTER_VERSION=$(jq -r .flutter ../../.fvmrc)
          # APP_STORE_BUILD=true makes the Mac App Store binary route purchases
          # through StoreKit IAP (UpgradeUi.isAppStoreBuild). Without it the
          # macOS build falls back to the external web/Stripe upgrade flow,
          # which Apple rejects under guideline 3.1.1. iOS doesn't need this
          # flag (isAppStoreBuild short-circuits on Platform.isIOS); the DMG
          # build omits it so direct-distribution users keep the web flow.
          shorebird release macos --flutter-version="$FLUTTER_VERSION" -- --dart-define=APP_STORE_BUILD=true

      - name: Verify app.env in macOS app bundle
        run: |
          ENV_PATH="apps/plot/build/macos/Build/Products/Release/Plot.app/Contents/Frameworks/App.framework/Versions/A/Resources/flutter_assets/app.env"
          if [ ! -s "$ENV_PATH" ]; then
            echo "ERROR: app.env is empty or missing in the macOS app bundle!"
            exit 1
          fi
          echo "✓ app.env is correctly bundled ($(wc -l < "$ENV_PATH") lines)"

      - name: Sign for App Store and create package
        run: |
          cd apps/plot
          BUILD_DIR="build/macos/Build/Products/Release"
          APP_PATH="${BUILD_DIR}/Plot.app"
          PKG_PATH="${BUILD_DIR}/Plot.pkg"
          APP_CERT="Apple Distribution: Plot Technologies Inc. (789MAH2W6P)"
          INSTALLER_CERT="3rd Party Mac Developer Installer: Plot Technologies Inc. (789MAH2W6P)"
          ENTITLEMENTS="macos/Runner/Release.entitlements"

          # Embed distribution provisioning profile
          cp "$RUNNER_TEMP/macos.provisionprofile" "${APP_PATH}/Contents/embedded.provisionprofile"

          # Create processed entitlements with variables expanded
          PROCESSED_ENTITLEMENTS="$RUNNER_TEMP/release-entitlements.plist"
          sed "s/\$(AppIdentifierPrefix)/789MAH2W6P./" "${ENTITLEMENTS}" > "${PROCESSED_ENTITLEMENTS}"

          # Add com.apple.application-identifier (Xcode injects this, needed for TestFlight)
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string 789MAH2W6P.day.plot.app" "${PROCESSED_ENTITLEMENTS}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :com.apple.application-identifier 789MAH2W6P.day.plot.app" "${PROCESSED_ENTITLEMENTS}"

          # Re-sign all nested frameworks and dylibs
          find "${APP_PATH}/Contents/Frameworks" \( -name "*.dylib" -o -name "*.framework" \) -print0 | while IFS= read -r -d '' file; do
            codesign --force --sign "${APP_CERT}" --timestamp "$file" 2>/dev/null || true
          done

          # Re-sign the main app bundle with entitlements
          codesign --force --sign "${APP_CERT}" \
            --entitlements "${PROCESSED_ENTITLEMENTS}" \
            --timestamp \
            --options runtime \
            "${APP_PATH}"

          codesign --verify --verbose "${APP_PATH}"

          # Create installer package
          productbuild \
            --sign "${INSTALLER_CERT}" \
            --component "${APP_PATH}" /Applications \
            "${PKG_PATH}"

          echo "PKG_PATH=apps/plot/${PKG_PATH}" >> "$GITHUB_ENV"
          echo "Package created: ${PKG_PATH}"

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type macos \
            -f "$PKG_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Submit to Mac App Store for review
        id: submit
        if: ${{ inputs.submit_for_review }}
        continue-on-error: true
        env:
          SUBMIT_APP_VERSION: ${{ needs.prepare-release.outputs.version_name }}
        run: |
          cd apps/plot/macos
          fastlane submit

      # continue-on-error hides a failed submission from the job status; surface
      # it as a warning annotation so a silent breakage (e.g. a fastlane option
      # that stopped being valid) is caught rather than shipping as a green run
      # that never submitted.
      - name: Warn if review submission failed
        if: ${{ inputs.submit_for_review && steps.submit.outcome == 'failure' }}
        run: |
          echo "::warning title=macOS review submission failed::Binary uploaded to App Store Connect but 'fastlane submit' failed — submit by hand in App Store Connect. See the 'Submit to Mac App Store for review' step logs."

      # Push the listing text and/or screenshots — only when explicitly
      # requested via the update_metadata / update_screenshots inputs (a regular
      # release uploads the binary only). continue-on-error so a listing whose
      # metadata is temporarily locked (a version In Review / Pending Developer
      # Release) can't fail an otherwise-successful binary release. The SKIP_*
      # env vars flow into fastlane's deliver to honor each flag independently.
      - name: Upload metadata and screenshots to App Store Connect
        id: metadata
        if: ${{ inputs.update_metadata || inputs.update_screenshots }}
        continue-on-error: true
        env:
          SKIP_METADATA: ${{ inputs.update_metadata && 'false' || 'true' }}
          SKIP_SCREENSHOTS: ${{ inputs.update_screenshots && 'false' || 'true' }}
        run: |
          set -euo pipefail
          SRC="apps/plot/screenshots/store/app-store/macos"
          DEST="apps/plot/macos/fastlane/screenshots/en-US"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          shopt -s nullglob
          count=0
          for png in "$SRC"/*.png; do
            cp "$png" "$DEST/$(basename "$png")"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ] && [ "${SKIP_SCREENSHOTS:-true}" != "true" ]; then
            echo "ERROR: no macOS App Store screenshots found under $SRC" >&2
            exit 1
          fi
          echo "Staged $count macOS screenshot(s) into $DEST"

          cd apps/plot/macos
          fastlane metadata

      - name: Tag store submission
        run: |
          git tag "macos/${{ needs.prepare-release.outputs.release_version }}"
          git push origin "macos/${{ needs.prepare-release.outputs.release_version }}"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-${{ needs.prepare-release.outputs.release_version }}
          path: ${{ env.PKG_PATH }}
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## macOS Release Complete"
            echo ""
            echo "**Version:** ${{ needs.prepare-release.outputs.release_version }}"
            echo "**Uploaded to:** App Store Connect"
            echo "**Review submission:** ${{ inputs.submit_for_review && (steps.submit.outcome == 'success' && 'submitted for Mac App Store review' || 'submit FAILED — see the Submit step logs (build may still be processing or a version is already In Review)') || 'not requested (TestFlight only; submit by hand in App Store Connect)' }}"
            echo "**Metadata + screenshots:** ${{ (inputs.update_metadata || inputs.update_screenshots) && (steps.metadata.outcome == 'success' && 'uploaded to Mac App Store listing' || 'upload failed — see the metadata step logs (listing may be locked while a version is in review)') || 'not requested (set update_metadata / update_screenshots to push)' }}"
            echo ""
            echo "### Admin"
            echo "- [TestFlight (macOS)](https://appstoreconnect.apple.com/teams/0a55108e-af39-475a-a7f1-aada0c1decae/apps/6756905242/testflight/macos)"
          } >> "$GITHUB_STEP_SUMMARY"

  release-windows:
    needs: [prepare-release, refresh-secrets]
    if: inputs.windows
    # Pinned to windows-2022 (Visual Studio 2022) for a deterministic, known-good
    # toolchain for the Flutter 3.44.0 release build. `windows-latest` has been
    # drifting (it floated onto the VS2026 image), and we'd rather not have the
    # release pipeline ride a moving image. The coroutine deprecation that the
    # flutter_inappwebview_windows plugin trips on is handled in
    # apps/plot/windows/CMakeLists.txt (see _SILENCE_EXPERIMENTAL_COROUTINE_*).
    runs-on: windows-2022
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Detect branch and set prerelease flag
        id: branch-detect
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Update MSIX version in pubspec.yaml
        shell: bash
        run: |
          cd apps/plot
          VERSION_NAME="${{ needs.prepare-release.outputs.version_name }}"
          BUILD_NUMBER="${{ needs.prepare-release.outputs.build_number }}"

          # Convert to 4-part MSIX version with revision=0 (Windows Store requires revision=0)
          # Format: MAJOR.MINOR.BUILD_NUMBER.0 (e.g., 1.1.296.0)
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION_NAME"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          MSIX_VERSION="${MAJOR}.${MINOR}.${BUILD_NUMBER}.0"

          sed -i "s/msix_version: .*/msix_version: $MSIX_VERSION/" pubspec.yaml
          echo "Updated MSIX version to $MSIX_VERSION (local only, not committed)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Write app.env file
        shell: bash
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/app.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v6
        with:
          path: |
            apps\plot\.dart_tool\build
            apps\plot\**\*.g.dart
            apps\plot\**\*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Pin Shorebird to v1.6.102
        shell: bash
        run: |
          # Pinned so a setup-shorebird@v1 upgrade can't silently change build
          # behavior. Bump when the Shorebird server rejects this version as
          # too old, or when adopting a needed fix/feature.
          # Install dir varies per OS (macOS: ~/.shorebird, Linux:
          # $XDG_CONFIG_HOME/shorebird), so resolve it from `which shorebird`.
          SHOREBIRD_DIR="$(dirname "$(dirname "$(command -v shorebird)")")"
          # Checking out the tag re-bootstraps Shorebird's bundled Flutter, which
          # downloads the engine from download.shorebird.dev. That download is
          # prone to transient DNS/network failures on CI, so retry with backoff
          # rather than failing the whole release on one hiccup. The engine is
          # cached locally on success, so the later `shorebird release` reuses it.
          for attempt in 1 2 3 4 5; do
            if git -C "$SHOREBIRD_DIR" fetch --tags --depth=1 origin refs/tags/v1.6.102:refs/tags/v1.6.102 \
              && git -C "$SHOREBIRD_DIR" checkout v1.6.102 \
              && shorebird --version; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: Failed to pin Shorebird to v1.6.102 after 5 attempts" >&2
              exit 1
            fi
            echo "Pin attempt $attempt failed; retrying in $((attempt * 10))s..." >&2
            sleep "$((attempt * 10))"
          done

      - name: Build Windows app (Shorebird release)
        shell: bash
        run: |
          cd apps/plot
          FLUTTER_VERSION=$(jq -r .flutter ../../.fvmrc)
          # Build CMake projects in parallel across the runner's cores. Flutter's
          # `cmake --build` honors CMAKE_BUILD_PARALLEL_LEVEL and forwards it to
          # MSBuild as /m, overlapping the plugin projects. Combined with /MP in
          # windows/CMakeLists.txt (parallel within each project), this keeps all
          # cores busy. Build-phase only, so it can't affect compiler detection.
          export CMAKE_BUILD_PARALLEL_LEVEL="${NUMBER_OF_PROCESSORS:-4}"
          echo "Using CMAKE_BUILD_PARALLEL_LEVEL=$CMAKE_BUILD_PARALLEL_LEVEL"
          shorebird release windows --flutter-version="$FLUTTER_VERSION" --verbose

      - name: Build MSIX files
        shell: bash
        run: |
          cd apps/plot
          flutter pub run msix:build --certificate-password "$WINDOWS_CERT_PASSWORD"

      - name: Patch MSIX manifest background color
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release
          sed -i 's/BackgroundColor="transparent"/BackgroundColor="#01845e"/' AppxManifest.xml

      - name: Pack and sign MSIX package
        shell: bash
        run: |
          cd apps/plot
          flutter pub run msix:pack --certificate-password "$WINDOWS_CERT_PASSWORD"

      - name: Create portable ZIP archive
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release
          7z a "Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip" ./*
          ls -lh "Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip"

      - name: Rename MSIX with version
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release
          mv "plot.msix" "Plot-${{ needs.prepare-release.outputs.release_version }}.msix"

      - name: Upload files to R2
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release

          export AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          export AWS_DEFAULT_REGION=auto

          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="s3://${R2_BUCKET_NAME}"
          VERSION="${{ needs.prepare-release.outputs.release_version }}"
          MSIX_FILE="Plot-${VERSION}.msix"
          ZIP_FILE="Plot-${VERSION}-portable.zip"

          aws s3 cp "$MSIX_FILE" "${BUCKET}/releases/${VERSION}/windows/${MSIX_FILE}" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$MSIX_FILE" "${BUCKET}/windows" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/vnd.ms-appx" \
            --content-disposition "attachment; filename=\"Plot.msix\""

          aws s3 cp "$ZIP_FILE" "${BUCKET}/releases/${VERSION}/windows/${ZIP_FILE}" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$ZIP_FILE" "${BUCKET}/windows-portable" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/zip" \
            --content-disposition "attachment; filename=\"Plot-portable.zip\""

      - name: Create and upload version manifest
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release

          MSIX_FILE="Plot-${{ needs.prepare-release.outputs.release_version }}.msix"
          ZIP_FILE="Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip"

          MSIX_SIZE=$(stat -c%s "$MSIX_FILE" 2>/dev/null || stat -f%z "$MSIX_FILE")
          MSIX_HASH=$(sha256sum "$MSIX_FILE" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$MSIX_FILE" | awk '{print $1}')

          ZIP_SIZE=$(stat -c%s "$ZIP_FILE" 2>/dev/null || stat -f%z "$ZIP_FILE")
          ZIP_HASH=$(sha256sum "$ZIP_FILE" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$ZIP_FILE" | awk '{print $1}')

          cat > latest-windows.json << EOF
          {
            "version": "${{ needs.prepare-release.outputs.release_version }}",
            "versionName": "${{ needs.prepare-release.outputs.version_name }}",
            "buildNumber": ${{ needs.prepare-release.outputs.build_number }},
            "platform": "windows",
            "msix": {
              "url": "https://download.plot.day/releases/${{ needs.prepare-release.outputs.release_version }}/windows/$MSIX_FILE",
              "size": $MSIX_SIZE,
              "sha256": "$MSIX_HASH"
            },
            "portable": {
              "url": "https://download.plot.day/releases/${{ needs.prepare-release.outputs.release_version }}/windows/$ZIP_FILE",
              "size": $ZIP_SIZE,
              "sha256": "$ZIP_HASH"
            },
            "releaseDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "minWindowsVersion": "10.0.17763.0"
          }
          EOF

          cat latest-windows.json

          export AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          export AWS_DEFAULT_REGION=auto

          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp latest-windows.json "s3://${R2_BUCKET_NAME}/latest-windows.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-${{ needs.prepare-release.outputs.release_version }}
          path: |
            apps/plot/build/windows/x64/runner/Release/Plot-${{ needs.prepare-release.outputs.release_version }}.msix
            apps/plot/build/windows/x64/runner/Release/Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip
            apps/plot/build/windows/x64/runner/Release/latest-windows.json
          retention-days: 30

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/plot/build/windows/x64/runner/Release

          MSIX_FILE="Plot-${{ needs.prepare-release.outputs.release_version }}.msix"
          ZIP_FILE="Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip"
          TAG_NAME="windows@${{ needs.prepare-release.outputs.release_version }}"
          RELEASE_TITLE="Plot Windows ${{ needs.prepare-release.outputs.release_version }}"

          MSIX_SIZE=$(cat latest-windows.json | grep -A 3 '"msix"' | grep '"size"' | sed 's/.*: \([0-9]*\).*/\1/')
          MSIX_HASH=$(cat latest-windows.json | grep -A 3 '"msix"' | grep '"sha256"' | sed 's/.*: "\(.*\)".*/\1/')
          ZIP_SIZE=$(cat latest-windows.json | grep -A 3 '"portable"' | grep '"size"' | sed 's/.*: \([0-9]*\).*/\1/')
          ZIP_HASH=$(cat latest-windows.json | grep -A 3 '"portable"' | grep '"sha256"' | sed 's/.*: "\(.*\)".*/\1/')
          RELEASE_DATE=$(cat latest-windows.json | grep '"releaseDate"' | sed 's/.*: "\(.*\)".*/\1/')

          cat > release-notes.md << EOF
          ## Plot Windows ${{ needs.prepare-release.outputs.release_version }}

          **Version:** ${{ needs.prepare-release.outputs.version_name }}
          **Build Number:** ${{ needs.prepare-release.outputs.build_number }}
          **Platform:** Windows
          **Release Date:** ${RELEASE_DATE}

          ### Download

          #### MSIX Installer (Recommended)
          - **File**: [Plot-${{ needs.prepare-release.outputs.release_version }}.msix](https://download.plot.day/releases/${{ needs.prepare-release.outputs.release_version }}/windows/Plot-${{ needs.prepare-release.outputs.release_version }}.msix)
          - **Size**: ${MSIX_SIZE} bytes
          - **SHA256**: \`${MSIX_HASH}\`

          #### Portable ZIP
          - **File**: [Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip](https://download.plot.day/releases/${{ needs.prepare-release.outputs.release_version }}/windows/Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip)
          - **Size**: ${ZIP_SIZE} bytes
          - **SHA256**: \`${ZIP_HASH}\`

          ### Requirements

          - **Minimum Windows Version:** Windows 10 version 1809 (build 17763) or later

          ### Installation

          **MSIX Package**: Double-click the .msix file to install.

          **Portable ZIP**: Extract the ZIP file and run \`plot.exe\`.

          ### Auto-Update

          For auto-update systems, see the [manifest JSON](https://download.plot.day/latest-windows.json).
          EOF

          PRERELEASE_FLAG=""
          if [[ "${{ steps.branch-detect.outputs.is_prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG="--latest"
          fi

          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            "$MSIX_FILE" \
            "$ZIP_FILE"

      - name: Check Microsoft Store credentials
        id: ms-store
        shell: bash
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
        run: |
          # Secrets cannot be referenced in step `if:` expressions, so gate the
          # Store steps on a plain output derived from a non-empty client ID.
          # Until the Partner Center secrets are added, this no-ops cleanly so a
          # Windows release is never blocked by missing Store credentials.
          if [ -n "$AZURE_AD_APPLICATION_CLIENT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Microsoft Store credentials not configured — skipping Store publish."
          fi

      - name: Set up Microsoft Store Developer CLI
        if: steps.ms-store.outputs.enabled == 'true'
        uses: microsoft/setup-msstore-cli@v1.3

      - name: Configure Microsoft Store CLI
        if: steps.ms-store.outputs.enabled == 'true'
        shell: bash
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          # reconfigure persists credentials to disk for the rest of the job,
          # so the publish/metadata/submit steps below need no re-auth.
          msstore reconfigure \
            --tenantId "$AZURE_AD_TENANT_ID" \
            --sellerId "$SELLER_ID" \
            --clientId "$AZURE_AD_APPLICATION_CLIENT_ID" \
            --clientSecret "$AZURE_AD_APPLICATION_SECRET"

      # Best-effort, matching the metadata/submit steps below: the binary
      # release (R2 upload + GitHub Release) has already succeeded by this
      # point, so a Store-side problem (e.g. the Azure AD app not yet
      # associated with the Partner Center account, which surfaces as
      # "Could not retrieve your application") must not fail the whole release.
      # --verbose makes the underlying Submission API error visible for
      # diagnosis when it does fail.
      - name: Publish MSIX to Microsoft Store (draft)
        if: steps.ms-store.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release
          MSIX_FILE="Plot-${{ needs.prepare-release.outputs.release_version }}.msix"

          # Product 9PKTCSN8SNZF = Plot in Partner Center. Always upload as a
          # draft (--noCommit) so the metadata step can patch the same pending
          # submission; the "Submit ... for review" step commits package +
          # metadata together when submit_for_review is set.
          msstore publish "$MSIX_FILE" -id 9PKTCSN8SNZF --noCommit --verbose

      # Best-effort: patch the committed Windows listing text onto the pending
      # draft submission. continue-on-error so a locked listing can't fail an
      # otherwise-successful binary release (matches the iOS/Android/macOS
      # metadata steps). updateMetadata is a FULL replace for packaged apps, so
      # we fetch the whole submission and overwrite only the text fields —
      # screenshots and every other field pass through untouched.
      - name: Upload metadata to Microsoft Store
        id: metadata
        if: steps.ms-store.outputs.enabled == 'true' && inputs.update_metadata
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/apps/plot/windows/store/en-US"

          # Fetch the pending draft as JSON. Two clean-ups before jq:
          #  1. drop any leading Spectre.Console status line (take from the
          #     first '{' onward);
          #  2. strip C0 control chars (U+0000–U+001F). The Store can return a
          #     stray control character embedded in a previously UI-authored
          #     listing field, which jq rejects with "control characters must be
          #     escaped" (exit 5) — and because this step is continue-on-error,
          #     that failure is otherwise silent. Those bytes are only ever
          #     invalid-in-JSON here, never part of a UTF-8 multibyte sequence
          #     (0x00–0x1F can't be continuation bytes), and the fields we patch
          #     are replaced from the repo files anyway, so removing them is safe.
          RAW="$(msstore submission get 9PKTCSN8SNZF)"
          SUB="$(printf '%s' "$RAW" | awk '/^{/{f=1} f' | tr -d '\000-\037')"
          if [ -z "$SUB" ]; then
            echo "::warning::Could not read submission JSON — skipping metadata."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pick the English listing key (e.g. en-us); fall back to the first.
          LANG_KEY="$(printf '%s' "$SUB" | jq -r '
            (.listings // {}) as $l
            | ([$l | keys[] | select(test("^en";"i"))][0]) // ($l | keys[0]) // empty')"
          if [ -z "$LANG_KEY" ]; then
            echo "::warning::No listing language on the submission — skipping metadata."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Patching listing '$LANG_KEY'"

          PATCHED="$(printf '%s' "$SUB" | jq \
            --arg k "$LANG_KEY" \
            --rawfile desc     "$SRC/description.txt" \
            --rawfile short    "$SRC/short_description.txt" \
            --rawfile features "$SRC/features.txt" \
            --rawfile terms    "$SRC/search_terms.txt" '
            .listings[$k].baseListing.description      = ($desc  | rtrimstr("\n"))
            | .listings[$k].baseListing.shortDescription = ($short | rtrimstr("\n"))
            | .listings[$k].baseListing.features         = ($features | split("\n") | map(select(. != "")))
            | .listings[$k].baseListing.keywords         = ($terms    | split("\n") | map(select(. != "")))
          ')"

          msstore submission updateMetadata 9PKTCSN8SNZF "$PATCHED"
          echo "Metadata pushed for listing '$LANG_KEY'."

      # Screenshots can't go through `msstore` (no image command) or
      # updateMetadata (text only), so push them through the Submission REST API
      # against the same pending draft msstore publish created. The script
      # preserves the just-uploaded package in the fileUploadUrl blob (it
      # appends the screenshots rather than replacing it). continue-on-error,
      # like the metadata step.
      - name: Upload screenshots to Microsoft Store
        id: screenshots
        if: steps.ms-store.outputs.enabled == 'true' && inputs.update_screenshots
        continue-on-error: true
        shell: bash
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ms-store-screenshots.sh"

      - name: Submit Microsoft Store submission for review
        id: submit
        if: steps.ms-store.outputs.enabled == 'true' && inputs.submit_for_review
        continue-on-error: true
        shell: bash
        run: |
          # Commits the pending submission (package + patched metadata) to
          # certification. Skipped when submit_for_review is false, leaving the
          # draft in Partner Center.
          msstore submission publish 9PKTCSN8SNZF

      # continue-on-error hides a failed submission from the job status; surface
      # it as a warning annotation so a silent breakage is caught rather than
      # shipping as a green run that never submitted for certification.
      - name: Warn if review submission failed
        if: ${{ steps.ms-store.outputs.enabled == 'true' && inputs.submit_for_review && steps.submit.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::warning title=Microsoft Store submission failed::Package uploaded to Partner Center but 'msstore submission publish' failed — submit by hand in Partner Center. See the 'Submit Microsoft Store submission for review' step logs."

      - name: Tag store submission
        shell: bash
        run: |
          git tag "windows/${{ needs.prepare-release.outputs.release_version }}"
          git push origin "windows/${{ needs.prepare-release.outputs.release_version }}"

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Windows Release Complete"
            echo ""
            echo "**Version:** ${{ needs.prepare-release.outputs.release_version }}"
            echo ""
            echo "### Stable URLs"
            echo "- MSIX: https://download.plot.day/windows"
            echo "- Portable ZIP: https://download.plot.day/windows-portable"
            echo "- Manifest: https://download.plot.day/latest-windows.json"
            echo ""
            echo "### Microsoft Store"
            if [ "${{ steps.ms-store.outputs.enabled }}" != "true" ]; then
              echo "- ⏭️ Skipped (Store credentials not configured)"
            elif [ "${{ inputs.submit_for_review }}" = "true" ]; then
              echo "- ✅ Uploaded and submitted for certification"
            else
              echo "- 📝 Uploaded as draft — submit it in Partner Center"
            fi
            echo "- Listing metadata: ${{ inputs.update_metadata && (steps.metadata.outcome == 'success' && steps.metadata.outputs.skipped != 'true' && 'pushed from apps/plot/windows/store/en-US' || 'push failed — see the Upload metadata step') || 'not requested (set update_metadata to push)' }}"
            echo "- Screenshots: ${{ inputs.update_screenshots && (steps.screenshots.outcome == 'success' && 'pushed from apps/plot/screenshots/store/ms-store/windows' || 'push failed — see the Upload screenshots step') || 'not requested (set update_screenshots to push)' }}"
            echo ""
            echo "### Admin"
            echo "- [Microsoft Partner Center](https://partner.microsoft.com/en-us/dashboard/products/9PKTCSN8SNZF/)"
          } >> "$GITHUB_STEP_SUMMARY"
