name: Release

on:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Release iOS'
        type: boolean
        default: true
      android:
        description: 'Release Android'
        type: boolean
        default: true
      macos:
        description: 'Release macOS'
        type: boolean
        default: true
      windows:
        description: 'Release Windows'
        type: boolean
        default: true

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  refresh-secrets:
    uses: ./.github/workflows/refresh-secrets.yml
    secrets: inherit

  prepare-release:
    runs-on: ubuntu-latest
    concurrency:
      group: version-bump
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_branch: ${{ steps.version.outputs.release_branch }}
      release_sha: ${{ steps.branch.outputs.sha }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Get GitHub App User ID
        id: app-user
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Read current version
        id: version
        run: |
          cd apps/plot
          RELEASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION_NAME=$(echo "$RELEASE_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$RELEASE_VERSION" | cut -d'+' -f2)

          {
            echo "release_version=$RELEASE_VERSION"
            echo "version_name=$VERSION_NAME"
            echo "build_number=$BUILD_NUMBER"
            echo "release_branch=release/$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

          echo "Release version: $RELEASE_VERSION"

      - name: Create release branch
        id: branch
        run: |
          RELEASE_BRANCH="${{ steps.version.outputs.release_branch }}"
          git checkout -b "$RELEASE_BRANCH"
          git push origin "$RELEASE_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Created release branch: $RELEASE_BRANCH"

      - name: Stamp changelog and bump main to next build number
        run: |
          RELEASE_VERSION="${{ steps.version.outputs.release_version }}"
          STAMP_DATE="$(date -u +%Y-%m-%d)"
          NEXT_BUILD_NUMBER=$((${{ steps.version.outputs.build_number }} + 1))
          NEXT_VERSION="${{ steps.version.outputs.version_name }}+${NEXT_BUILD_NUMBER}"

          # We're still on the freshly-created release branch, which sits at the
          # release commit (== main's tip). Make the stamp + bump commit here and
          # fast-forward it onto main with `git push origin HEAD:main`, instead of
          # `git checkout main`. The branch switch mutated the worktree and could
          # leave apps/plot/pubspec.yaml unstaged ("pathspec did not match") by
          # the time `git add` ran; pushing HEAD lands the identical commit on
          # main (parent = release commit) without touching the worktree.
          node scripts/stamp-updates.mjs "$RELEASE_VERSION" "$STAMP_DATE"
          # Anchor on ^version: so we don't also rewrite the msix_version: line.
          sed -i "s/^version: .*/version: ${NEXT_VERSION}/" apps/plot/pubspec.yaml

          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add apps/plot/pubspec.yaml docs/updates.md
          git commit -m "Release ${RELEASE_VERSION}: stamp changelog + bump to ${NEXT_VERSION} [skip ci]"
          git push origin HEAD:main

          echo "Stamped changelog for $RELEASE_VERSION; bumped main to: $NEXT_VERSION"

      - name: Summary
        run: |
          {
            echo "## Release Prepared"
            echo ""
            echo "**Release version:** ${{ steps.version.outputs.release_version }}"
            echo "**Release branch:** ${{ steps.version.outputs.release_branch }}"
            echo "**Main bumped to:** ${{ steps.version.outputs.version_name }}+$((${{ steps.version.outputs.build_number }} + 1))"
          } >> "$GITHUB_STEP_SUMMARY"

  release-ios:
    needs: [prepare-release, refresh-secrets]
    if: inputs.ios
    runs-on: macos-26
    env:
      APPLE_DIST_CERT_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
      APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Decode signing files
        id: profiles
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_SHARE_EXT_MOBILEPROVISION_BASE64: ${{ secrets.IOS_SHARE_EXT_MOBILEPROVISION_BASE64 }}
          FIREBASE_IOS_GOOGLE_SERVICE_INFO: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO }}
        run: |
          # App Store Connect API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 0600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # iOS App Store provisioning profile (day.plot.app)
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/ios.mobileprovision"
          chmod 0600 "$RUNNER_TEMP/ios.mobileprovision"

          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios.mobileprovision")")
          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios.mobileprovision")")
          cp "$RUNNER_TEMP/ios.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.mobileprovision"
          echo "Installed app profile: $APP_PROFILE_NAME ($APP_PROFILE_UUID)"
          echo "app_profile_name=$APP_PROFILE_NAME" >> "$GITHUB_OUTPUT"

          # iOS App Store provisioning profile for ShareExtension (day.plot.app.ShareExtension)
          echo "$IOS_SHARE_EXT_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-share-extension.mobileprovision"
          chmod 0600 "$RUNNER_TEMP/ios-share-extension.mobileprovision"

          EXT_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios-share-extension.mobileprovision")")
          EXT_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios-share-extension.mobileprovision")")
          cp "$RUNNER_TEMP/ios-share-extension.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${EXT_PROFILE_UUID}.mobileprovision"
          echo "Installed extension profile: $EXT_PROFILE_NAME ($EXT_PROFILE_UUID)"
          echo "ext_profile_name=$EXT_PROFILE_NAME" >> "$GITHUB_OUTPUT"

          # Firebase config for iOS
          echo "$FIREBASE_IOS_GOOGLE_SERVICE_INFO" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/ios/Runner/GoogleService-Info.plist"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/ios/Runner/GoogleService-Info.plist"

      - name: Import code signing certificates
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Apple Distribution certificate
          DIST_CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$APPLE_DIST_CERT_BASE64" | base64 --decode > "$DIST_CERT_PATH"
          security import "$DIST_CERT_PATH" -P "$APPLE_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$DIST_CERT_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Configure manual signing for CI
        env:
          APP_PROFILE_NAME: ${{ steps.profiles.outputs.app_profile_name }}
          EXT_PROFILE_NAME: ${{ steps.profiles.outputs.ext_profile_name }}
        run: |
          cd apps/plot/ios

          PBXPROJ="Runner.xcodeproj/project.pbxproj"

          # Switch from automatic to manual signing for all targets
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"

          # Set distribution signing identity for all targets
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' "$PBXPROJ"

          # Add provisioning profile specifier for Runner target
          python3 -c "
          import re, sys
          content = open('$PBXPROJ').read()
          # Runner target: day.plot.app but not .ShareExtension or .RunnerTests
          content = re.sub(
              r'(PRODUCT_BUNDLE_IDENTIFIER = day\.plot\.app;(?!\.))',
              r'\1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$APP_PROFILE_NAME\";',
              content
          )
          # ShareExtension target
          content = content.replace(
              'PRODUCT_BUNDLE_IDENTIFIER = day.plot.app.ShareExtension;',
              'PRODUCT_BUNDLE_IDENTIFIER = day.plot.app.ShareExtension;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$EXT_PROFILE_NAME\";'
          )
          open('$PBXPROJ', 'w').write(content)
          "

          # Create ExportOptions.plist for app-store distribution
          /usr/libexec/PlistBuddy -c "Clear dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string 789MAH2W6P" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:day.plot.app string $APP_PROFILE_NAME" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:day.plot.app.ShareExtension string $EXT_PROFILE_NAME" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" ExportOptions.plist

          echo "Manual signing configured. ExportOptions.plist created."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Write app.env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: |
          printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/.env.production
          cp apps/plot/.env.production apps/plot/app.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Pin Shorebird to v1.6.102
        shell: bash
        run: |
          # Pinned so a setup-shorebird@v1 upgrade can't silently change build
          # behavior. Bump when the Shorebird server rejects this version as
          # too old, or when adopting a needed fix/feature.
          # Install dir varies per OS (macOS: ~/.shorebird, Linux:
          # $XDG_CONFIG_HOME/shorebird), so resolve it from `which shorebird`.
          SHOREBIRD_DIR="$(dirname "$(dirname "$(command -v shorebird)")")"
          git -C "$SHOREBIRD_DIR" fetch --tags --depth=1 origin refs/tags/v1.6.102:refs/tags/v1.6.102
          git -C "$SHOREBIRD_DIR" checkout v1.6.102
          shorebird --version

      - name: Build iOS app (Shorebird release)
        run: |
          cd apps/plot
          FLUTTER_VERSION=$(jq -r .flutter ../../.fvmrc)
          shorebird release ios --flutter-version="$FLUTTER_VERSION" -- --export-options-plist=ios/ExportOptions.plist

      - name: Verify app.env in IPA
        run: |
          IPA_PATH=$(find apps/plot/build/ios/ipa -name "*.ipa" -print -quit)
          TEMP_DIR=$(mktemp -d)
          unzip -q "$IPA_PATH" -d "$TEMP_DIR"
          ENV_CONTENT=$(find "$TEMP_DIR" -path "*/flutter_assets/app.env" -exec cat {} \;)
          if [ -z "$ENV_CONTENT" ]; then
            echo "ERROR: app.env is empty in the IPA bundle!"
            rm -rf "$TEMP_DIR"
            exit 1
          fi
          echo "✓ app.env is correctly bundled ($(echo "$ENV_CONTENT" | wc -l) lines)"
          rm -rf "$TEMP_DIR"

      - name: Upload to App Store Connect
        run: |
          IPA_PATH=$(find apps/plot/build/ios/ipa -name "*.ipa" -print -quit 2>/dev/null)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file found in apps/plot/build/ios/ipa/"
            exit 1
          fi

          echo "Uploading $IPA_PATH..."
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Tag store submission
        run: |
          git tag "ios/${{ needs.prepare-release.outputs.release_version }}"
          git push origin "ios/${{ needs.prepare-release.outputs.release_version }}"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ needs.prepare-release.outputs.release_version }}
          path: apps/plot/build/ios/ipa/*.ipa
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## iOS Release Complete"
            echo ""
            echo "**Version:** ${{ needs.prepare-release.outputs.release_version }}"
            echo "**Uploaded to:** App Store Connect (TestFlight)"
            echo ""
            echo "### Admin"
            echo "- [TestFlight (iOS)](https://appstoreconnect.apple.com/teams/0a55108e-af39-475a-a7f1-aada0c1decae/apps/6756905242/testflight/ios)"
          } >> "$GITHUB_STEP_SUMMARY"

  release-android:
    needs: [prepare-release, refresh-secrets]
    if: inputs.android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      # The Shorebird Android release (Flutter engine download + Gradle caches +
      # NDK + AAB outputs) overflows the runner's root filesystem, failing with
      # "No space left on device" during mergeReleaseNativeLibs/ExtractJniTransform.
      # Reclaim space by removing pre-installed toolchains this job never uses.
      # Runs first so nothing it deletes is recreated by later setup steps; it
      # deliberately leaves the Android SDK/NDK, Java, Flutter, and Rust intact.
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium /usr/local/share/chrome_driver
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Decode signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_STORE_SERVICE_KEY: ${{ secrets.PLAY_STORE_SERVICE_KEY }}
          FIREBASE_ANDROID_GOOGLE_SERVICES: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES }}
        run: |
          # Android signing keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/android/plot-release.jks"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/android/plot-release.jks"

          # Google Play API service key
          mkdir -p "$GITHUB_WORKSPACE/apps/plot/android"
          echo "$PLAY_STORE_SERVICE_KEY" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/android/play-deployer-service-key.json"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/android/play-deployer-service-key.json"

          # Firebase config for Android
          echo "$FIREBASE_ANDROID_GOOGLE_SERVICES" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/android/app/google-services.json"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/android/app/google-services.json"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Write app.env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/app.env

      - name: Create key.properties
        run: |
          cat > apps/plot/android/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=plot-release
          storeFile=../plot-release.jks
          EOF

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Pin Shorebird to v1.6.102
        shell: bash
        run: |
          # Pinned so a setup-shorebird@v1 upgrade can't silently change build
          # behavior. Bump when the Shorebird server rejects this version as
          # too old, or when adopting a needed fix/feature.
          # Install dir varies per OS (macOS: ~/.shorebird, Linux:
          # $XDG_CONFIG_HOME/shorebird), so resolve it from `which shorebird`.
          SHOREBIRD_DIR="$(dirname "$(dirname "$(command -v shorebird)")")"
          git -C "$SHOREBIRD_DIR" fetch --tags --depth=1 origin refs/tags/v1.6.102:refs/tags/v1.6.102
          git -C "$SHOREBIRD_DIR" checkout v1.6.102
          shorebird --version

      - name: Build Android app (Shorebird release)
        run: |
          cd apps/plot
          FLUTTER_VERSION=$(jq -r .flutter ../../.fvmrc)
          shorebird release android --flutter-version="$FLUTTER_VERSION"

      - name: Verify app.env in AAB
        run: |
          AAB_PATH="apps/plot/build/app/outputs/bundle/release/app-release.aab"
          ENV_CONTENT=$(unzip -p "$AAB_PATH" "base/assets/flutter_assets/app.env")
          if [ -z "$ENV_CONTENT" ]; then
            echo "ERROR: app.env is empty in the AAB bundle!"
            exit 1
          fi
          echo "✓ app.env is correctly bundled ($(echo "$ENV_CONTENT" | wc -l) lines)"

      - name: Install fastlane
        run: |
          sudo gem install fastlane --no-document

      - name: Upload to Google Play (internal testing)
        run: |
          cd apps/plot/android
          fastlane beta aab:$GITHUB_WORKSPACE/apps/plot/build/app/outputs/bundle/release/app-release.aab

      - name: Tag store submission
        run: |
          git tag "android/${{ needs.prepare-release.outputs.release_version }}"
          git push origin "android/${{ needs.prepare-release.outputs.release_version }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ needs.prepare-release.outputs.release_version }}
          path: apps/plot/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## Android Release Complete"
            echo ""
            echo "**Version:** ${{ needs.prepare-release.outputs.release_version }}"
            echo "**Uploaded to:** Google Play (internal testing)"
            echo ""
            echo "### Admin"
            echo "- [Google Play Console (Open Testing)](https://play.google.com/console/u/0/developers/6311596685182865378/app/4972513621080206656/tracks/open-testing)"
          } >> "$GITHUB_STEP_SUMMARY"

  release-macos:
    needs: [prepare-release, refresh-secrets]
    if: inputs.macos
    runs-on: macos-26
    env:
      APPLE_DIST_CERT_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
      APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
      APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Decode signing files
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          MACOS_PROVISIONPROFILE_BASE64: ${{ secrets.MACOS_PROVISIONPROFILE_BASE64 }}
        run: |
          # App Store Connect API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          chmod 0600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

          # Distribution provisioning profile
          echo "$MACOS_PROVISIONPROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/macos.provisionprofile"
          chmod 0600 "$RUNNER_TEMP/macos.provisionprofile"

      - name: Import code signing certificates
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Apple Distribution certificate
          DIST_CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$APPLE_DIST_CERT_BASE64" | base64 --decode > "$DIST_CERT_PATH"
          security import "$DIST_CERT_PATH" -P "$APPLE_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$DIST_CERT_PATH"

          # Import Mac Installer Distribution certificate
          INSTALLER_CERT_PATH="$RUNNER_TEMP/installer_cert.p12"
          echo "$APPLE_INSTALLER_CERT_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"
          security import "$INSTALLER_CERT_PATH" -P "$APPLE_INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$INSTALLER_CERT_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Write app.env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: |
          printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/.env.production
          cp apps/plot/.env.production apps/plot/app.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Configure manual signing for CI
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Install macOS provisioning profile
          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/macos.provisionprofile")")
          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/macos.provisionprofile")")
          cp "$RUNNER_TEMP/macos.provisionprofile" "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.provisionprofile"
          echo "Installed macOS profile: $APP_PROFILE_NAME ($APP_PROFILE_UUID)"

          PBXPROJ="apps/plot/macos/Runner.xcodeproj/project.pbxproj"

          # Switch from automatic to manual signing for all targets
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"

          # Set distribution signing identity (CI only has Apple Distribution, not Mac Development)
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development"/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Apple Distribution"/g' "$PBXPROJ"

          # Set provisioning profile specifier for the Runner target
          python3 -c "
          import re
          content = open('$PBXPROJ').read()
          profile_name = '$APP_PROFILE_NAME'
          content = re.sub(
              r'(PRODUCT_BUNDLE_IDENTIFIER = day\.plot\.app;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";)',
              f'PRODUCT_BUNDLE_IDENTIFIER = day.plot.app;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"{profile_name}\";',
              content
          )
          open('$PBXPROJ', 'w').write(content)
          "

          echo "Manual signing configured for macOS."

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Pin Shorebird to v1.6.102
        shell: bash
        run: |
          # Pinned so a setup-shorebird@v1 upgrade can't silently change build
          # behavior. Bump when the Shorebird server rejects this version as
          # too old, or when adopting a needed fix/feature.
          # Install dir varies per OS (macOS: ~/.shorebird, Linux:
          # $XDG_CONFIG_HOME/shorebird), so resolve it from `which shorebird`.
          SHOREBIRD_DIR="$(dirname "$(dirname "$(command -v shorebird)")")"
          git -C "$SHOREBIRD_DIR" fetch --tags --depth=1 origin refs/tags/v1.6.102:refs/tags/v1.6.102
          git -C "$SHOREBIRD_DIR" checkout v1.6.102
          shorebird --version

      - name: Build macOS app (Shorebird release)
        run: |
          cd apps/plot
          FLUTTER_VERSION=$(jq -r .flutter ../../.fvmrc)
          shorebird release macos --flutter-version="$FLUTTER_VERSION"

      - name: Verify app.env in macOS app bundle
        run: |
          ENV_PATH="apps/plot/build/macos/Build/Products/Release/Plot.app/Contents/Frameworks/App.framework/Versions/A/Resources/flutter_assets/app.env"
          if [ ! -s "$ENV_PATH" ]; then
            echo "ERROR: app.env is empty or missing in the macOS app bundle!"
            exit 1
          fi
          echo "✓ app.env is correctly bundled ($(wc -l < "$ENV_PATH") lines)"

      - name: Sign for App Store and create package
        run: |
          cd apps/plot
          BUILD_DIR="build/macos/Build/Products/Release"
          APP_PATH="${BUILD_DIR}/Plot.app"
          PKG_PATH="${BUILD_DIR}/Plot.pkg"
          APP_CERT="Apple Distribution: Plot Technologies Inc. (789MAH2W6P)"
          INSTALLER_CERT="3rd Party Mac Developer Installer: Plot Technologies Inc. (789MAH2W6P)"
          ENTITLEMENTS="macos/Runner/Release.entitlements"

          # Embed distribution provisioning profile
          cp "$RUNNER_TEMP/macos.provisionprofile" "${APP_PATH}/Contents/embedded.provisionprofile"

          # Create processed entitlements with variables expanded
          PROCESSED_ENTITLEMENTS="$RUNNER_TEMP/release-entitlements.plist"
          sed "s/\$(AppIdentifierPrefix)/789MAH2W6P./" "${ENTITLEMENTS}" > "${PROCESSED_ENTITLEMENTS}"

          # Add com.apple.application-identifier (Xcode injects this, needed for TestFlight)
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string 789MAH2W6P.day.plot.app" "${PROCESSED_ENTITLEMENTS}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :com.apple.application-identifier 789MAH2W6P.day.plot.app" "${PROCESSED_ENTITLEMENTS}"

          # Re-sign all nested frameworks and dylibs
          find "${APP_PATH}/Contents/Frameworks" \( -name "*.dylib" -o -name "*.framework" \) -print0 | while IFS= read -r -d '' file; do
            codesign --force --sign "${APP_CERT}" --timestamp "$file" 2>/dev/null || true
          done

          # Re-sign the main app bundle with entitlements
          codesign --force --sign "${APP_CERT}" \
            --entitlements "${PROCESSED_ENTITLEMENTS}" \
            --timestamp \
            --options runtime \
            "${APP_PATH}"

          codesign --verify --verbose "${APP_PATH}"

          # Create installer package
          productbuild \
            --sign "${INSTALLER_CERT}" \
            --component "${APP_PATH}" /Applications \
            "${PKG_PATH}"

          echo "PKG_PATH=apps/plot/${PKG_PATH}" >> "$GITHUB_ENV"
          echo "Package created: ${PKG_PATH}"

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type macos \
            -f "$PKG_PATH" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Tag store submission
        run: |
          git tag "macos/${{ needs.prepare-release.outputs.release_version }}"
          git push origin "macos/${{ needs.prepare-release.outputs.release_version }}"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ needs.prepare-release.outputs.release_version }}
          path: ${{ env.PKG_PATH }}
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## macOS Release Complete"
            echo ""
            echo "**Version:** ${{ needs.prepare-release.outputs.release_version }}"
            echo "**Uploaded to:** App Store Connect"
            echo ""
            echo "### Admin"
            echo "- [TestFlight (macOS)](https://appstoreconnect.apple.com/teams/0a55108e-af39-475a-a7f1-aada0c1decae/apps/6756905242/testflight/macos)"
          } >> "$GITHUB_STEP_SUMMARY"

  release-windows:
    needs: [prepare-release, refresh-secrets]
    if: inputs.windows
    # Pinned to windows-2022 (Visual Studio 2022). GitHub floated
    # `windows-latest` onto the `windows-2025-vs2026` image, whose Visual
    # Studio 2026 (VS18) toolchain breaks the Flutter 3.44.0 Windows build at
    # CMake configure time ("The CXX compiler identification is unknown" ->
    # "No CMAKE_CXX_COMPILER could be found" at the Runner's project() call).
    # windows-2022 is the last-known-good image and won't receive VS2026.
    # Revisit when the pinned Flutter version supports VS2026.
    runs-on: windows-2022
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      # cl.exe reads the CL env var and prepends these options to every
      # compilation. The flutter_inappwebview_windows plugin still includes
      # <experimental/coroutine>; under /WX the deprecation is treated as an
      # error (a hard STL1011 / C2338 on newer MSVC, a warning-as-error on
      # VS2022) unless this macro is defined. This is Microsoft's documented
      # suppression and reaches the plugin build nested inside Shorebird ->
      # Flutter -> CMake without patching pub-cache source.
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

    steps:
      - name: Detect branch and set prerelease flag
        id: branch-detect
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Update MSIX version in pubspec.yaml
        shell: bash
        run: |
          cd apps/plot
          VERSION_NAME="${{ needs.prepare-release.outputs.version_name }}"
          BUILD_NUMBER="${{ needs.prepare-release.outputs.build_number }}"

          # Convert to 4-part MSIX version with revision=0 (Windows Store requires revision=0)
          # Format: MAJOR.MINOR.BUILD_NUMBER.0 (e.g., 1.1.296.0)
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION_NAME"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          MSIX_VERSION="${MAJOR}.${MINOR}.${BUILD_NUMBER}.0"

          sed -i "s/msix_version: .*/msix_version: $MSIX_VERSION/" pubspec.yaml
          echo "Updated MSIX version to $MSIX_VERSION (local only, not committed)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Write app.env file
        shell: bash
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/app.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            apps\plot\.dart_tool\build
            apps\plot\**\*.g.dart
            apps\plot\**\*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Pin Shorebird to v1.6.102
        shell: bash
        run: |
          # Pinned so a setup-shorebird@v1 upgrade can't silently change build
          # behavior. Bump when the Shorebird server rejects this version as
          # too old, or when adopting a needed fix/feature.
          # Install dir varies per OS (macOS: ~/.shorebird, Linux:
          # $XDG_CONFIG_HOME/shorebird), so resolve it from `which shorebird`.
          SHOREBIRD_DIR="$(dirname "$(dirname "$(command -v shorebird)")")"
          git -C "$SHOREBIRD_DIR" fetch --tags --depth=1 origin refs/tags/v1.6.102:refs/tags/v1.6.102
          git -C "$SHOREBIRD_DIR" checkout v1.6.102
          shorebird --version

      - name: Build Windows app (Shorebird release)
        shell: bash
        run: |
          cd apps/plot
          FLUTTER_VERSION=$(jq -r .flutter ../../.fvmrc)
          shorebird release windows --flutter-version="$FLUTTER_VERSION" --verbose

      - name: Build MSIX files
        shell: bash
        run: |
          cd apps/plot
          flutter pub run msix:build --certificate-password "$WINDOWS_CERT_PASSWORD"

      - name: Patch MSIX manifest background color
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release
          sed -i 's/BackgroundColor="transparent"/BackgroundColor="#01845e"/' AppxManifest.xml

      - name: Pack and sign MSIX package
        shell: bash
        run: |
          cd apps/plot
          flutter pub run msix:pack --certificate-password "$WINDOWS_CERT_PASSWORD"

      - name: Create portable ZIP archive
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release
          7z a "Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip" ./*
          ls -lh "Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip"

      - name: Rename MSIX with version
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release
          mv "plot.msix" "Plot-${{ needs.prepare-release.outputs.release_version }}.msix"

      - name: Upload files to R2
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release

          export AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          export AWS_DEFAULT_REGION=auto

          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="s3://${R2_BUCKET_NAME}"
          VERSION="${{ needs.prepare-release.outputs.release_version }}"
          MSIX_FILE="Plot-${VERSION}.msix"
          ZIP_FILE="Plot-${VERSION}-portable.zip"

          aws s3 cp "$MSIX_FILE" "${BUCKET}/releases/${VERSION}/windows/${MSIX_FILE}" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$MSIX_FILE" "${BUCKET}/windows" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/vnd.ms-appx" \
            --content-disposition "attachment; filename=\"Plot.msix\""

          aws s3 cp "$ZIP_FILE" "${BUCKET}/releases/${VERSION}/windows/${ZIP_FILE}" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$ZIP_FILE" "${BUCKET}/windows-portable" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/zip" \
            --content-disposition "attachment; filename=\"Plot-portable.zip\""

      - name: Create and upload version manifest
        shell: bash
        run: |
          cd apps/plot/build/windows/x64/runner/Release

          MSIX_FILE="Plot-${{ needs.prepare-release.outputs.release_version }}.msix"
          ZIP_FILE="Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip"

          MSIX_SIZE=$(stat -c%s "$MSIX_FILE" 2>/dev/null || stat -f%z "$MSIX_FILE")
          MSIX_HASH=$(sha256sum "$MSIX_FILE" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$MSIX_FILE" | awk '{print $1}')

          ZIP_SIZE=$(stat -c%s "$ZIP_FILE" 2>/dev/null || stat -f%z "$ZIP_FILE")
          ZIP_HASH=$(sha256sum "$ZIP_FILE" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$ZIP_FILE" | awk '{print $1}')

          cat > latest-windows.json << EOF
          {
            "version": "${{ needs.prepare-release.outputs.release_version }}",
            "versionName": "${{ needs.prepare-release.outputs.version_name }}",
            "buildNumber": ${{ needs.prepare-release.outputs.build_number }},
            "platform": "windows",
            "msix": {
              "url": "https://download.plot.day/releases/${{ needs.prepare-release.outputs.release_version }}/windows/$MSIX_FILE",
              "size": $MSIX_SIZE,
              "sha256": "$MSIX_HASH"
            },
            "portable": {
              "url": "https://download.plot.day/releases/${{ needs.prepare-release.outputs.release_version }}/windows/$ZIP_FILE",
              "size": $ZIP_SIZE,
              "sha256": "$ZIP_HASH"
            },
            "releaseDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "minWindowsVersion": "10.0.17763.0"
          }
          EOF

          cat latest-windows.json

          export AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
          export AWS_DEFAULT_REGION=auto

          R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 cp latest-windows.json "s3://${R2_BUCKET_NAME}/latest-windows.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ needs.prepare-release.outputs.release_version }}
          path: |
            apps/plot/build/windows/x64/runner/Release/Plot-${{ needs.prepare-release.outputs.release_version }}.msix
            apps/plot/build/windows/x64/runner/Release/Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip
            apps/plot/build/windows/x64/runner/Release/latest-windows.json
          retention-days: 30

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/plot/build/windows/x64/runner/Release

          MSIX_FILE="Plot-${{ needs.prepare-release.outputs.release_version }}.msix"
          ZIP_FILE="Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip"
          TAG_NAME="windows@${{ needs.prepare-release.outputs.release_version }}"
          RELEASE_TITLE="Plot Windows ${{ needs.prepare-release.outputs.release_version }}"

          MSIX_SIZE=$(cat latest-windows.json | grep -A 3 '"msix"' | grep '"size"' | sed 's/.*: \([0-9]*\).*/\1/')
          MSIX_HASH=$(cat latest-windows.json | grep -A 3 '"msix"' | grep '"sha256"' | sed 's/.*: "\(.*\)".*/\1/')
          ZIP_SIZE=$(cat latest-windows.json | grep -A 3 '"portable"' | grep '"size"' | sed 's/.*: \([0-9]*\).*/\1/')
          ZIP_HASH=$(cat latest-windows.json | grep -A 3 '"portable"' | grep '"sha256"' | sed 's/.*: "\(.*\)".*/\1/')
          RELEASE_DATE=$(cat latest-windows.json | grep '"releaseDate"' | sed 's/.*: "\(.*\)".*/\1/')

          cat > release-notes.md << EOF
          ## Plot Windows ${{ needs.prepare-release.outputs.release_version }}

          **Version:** ${{ needs.prepare-release.outputs.version_name }}
          **Build Number:** ${{ needs.prepare-release.outputs.build_number }}
          **Platform:** Windows
          **Release Date:** ${RELEASE_DATE}

          ### Download

          #### MSIX Installer (Recommended)
          - **File**: [Plot-${{ needs.prepare-release.outputs.release_version }}.msix](https://download.plot.day/releases/${{ needs.prepare-release.outputs.release_version }}/windows/Plot-${{ needs.prepare-release.outputs.release_version }}.msix)
          - **Size**: ${MSIX_SIZE} bytes
          - **SHA256**: \`${MSIX_HASH}\`

          #### Portable ZIP
          - **File**: [Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip](https://download.plot.day/releases/${{ needs.prepare-release.outputs.release_version }}/windows/Plot-${{ needs.prepare-release.outputs.release_version }}-portable.zip)
          - **Size**: ${ZIP_SIZE} bytes
          - **SHA256**: \`${ZIP_HASH}\`

          ### Requirements

          - **Minimum Windows Version:** Windows 10 version 1809 (build 17763) or later

          ### Installation

          **MSIX Package**: Double-click the .msix file to install.

          **Portable ZIP**: Extract the ZIP file and run \`plot.exe\`.

          ### Auto-Update

          For auto-update systems, see the [manifest JSON](https://download.plot.day/latest-windows.json).
          EOF

          PRERELEASE_FLAG=""
          if [[ "${{ steps.branch-detect.outputs.is_prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG="--latest"
          fi

          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            "$MSIX_FILE" \
            "$ZIP_FILE"

      - name: Tag store submission
        shell: bash
        run: |
          git tag "windows/${{ needs.prepare-release.outputs.release_version }}"
          git push origin "windows/${{ needs.prepare-release.outputs.release_version }}"

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Windows Release Complete"
            echo ""
            echo "**Version:** ${{ needs.prepare-release.outputs.release_version }}"
            echo ""
            echo "### Stable URLs"
            echo "- MSIX: https://download.plot.day/windows"
            echo "- Portable ZIP: https://download.plot.day/windows-portable"
            echo "- Manifest: https://download.plot.day/latest-windows.json"
            echo ""
            echo "### Admin"
            echo "- [Microsoft Partner Center](https://partner.microsoft.com/en-us/dashboard/products/9PKTCSN8SNZF/)"
          } >> "$GITHUB_STEP_SUMMARY"
