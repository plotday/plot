name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Build Twister and tools
        run: |
          cd public
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Perl
        uses: shogo82148/actions-setup-perl@v1

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Fake Flutter app.env
        run: echo "FOO=bar" >> apps/plot/app.env

      - name: Generate Flutter code
        run: cd apps/plot && flutter pub run build_runner build

      - name: Install pg_format
        run: |
          curl -L -o pg_format.zip https://github.com/darold/pgFormatter/archive/refs/tags/v5.5.zip
          unzip pg_format.zip -d $HOME/pg_format
          mv $HOME/pg_format/pgFormatter*/* $HOME/pg_format/
          chmod +x $HOME/pg_format/pg_format
          echo "$HOME/pg_format" >> "$GITHUB_PATH"

      - name: Start DB
        run: cd libs/db && pnpm run start

      - name: Install Atlas
        uses: ariga/setup-atlas@v0

      - name: Apply migrations and run plpgsql_check
        run: cd libs/db && pnpm run apply-migrations

      - name: Lint
        run: pnpm run lint

  # Enforce expand/contract migration safety (see
  # docs/superpowers/specs/2026-06-02-zero-downtime-deploy-design.md and
  # libs/db/AGENTS.md "Production Migration Safety"). Migrations in migrations/
  # apply BEFORE workers deploy, so a destructive change there would break the
  # still-running OLD workers during the deploy window. Atlas's `migrate lint`
  # fails the build on destructive / backward-incompatible DDL in migrations/.
  # Destructive cleanup belongs in migrations-contract/ instead (generated with
  # `pnpm gen-contract-migration`), where it drains only after a soak — so an
  # `atlas:nolint` directive that would suppress the check in migrations/ is
  # itself rejected.
  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Only migrations/ (expand) files — migrations-contract/ is the
          # sanctioned home for destructive DDL and is excluded by the pattern.
          git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -E '^libs/db/migrations/.*\.sql$' > /tmp/changed_migrations.txt || true
          if [ -s /tmp/changed_migrations.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new/changed expand migrations vs origin/${BASE_REF}; skipping destructive-change lint."
          fi

      - name: Reject destructive escape hatches in migrations/
        if: steps.changed.outputs.changed == 'true'
        run: |
          # An `atlas:nolint` directive would suppress the Atlas destructive
          # check below. Destructive changes belong in migrations-contract/, so
          # reject the escape hatch here and point to the contract generator.
          if grep -lE 'atlas:nolint' $(cat /tmp/changed_migrations.txt) 2>/dev/null; then
            echo "::error::A migrations/ file uses 'atlas:nolint'. Destructive changes belong in migrations-contract/ — generate them with 'pnpm gen-contract-migration -- <name>'."
            exit 1
          fi

      - name: Install Atlas
        if: steps.changed.outputs.changed == 'true'
        uses: ariga/setup-atlas@v0

      - name: Lint new migrations for unsafe (non-backward-compatible) changes
        if: steps.changed.outputs.changed == 'true'
        working-directory: libs/db
        env:
          BASE_REF: ${{ github.base_ref }}
        # Run from libs/db (working-directory above) so Atlas's default
        # git-dir is the repo working tree and the migrations/ path resolves —
        # passing --git-dir ../.. makes git run from the repo root while paths
        # stay relative to libs/db, which fails with "git diff: exit status 128".
        run: |
          atlas migrate lint \
            --env local \
            --git-base "origin/${BASE_REF}"
