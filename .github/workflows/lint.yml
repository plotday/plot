name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # - name: Load secrets
    #   uses: 1password/load-secrets-action@v2
    #   with:
    #     export-env: true
    #   env:
    #     OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    #     SUPABASE_ACCESS_TOKEN: "op://Production/Supabase/admin/access token"
    #     SUPABASE_PROJECT_ID: "op://Production/Supabase/project ID"

    - uses: pnpm/action-setup@v4
      name: Install pnpm
      with:
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Install Perl
      uses: shogo82148/actions-setup-perl@v1

    - name: Install pg_format
      run: |
        curl -L -o pg_format.zip https://github.com/darold/pgFormatter/archive/refs/tags/v5.5.zip
        unzip pg_format.zip -d $HOME/pg_format
        mv $HOME/pg_format/pgFormatter*/* $HOME/pg_format/
        chmod +x $HOME/pg_format/pg_format
        echo "$HOME/pg_format" >> "$GITHUB_PATH"

    # - uses: 0xbigboss/supabase-branch-gh-action@v1
    #   id: supabase-branch
    #   env:
    #     GITHUB_REF: 
    #   with:
    #     supabase-access-token: ${{ env.SUPABASE_ACCESS_TOKEN }}
    #     supabase-project-id: ${{ env.SUPABASE_PROJECT_ID }}
    #     wait-for-migrations: true
    #     timeout: 120
    #
    # - name: Get result
    #   run: | 
    #     echo "ref=${{steps.supabase-branch.outputs.ref}}"
    #     echo "api_url=${{steps.supabase-branch.outputs.api_url}}"
    #     echo "graphql_url=${{steps.supabase-branch.outputs.graphql_url}}"
    #     echo "db_host=${{steps.supabase-branch.outputs.db_host}}"
    #     echo "db_port=${{steps.supabase-branch.outputs.db_port}}"
    #     echo "db_user=${{steps.supabase-branch.outputs.db_user}}"
    #     echo "db_password=${{steps.supabase-branch.outputs.db_password}}"
    #     echo "jwt_secret=${{steps.supabase-branch.outputs.jwt_secret}}"
    #     echo "anon_key=${{steps.supabase-branch.outputs.anon_key}}"
    #     echo "service_role_key=${{steps.supabase-branch.outputs.service_role_key}}"

    - uses: supabase/setup-cli@v1
      with:
        version: latest
    - run: supabase init
    - run: supabase db start

    - name: Lint
      run: pnpm run lint
