name: Patch (Shorebird OTA)

on:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Patch iOS'
        type: boolean
        default: true
      android:
        description: 'Patch Android'
        type: boolean
        default: true
      macos:
        description: 'Patch macOS'
        type: boolean
        default: true
      windows:
        description: 'Patch Windows'
        type: boolean
        default: true

concurrency:
  group: native-patch
  cancel-in-progress: false

jobs:
  refresh-secrets:
    uses: ./.github/workflows/refresh-secrets.yml
    secrets: inherit

  patch-ios:
    needs: refresh-secrets
    if: inputs.ios
    runs-on: macos-26
    env:
      APPLE_DIST_CERT_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
      APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get release version
        id: version
        run: |
          cd apps/plot
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Decode signing files
        id: profiles
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_SHARE_EXT_MOBILEPROVISION_BASE64: ${{ secrets.IOS_SHARE_EXT_MOBILEPROVISION_BASE64 }}
          FIREBASE_IOS_GOOGLE_SERVICE_INFO: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # iOS App Store provisioning profile (day.plot.app)
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/ios.mobileprovision"
          chmod 0600 "$RUNNER_TEMP/ios.mobileprovision"

          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios.mobileprovision")")
          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios.mobileprovision")")
          cp "$RUNNER_TEMP/ios.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.mobileprovision"
          echo "Installed app profile: $APP_PROFILE_NAME ($APP_PROFILE_UUID)"
          echo "app_profile_name=$APP_PROFILE_NAME" >> "$GITHUB_OUTPUT"

          # iOS App Store provisioning profile for ShareExtension (day.plot.app.ShareExtension)
          echo "$IOS_SHARE_EXT_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-share-extension.mobileprovision"
          chmod 0600 "$RUNNER_TEMP/ios-share-extension.mobileprovision"

          EXT_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios-share-extension.mobileprovision")")
          EXT_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/ios-share-extension.mobileprovision")")
          cp "$RUNNER_TEMP/ios-share-extension.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${EXT_PROFILE_UUID}.mobileprovision"
          echo "Installed extension profile: $EXT_PROFILE_NAME ($EXT_PROFILE_UUID)"
          echo "ext_profile_name=$EXT_PROFILE_NAME" >> "$GITHUB_OUTPUT"

          # Firebase config for iOS
          echo "$FIREBASE_IOS_GOOGLE_SERVICE_INFO" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/ios/Runner/GoogleService-Info.plist"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/ios/Runner/GoogleService-Info.plist"

      - name: Import code signing certificates
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Apple Distribution certificate
          DIST_CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$APPLE_DIST_CERT_BASE64" | base64 --decode > "$DIST_CERT_PATH"
          security import "$DIST_CERT_PATH" -P "$APPLE_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$DIST_CERT_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Configure manual signing for CI
        env:
          APP_PROFILE_NAME: ${{ steps.profiles.outputs.app_profile_name }}
          EXT_PROFILE_NAME: ${{ steps.profiles.outputs.ext_profile_name }}
        run: |
          cd apps/plot/ios

          PBXPROJ="Runner.xcodeproj/project.pbxproj"

          # Switch from automatic to manual signing for all targets
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"

          # Set distribution signing identity for all targets
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' "$PBXPROJ"

          # Add provisioning profile specifier for Runner target
          python3 -c "
          import re, sys
          content = open('$PBXPROJ').read()
          # Runner target: day.plot.app but not .ShareExtension or .RunnerTests
          content = re.sub(
              r'(PRODUCT_BUNDLE_IDENTIFIER = day\.plot\.app;(?!\.))',
              r'\1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$APP_PROFILE_NAME\";',
              content
          )
          # ShareExtension target
          content = content.replace(
              'PRODUCT_BUNDLE_IDENTIFIER = day.plot.app.ShareExtension;',
              'PRODUCT_BUNDLE_IDENTIFIER = day.plot.app.ShareExtension;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$EXT_PROFILE_NAME\";'
          )
          open('$PBXPROJ', 'w').write(content)
          "

          # Create ExportOptions.plist for app-store distribution
          /usr/libexec/PlistBuddy -c "Clear dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string 789MAH2W6P" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:day.plot.app string $APP_PROFILE_NAME" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:day.plot.app.ShareExtension string $EXT_PROFILE_NAME" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" ExportOptions.plist

          echo "Manual signing configured. ExportOptions.plist created."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Write .env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: |
          printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/.env.production
          cp apps/plot/.env.production apps/plot/.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Patch iOS
        run: |
          cd apps/plot
          shorebird patch ios \
            --release-version="${{ steps.version.outputs.version }}" \
            --allow-asset-diffs \
            -- --export-options-plist=ios/ExportOptions.plist

      - name: Tag successful patch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag -f "patched/ios/$VERSION"
          git push origin "patched/ios/$VERSION" --force

      - name: Build summary
        run: |
          {
            echo "## iOS Patch Complete"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.version }}"
            echo "Shorebird OTA patch delivered."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  patch-android:
    needs: refresh-secrets
    if: inputs.android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get release version
        id: version
        run: |
          cd apps/plot
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Decode signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_ANDROID_GOOGLE_SERVICES: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES }}
        run: |
          # Android signing keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/android/plot-release.jks"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/android/plot-release.jks"

          # Firebase config for Android
          echo "$FIREBASE_ANDROID_GOOGLE_SERVICES" | base64 --decode > "$GITHUB_WORKSPACE/apps/plot/android/app/google-services.json"
          chmod 0600 "$GITHUB_WORKSPACE/apps/plot/android/app/google-services.json"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Write .env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Create key.properties
        run: |
          cat > apps/plot/android/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=plot-release
          storeFile=../plot-release.jks
          EOF

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Patch Android
        run: |
          cd apps/plot
          shorebird patch android \
            --release-version="${{ steps.version.outputs.version }}" \
            --allow-asset-diffs

      - name: Tag successful patch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag -f "patched/android/$VERSION"
          git push origin "patched/android/$VERSION" --force

      - name: Build summary
        run: |
          {
            echo "## Android Patch Complete"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.version }}"
            echo "Shorebird OTA patch delivered."
          } >> "$GITHUB_STEP_SUMMARY"

  patch-macos:
    needs: refresh-secrets
    if: inputs.macos
    runs-on: macos-26
    env:
      APPLE_DIST_CERT_BASE64: ${{ secrets.APPLE_DIST_CERT_BASE64 }}
      APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get release version
        id: version
        run: |
          cd apps/plot
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Decode signing files
        env:
          MACOS_PROVISIONPROFILE_BASE64: ${{ secrets.MACOS_PROVISIONPROFILE_BASE64 }}
        run: |
          # Distribution provisioning profile
          echo "$MACOS_PROVISIONPROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/macos.provisionprofile"
          chmod 0600 "$RUNNER_TEMP/macos.provisionprofile"

      - name: Import code signing certificates
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Apple Distribution certificate
          DIST_CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$APPLE_DIST_CERT_BASE64" | base64 --decode > "$DIST_CERT_PATH"
          security import "$DIST_CERT_PATH" -P "$APPLE_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$DIST_CERT_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Available signing identities:"
          security find-identity -v -p codesigning

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: "stable"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Write .env file
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: |
          printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/.env.production
          cp apps/plot/.env.production apps/plot/.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/plot/.dart_tool
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            apps/plot/.dart_tool/build
            apps/plot/**/*.g.dart
            apps/plot/**/*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Configure manual signing for CI
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Install macOS provisioning profile
          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/macos.provisionprofile")")
          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/macos.provisionprofile")")
          cp "$RUNNER_TEMP/macos.provisionprofile" "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.provisionprofile"
          echo "Installed macOS profile: $APP_PROFILE_NAME ($APP_PROFILE_UUID)"

          PBXPROJ="apps/plot/macos/Runner.xcodeproj/project.pbxproj"

          # Switch from automatic to manual signing for all targets
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"

          # Set distribution signing identity (CI only has Apple Distribution, not Mac Development)
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBXPROJ"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development"/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Apple Distribution"/g' "$PBXPROJ"

          # Set provisioning profile specifier for the Runner target
          python3 -c "
          import re
          content = open('$PBXPROJ').read()
          profile_name = '$APP_PROFILE_NAME'
          content = re.sub(
              r'(PRODUCT_BUNDLE_IDENTIFIER = day\.plot\.app;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";)',
              f'PRODUCT_BUNDLE_IDENTIFIER = day.plot.app;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"{profile_name}\";',
              content
          )
          open('$PBXPROJ', 'w').write(content)
          "

          echo "Manual signing configured for macOS."

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Patch macOS
        run: |
          cd apps/plot
          shorebird patch macos \
            --release-version="${{ steps.version.outputs.version }}" \
            --allow-asset-diffs

      - name: Tag successful patch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag -f "patched/macos/$VERSION"
          git push origin "patched/macos/$VERSION" --force

      - name: Build summary
        run: |
          {
            echo "## macOS Patch Complete"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.version }}"
            echo "Shorebird OTA patch delivered."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  patch-windows:
    needs: refresh-secrets
    if: inputs.windows
    runs-on: windows-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            font_awesome_flutter

      - name: Configure git for private dependencies
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get release version
        id: version
        shell: bash
        run: |
          cd apps/plot
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: "stable"
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Write .env file
        shell: bash
        env:
          FLUTTER_ENV_PROD: ${{ secrets.FLUTTER_ENV_PROD }}
        run: printf '%s' "$FLUTTER_ENV_PROD" > apps/plot/.env

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-flutter-deps-${{ hashFiles('apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-deps-

      - name: Set up Rust (for super_clipboard native extensions)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd apps/plot
          flutter pub get

      - name: Install derry
        run: dart pub global activate derry

      - name: Cache build_runner outputs
        uses: actions/cache@v4
        with:
          path: |
            apps\plot\.dart_tool\build
            apps\plot\**\*.g.dart
            apps\plot\**\*.freezed.dart
          key: ${{ runner.os }}-build-runner-${{ hashFiles('apps/plot/**/*.dart', 'apps/plot/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-runner-

      - name: Run build_runner
        run: |
          cd apps/plot
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Install Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Patch Windows
        shell: bash
        run: |
          cd apps/plot
          shorebird patch windows \
            --release-version="${{ steps.version.outputs.version }}" \
            --allow-asset-diffs

      - name: Tag successful patch
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag -f "patched/windows/$VERSION"
          git push origin "patched/windows/$VERSION" --force

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Windows Patch Complete"
            echo ""
            echo "**Version:** ${{ steps.version.outputs.version }}"
            echo "Shorebird OTA patch delivered."
          } >> "$GITHUB_STEP_SUMMARY"
