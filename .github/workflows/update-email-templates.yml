name: Update Email Templates

on:
  push:
    branches: [main]
    paths:
      - "libs/email/**"
      - ".github/workflows/update-email-templates.yml"

concurrency:
  group: update-email-templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-templates:
    runs-on: ubuntu-latest
    name: Update Supabase Email Templates
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=@plotday/email

      - name: Build email templates
        run: pnpm --filter=@plotday/email build

      - name: Load secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SUPABASE_ACCESS_TOKEN: op://Production/Supabase/Admin/access token
          SUPABASE_PROJECT_ID: op://Production/Supabase/project id

      - name: Update email confirmation template
        run: |
          CONTENT=$(cat libs/email/dist/email-confirmation.html | jq -Rs .)
          curl -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"MAILER_SUBJECTS_CONFIRMATION\": \"Confirm your email address for Plot\",
              \"MAILER_TEMPLATES_CONFIRMATION_CONTENT\": $CONTENT
            }"

      - name: Update password reset template
        run: |
          CONTENT=$(cat libs/email/dist/password-reset.html | jq -Rs .)
          curl -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"MAILER_SUBJECTS_RECOVERY\": \"Reset your Plot password\",
              \"MAILER_TEMPLATES_RECOVERY_CONTENT\": $CONTENT
            }"

      - name: Update email change template
        run: |
          CONTENT=$(cat libs/email/dist/email-change.html | jq -Rs .)
          curl -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"MAILER_SUBJECTS_EMAIL_CHANGE\": \"Confirm your new email address\",
              \"MAILER_TEMPLATES_EMAIL_CHANGE_CONTENT\": $CONTENT
            }"
