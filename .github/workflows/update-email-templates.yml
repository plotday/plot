name: Update Email Templates

on:
  push:
    branches: [main]
    paths:
      - "libs/email/**"
      - ".github/workflows/update-email-templates.yml"

concurrency:
  group: update-email-templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-templates:
    runs-on: ubuntu-latest
    name: Update Supabase Email Templates
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=@plotday/email

      - name: Build email templates
        run: pnpm --filter=@plotday/email build

      - name: Load secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SUPABASE_PROJECT_ID: op://Production/Supabase/project id
          SUPABASE_ACCESS_TOKEN: op://Production/Supabase/Admin/access token

      - name: Update email confirmation template
        run: |
          CONTENT=$(cat libs/db/supabase/email-templates/email-confirmation.html | jq -Rs .)
          curl -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"mailer_subjects_confirmation\": \"Activate your Plot account\",
              \"mailer_templates_confirmation_content\": $CONTENT
            }"

      - name: Update magic link template
        run: |
          CONTENT=$(cat libs/db/supabase/email-templates/email-confirmation.html | jq -Rs .)
          curl -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"mailer_subjects_magic_link\": \"Activate your Plot account\",
              \"mailer_templates_magic_link_content\": $CONTENT
            }"

      - name: Update password reset template
        run: |
          CONTENT=$(cat libs/db/supabase/email-templates/password-reset.html | jq -Rs .)
          curl -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"mailer_subjects_recovery\": \"Reset your Plot password\",
              \"mailer_templates_recovery_content\": $CONTENT
            }"

      - name: Update email change template
        run: |
          CONTENT=$(cat libs/db/supabase/email-templates/email-change.html | jq -Rs .)
          curl -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"mailer_subjects_email_change\": \"Confirm your new email address\",
              \"mailer_templates_email_change_content\": $CONTENT
            }"
