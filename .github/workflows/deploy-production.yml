name: Deploy Production

# One-click production deploy.
#
# This is the single entry point that replaces the old "auto-deploy on push to
# main" behavior. It calls the individual deploy workflows (workers, web app,
# site, twists) as reusable workflows so one run deploys everything, and gates
# the whole thing behind the `production` GitHub Environment.
#
# To require manual approval before anything deploys, add a required reviewer to
# the `production` environment (repo Settings -> Environments -> production).
# The approval pauses the `gate` job below; approving it releases all the deploy
# jobs at once. Without a reviewer configured, `gate` passes through and this is
# a pure one-click deploy.
#
# Note: database migrations ride along inside deploy-workers.yml (its `migrate`
# job is a dependency of the worker deploy), so gating that workflow here also
# gates migrations.

on:
  workflow_dispatch:
    inputs:
      infra:
        description: "Apply infrastructure (Terraform: Cloud SQL, Hyperdrive, DNS)"
        type: boolean
        default: true
      workers:
        description: "Deploy workers (api/beat/mailer) + run migrations"
        type: boolean
        default: true
      app:
        description: "Deploy web app (Flutter -> Cloudflare Pages)"
        type: boolean
        default: true
      site:
        description: "Deploy marketing site"
        type: boolean
        default: true
      twists:
        description: "Deploy twists & connectors"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Approval gate. The `production` environment's protection rule (if any)
  # pauses this job until a reviewer approves; everything else needs it.
  gate:
    name: Approve production deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Approved production deploy of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"

  # Infrastructure applies FIRST (after approval, before migrations/workers) so the
  # DB instance, Hyperdrive pool, and DNS reflect the change before code ships.
  # If it fails, every downstream deploy job is blocked.
  infra:
    name: Apply infrastructure
    needs: gate
    if: ${{ inputs.infra }}
    uses: ./.github/workflows/deploy-infra.yml
    secrets: inherit

  workers:
    name: Deploy workers
    needs: [gate, infra]
    if: >-
      ${{ always()
        && needs.gate.result == 'success'
        && inputs.workers
        && needs.infra.result != 'failure'
        && needs.infra.result != 'cancelled' }}
    uses: ./.github/workflows/deploy-workers.yml
    secrets: inherit
    with:
      api: true
      beat: true
      mailer: true

  # The web app talks to the API, so it must not go live before the workers
  # (which include migrations) finish — we design the API to be backward
  # compatible with old clients, but not the app to tolerate an older API.
  # `always()` lets it still deploy when the workers checkbox was unticked
  # (workers skipped); it only blocks if workers failed/cancelled. Mirrors the
  # `twists` job below.
  app:
    name: Deploy web app
    needs: [gate, infra, workers]
    if: >-
      ${{ always()
        && needs.gate.result == 'success'
        && inputs.app
        && needs.infra.result != 'failure'
        && needs.infra.result != 'cancelled'
        && needs.workers.result != 'failure'
        && needs.workers.result != 'cancelled' }}
    uses: ./.github/workflows/deploy-app.yml
    secrets: inherit

  site:
    name: Deploy site
    needs: [gate, infra]
    if: >-
      ${{ always()
        && needs.gate.result == 'success'
        && inputs.site
        && needs.infra.result != 'failure'
        && needs.infra.result != 'cancelled' }}
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit

  # Twists/connectors run against the api at runtime, so they deploy after the
  # workers job. `always()` lets this run even when `workers` was skipped
  # (i.e. the workers checkbox was unticked); it only blocks if workers failed.
  twists:
    name: Deploy twists & connectors
    needs: [gate, infra, workers]
    if: >-
      ${{ always()
        && needs.gate.result == 'success'
        && inputs.twists
        && needs.infra.result != 'failure'
        && needs.infra.result != 'cancelled'
        && needs.workers.result != 'failure'
        && needs.workers.result != 'cancelled' }}
    uses: ./.github/workflows/deploy-twists.yml
    secrets: inherit
    with:
      twists: all
      connectors: all

  # Record exactly what shipped as an immutable tag. This is the anchor for
  # cherry-picking/patching a release without shipping all of main:
  #   git checkout -b hotfix/x deploy/<timestamp>
  tag:
    name: Tag deployed commit
    needs: [gate, infra, workers, app, site, twists]
    if: >-
      ${{ always()
        && needs.gate.result == 'success'
        && !contains(needs.*.result, 'failure')
        && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The deploy marker tag points at the approved commit, whose workflow
      # files can differ from `main` when Dependabot/CI bumps merge during the
      # approval window. Pushing such a tag counts as updating
      # `.github/workflows/**`, which the Actions GITHUB_TOKEN is never allowed
      # to do. Push with the plot-app-builder app token instead (it has the
      # Workflows: write permission) so the tag push always succeeds.
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Belt-and-suspenders: the deploy marker tag is bookkeeping only, so a
      # push hiccup must never fail an otherwise-successful production deploy.
      - name: Create and push deploy tag
        continue-on-error: true
        run: |
          TAG="deploy/$(date -u +%Y%m%d.%H%M%S)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production deploy of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push origin "$TAG"

      - name: Deployment summary
        run: |
          {
            echo "## ✅ Production deploy complete"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo "**Tag:** \`${TAG}\`"
            echo ""
            echo "| Target | Result |"
            echo "| --- | --- |"
            echo "| Infra | ${{ needs.infra.result }} |"
            echo "| Workers | ${{ needs.workers.result }} |"
            echo "| Web app | ${{ needs.app.result }} |"
            echo "| Site | ${{ needs.site.result }} |"
            echo "| Twists | ${{ needs.twists.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
