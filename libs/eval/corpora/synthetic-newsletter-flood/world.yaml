name: synthetic-newsletter-flood
description: |
  Handcrafted facet-gate stress corpus. Persona: Priya Raghavan, a freelance
  product designer running a one-person studio (meridianloft.com) whose gmail
  inbox is flooded with newsletters, receipts, and promos alongside real
  client work.

  Signals exercised (all fictional people/orgs; labels true by construction):
  - intrinsic facet gate: "Client Work" excludes automation=automated, so
    automated digests that semantically score into it must be dropped to the
    correct fallback focus (gate-drop cases).
  - trusted-sender bypass: Lena Okafor participates in user_moved threads
    filed in Client Work, so her automated digest bypasses the exclude.
  - trustedSendersOnly: "Finances" admits only trusted-for-focus authors
    (Marcus Finch, via user_moved filings) or org-domain authors
    (avery@meridianloft.com matches Priya's linked identity domain); bank
    and newsletter senders are rejected even with null facets.
  - format include filter: "Design Reading" includes only format=reading,
    gating a human chat message that semantically belongs there.
  - fail-open: candidates with facets=null never violate intrinsic filters.
