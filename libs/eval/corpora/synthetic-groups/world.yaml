name: synthetic-groups
description: |
  Handcrafted group-heavy ambiguity corpus. Persona: Tomás Rivera, lead
  organizer of the Riverton Neighbors association. Most threads arrive via
  one Slack connection, the same handful of people show up everywhere, and
  topics (planning, signups, schedules, workshops) repeat across focuses —
  group membership (thread.groups) is frequently the only clean signal.

  Signals exercised (all fictional people/orgs; labels true by construction):
  - group-overlap vs topic noise: near-identical wording filed in different
    focuses where the Jaccard over thread.groups discriminates.
  - tie-breaker pressure: cases where two focuses both hold close neighbors
    (same groups, shared contacts, similar wording) so margins are small and
    rank-of-gold reporting matters.
  - topic short-circuit: channel:301/304 are filed consistently → the
    deterministic topic stage fires; channel:302 is split across Community
    Events (2) and Volunteer Crew (1) → the mode wins deterministically and
    one case is deliberately labeled against the mode (topic-ambiguity
    material for the LLM override stage).
