name: synthetic-two-hats
description: |
  Handcrafted multi-account routing corpus. Persona: Ana Vidal, a staff
  engineer at Brightforge (ana@brightforge.io) who also runs her household
  from a personal gmail (ana.vidal.dev@gmail.com). Work and personal
  hierarchies contain deliberately similar-sounding threads (budget reviews,
  renewals, lunches) so plain text similarity cannot separate them.

  Signals exercised (all fictional people/orgs; labels true by construction):
  - origin-exact: ambiguous-title cases whose only reliable discriminator is
    the originating connection (work-gmail vs personal-gmail) — neighbors
    from the same connection get the exact origin bonus + author match.
  - origin-org: cases arriving via work-calendar, a SECOND work connection
    sharing the brightforge.io org domain. No trainings exist on
    work-calendar, so matching work neighbors can only earn the org-key
    branch of the origin bonus (connection_org_key → domain:brightforge.io).
  - org-key NULL: personal-gmail resolves to no org key (gmail.com is
    freemail, no team), so personal trainings never org-match work cases.
  - account-hierarchy affinity: ana-work / ana-personal are linked contacts;
    their raw presence in thread.contacts ties cases to the work or
    personal hierarchy distributions.
  - no-connection controls: connection=null candidates get zero origin
    everywhere and must route on contacts/sem alone.
schema_version: 2
