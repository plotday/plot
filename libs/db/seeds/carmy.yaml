  # Day 0 (Base date): Decision and execution
  - type: note
    kind: document
    priority_ref: menu
    title: "CHARRED CABBAGE DECISION - Version 1, locked"
    created: "0d"
    tags:
      pinned: [user]
      decision: [user]
      goal: [user]
    notes:
      - created: "0d 18:00"
        content: |
          ## Charred Spring Cabbage
          ### Version 1.0 - LOCKED FOR MENU LAUNCH

          **Components:**
          - Cabbage: Spring cabbage, quartered, charred on plancha (high heat, good char without burning core)
          - Miso butter: White miso, brown butter, touch of mirin (2:1:0.5 ratio)
          - Crispy rice: Day-old sushi rice, fried until crunchy, seasoned with salt
          - Garnish: Furikake (store-bought Mishima is fine), sesame seeds, pea shoots
          - Finish: Lemon zest (just before plating)

          **Plating:**
          - Cabbage center
          - Miso butter pooled and brushed
          - Crispy rice scattered (texture contrast)
          - Furikake light dusting
          - Pea shoots on top (height, freshness)
          - Lemon zest at table (aromatics)

          **Prep notes:**
          - Cabbage can be charred during prep, reheated on plancha before service
          - Miso butter holds well (make batch AM)
          - Crispy rice must be day-of (loses texture)
          - Furikake and garnish at pass

          **Recipe:**
          [Link to full recipe doc](https://docs.google.com/document/d/charred-cabbage-v1)

          ---

          ## Decision Log

          **Why this dish:**
          - Bold without being weird
          - Vegetarian that doesn't feel like "the vegetarian option"
          - Technique showcase (char, miso butter, texture play)
          - Spring menu appropriate
          - Actually fucking delicious

          **Why Version 1:**
          Sydney was right. It's good. It's good enough to launch. We can make it better after we see how it performs on the floor, how guests react, how it holds during a Friday night push.

          **Version one. Good enough. Done.**

          That's the mantra. That's what I'm learning to say.
      - author_ref: user
        created: "0d 18:32"
        content: |
          Syd - cabbage is locked. You were right.
      - author_ref: sydney
        created: "0d 18:33"
        content: |
          Say that again, I want to remember it.

          Does this mean we're actually launching the menu on time?
      - author_ref: user
        created: "0d 18:34"
        content: |
          Don't push it.

          But yeah. We're launching on time.
      - created: "0d 18:35"
        content: |
