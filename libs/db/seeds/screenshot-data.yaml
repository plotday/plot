  # Mobile App - Sprint 6 (Current)
  # ============================================================================

  - title: Implement new profile page UI
    type: action
    priority_ref: sprint-6
    on: "+0d / +3d"
    assignee_ref: alice
    note: |
      Implement the new profile page design from Figma.

      **Requirements:**
      - Use new design system components
      - Support dark mode
      - Add avatar upload
      - Profile editing inline
    links:
      - url: https://figma.com/profile-page-v2
        title: Profile Page Design
        description: Figma mockups for new profile page
    tags:
      todo: [user]
      urgent: [user]
    children:
      - title: "Which component library should we use for the avatar picker?"
        type: note
        author_ref: alice
        tags:
          question: [alice]

      - title: "Let's use react-avatar-editor, it's well maintained"
        type: note
        author_ref: bob
        tags:
          yes: [alice, user]

  - title: Add profile photo upload
    type: action
    priority_ref: sprint-6
    on: "+1d / +4d"
    assignee_ref: alice
    note: "Allow users to upload and crop profile photos"
    tags:
      todo: [user]
      blocked: [alice]

  - title: Refactor authentication flow
    type: action
    priority_ref: sprint-6
    on: "+0d / +5d"
    assignee_ref: bob
    note: |
      Clean up the authentication code and add proper error handling.

      - [x] Add retry logic
      - [x] Improve error messages
      - [ ] Add loading states
      - [ ] Add tests
