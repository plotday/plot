# Plot Seed Data - Screenshot Example
#
# This example demonstrates realistic project data for app screenshots.
# Scenario: A software development team working on mobile app and API projects.
#
# Priority Colors: Use integers 0-7 (corresponding to theme colors), or omit to
# inherit from parent priority. Most common to set colors only on children of
# root priority unless meant to stand out.

config:
  baseDate: "2025-12-23"
  userId: "95e815d2-b88d-4126-9608-f980057257f2"

contacts:
