  # API Migration
  # ============================================================================

  - title: API v2 Architecture Planning
    type: note
    priority_ref: planning
    note: |
      ## Goals
      - Improve performance
      - Better error handling
      - GraphQL support
      - Real-time subscriptions

      ## Timeline
      - Planning: 2 weeks
      - Implementation: 8 weeks
      - Migration: 4 weeks
    tags:
      goal: [user]
      pinned: [user]
    children:
