    type: event
    priority_ref: team
    at: "+0d 09:00 / +0d 09:30"
    recurrence_rule: "FREQ=DAILY;BYDAY=MO,TU,WE,TH,FR"
    note: "Quick sync on progress and blockers"
    tags:
      pinned: [user]
    children:
      - title: "Yesterday: Completed login flow redesign"
        type: note
        author_ref: alice
        note: "New design is looking great! Ready for review."
        tags:
          yes: [user, bob]

      - title: "Today: Working on profile page"
        type: note
        author_ref: alice

      - title: "Blocked on API endpoint"
        type: note
        author_ref: bob
        note: "Need the new user profile endpoint before I can proceed with frontend work"
        tags:
          blocked: [bob]
          urgent: [user]

  - title: Sprint Planning - Sprint 6
    type: event
    priority_ref: sprint-6
    at: "-2d 14:00 / -2d 16:00"
    note: |
      ## Sprint Goal
      Complete user profile redesign and start onboarding flow

      ## Capacity
      - Alice: 30 points
      - Bob: 25 points
      - Carol: 28 points
    tags:
      done: [user]
    links:
      - url: https://miro.com/sprint-6-board
        title: Sprint Planning Board
        description: Sprint 6 planning board on Miro

  - title: Team Retrospective
    type: event
    priority_ref: team
    at: "+4d 15:00 / +4d 16:00"
    note: "Looking back at Sprint 5"
    tags:
      todo: [user]

