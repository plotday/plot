    children:
      - ref: mobile-app
        title: Mobile App Redesign
        settings:
          color: "#10B981"
        children:
          - ref: sprint-5
            title: Sprint 5
            settings:
              pomodoro_duration: 25

          - ref: sprint-6
            title: Sprint 6 (Current)
            settings:
              pomodoro_duration: 25

      - ref: api-migration
        title: API v2 Migration
        settings:
          color: "#F59E0B"
        children:
