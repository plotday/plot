      - created: "-2d 09:00"
        content: |
          **From: Performance Analytics Team**
          **Subject: Post-Match Analysis - AFC Richmond vs Bournemouth**

          **Result:** Richmond 1 - 2 Bournemouth (Home)

          **Key Stats:**
          - Possession: 58% Richmond
          - Shots: 14 Richmond, 8 Bournemouth
          - Shots on target: 4 Richmond, 5 Bournemouth
          - Expected goals (xG): 1.8 Richmond, 1.2 Bournemouth

          **Analysis:**
          Dominated possession and chances but lacked clinical finishing. Bournemouth punished mistakes. This is the fourth match this pattern has repeated.

          **Concerning trend:** Last 6 matches: 2 wins, 1 draw, 3 losses. Slipping toward mid-table.

          Not collapsing. Just... not winning when we should.
        mentions:
          - analytics

