  - type: note
    kind: document
    priority_ref: personal_dev
    title: "Reflection - what Ted built here"
    created: "-2d"
    notes:
      - created: "-2d 22:00"
        content: |
          Ted left almost two years ago. Sometimes it feels like yesterday. Sometimes it feels like a lifetime.

          What he built here wasn't about tactics or results. It was about belief.

          Belief that people can grow. That second chances matter. That community is the point.

          The men's team is struggling right now. That's football. It happens.

          But the culture? The belief? That's holding.

          Roy leads with honesty. Nate's finding his confidence again. The supporters stay loyal. The community stays engaged.

          A women's team isn't about fixing the men's team slump.

          It's about showing that Richmond's values aren't situational. They're foundational.

          When things are hard, you don't abandon who you are. You lean into it.

          That's what Ted would say.

          That's what I'm trying to do.

          Build the future without losing the present.

          Make room for what won't arrive on its own.

          Believe.

