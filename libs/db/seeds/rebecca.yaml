    title: "Finalize women's team financial model"
    created: "-2d"
    schedule:
      on: "+0d"
      todo: true
    tags:
      todo: [user]
    links:
      - source_ref: sheets
        type: spreadsheet
        title: "Women's Team Benchmarking - Championship Clubs 2022-2024"
        source_url: "https://docs.google.com/spreadsheets/d/1a2b3c4d5e/edit"
    notes:
      - created: "-2d 10:00"
        content: |
          Need to tighten the numbers before board presentation:
          - 5-year projection (not just Year 1)
          - Sensitivity analysis (best/worst case scenarios)
          - Revenue assumptions (conservative and optimistic)
          - Break-even timeline range
          - Facility cost details

          Make it bulletproof. Make it clear this is strategic, sustainable, and right.
      - created: "+0d 08:35"
        content: |
          @Higgins — can you pull comparable revenue data from other Championship clubs that launched women's teams in the last 3 years? Need actual numbers, not projections.

          Specifically interested in:
          - Year 1 vs Year 3 revenue comparison
          - Attendance trajectories
          - Sponsorship uplift (if any)

          Want to benchmark our model against reality before the board sees it.
        mentions:
          - higgins
      - author_ref: higgins
        created: "+0d 09:00"
        content: |
          Rebecca — here you are! I've compiled data from three Championship clubs that launched women's teams between 2022-2024.

          **Summary:**
          - **Club A** (launched 2022): Year 1 revenue £620K, Year 3 revenue £1.4M. Broke even mid-Year 2.
          - **Club B** (launched 2023): Year 1 revenue £480K, still growing. Attendance up 340% from launch.
          - **Club C** (launched 2024): Early but promising. Sponsorship deals exceeded projections by 25%.

          **Key insight:** Clubs that integrated the women's team into their main brand (shared badge, shared comms) consistently outperformed those that treated it as a separate entity.

          Full spreadsheet attached with detailed breakdowns.
        mentions:
          - higgins
      - created: "+0d 09:10"
        content: |
          This is exactly what I needed. The numbers support our projections — and Club A breaking even in Year 2 is better than our conservative model assumes.

          The brand integration point is critical. That's already in our proposal — shared badge, shared identity, "Richmond completes its club."

          Going to update the financial model with these benchmarks before the board presentation. Real data beats projections every time.
        mentions:
          - higgins

