  # Day 0 (Base date): Building the future — Rebecca's agenda at 8:33 AM
  - priority_ref: business_case
    title: "WOMEN'S TEAM PROPOSAL - Vision and viability"
    created: "-1d"
    icon: goal
    tags:
      pinned: [user]
      goal: [user]
      decision: [user]
    links:
      - source_ref: notion
        type: document
        title: "Women's Team Proposal v1.0"
        source_url: "https://notion.so/afcrichmond/womens-team-proposal"
      - source_ref: sheets
        type: spreadsheet
        title: "Women's Team Financial Model"
        source_url: "https://docs.google.com/spreadsheets/d/1x2y3z/edit"
      - source_ref: gmail
        type: email
        title: "Board Feedback on Proposal"
        source_url: "mailto:board@afcrichmond.com"
    notes:
      - created: "-1d 07:30"
        content: |
          ## AFC Richmond Women's Football Club
          ### Vision Document - Draft 1.0

          **Core Question:** Can we build a women's team that embodies Richmond values while being financially sustainable?

          **Answer:** Yes. But only if we do it right.

          ---

          ### Why Now?

          **The landscape:**
          - Women's football growing rapidly (attendance up 200% in 3 years)
          - Commercial interest increasing
          - Community demand exists (supporter surveys show strong interest)
          - Richmond is already about belief, growth, and inclusion

          **The timing:**
          - Men's team stable (even in this slump, foundation is solid)
          - Facility expansion planned (training ground upgrades starting 2026)
          - Revenue position allows for strategic investment
          - Cultural moment for women's sports

          **The truth:**
          This isn't about capitalizing on a trend. This is about what Richmond is.

          Ted built a club that believes in people. That gives second chances. That values effort and growth over just winning.

          A women's team isn't a departure from that. It's a continuation.

          ---

          ### Financial Model (Preliminary)

          **Startup costs (Year 1):** £2.5M
          - Player salaries (Championship level): £800K
          - Coaching staff: £400K
          - Facilities & equipment: £600K
          - Marketing & operations: £400K
          - Contingency: £300K

          **Revenue projections (Year 1):** £800K
          - Match day: £200K (conservative attendance estimates)
          - Sponsorship: £400K (leverage existing Richmond brand)
          - Merchandise: £150K
          - League funding: £50K

          **Year 1 net:** -£1.7M investment

          **Year 3 target:** Break-even or modest loss covered by men's team revenue sharing

          **Year 5 target:** Self-sustaining or minimal subsidy

          **Key assumption:** This is a long-term investment in club culture and community, not a short-term profit center.

          ---

          ### Facility Requirements

          **Training ground:**
          - Share existing facilities (scheduled to avoid men's team conflicts)
          - Planned 2026 expansion includes additional pitch capacity
          - Locker room renovations needed (budget: £150K)

          **Match venue:**
          - Year 1-2: Use Richmond stadium for select matches (community building)
          - Consider partnership with local venue for regular season
          - As attendance grows, transition more matches to main stadium

          ---

          ### League Structure & Timeline

          **Proposed path:**
          - **2025 (Current year):** Planning, league application, staff recruitment
          - **2025-26 Season:** Launch in FA Women's Championship (Tier 2)
          - **2027-28 Season target:** Promotion push to WSL (Tier 1)

          **Why Championship, not lower?**
          - Richmond brand deserves competitive level
          - Championship has infrastructure for growth
          - Player recruitment easier at competitive tier
          - Supporter interest higher with quality football

          **Why not WSL immediately?**
          - Entry barriers high (existing club buy-in needed)
          - Better to earn promotion than buy entry
          - Mirrors men's team journey (authenticity matters)

          ---

          ### Cultural Integration

          **This isn't "men's team + women's team"**
          **This is AFC Richmond, full stop.**

          - Shared badge, shared values, shared community
          - Women's team featured equally in club communications
          - Joint community programs
          - Players interact across teams (mentorship, support)
          - Supporters support BOTH teams (cultivate this from day one)

          **The framing matters:**
          Not: "Richmond launches women's team" (implies addition)
          Instead: "Richmond completes its club" (implies fulfillment)

          ---

          ### Key Risks & Mitigations

          **Risk 1: Financial drain during men's team struggles**
          Mitigation: Phased investment, contingency funding, multi-year commitment regardless of men's team performance

          **Risk 2: Supporter base doesn't embrace women's team**
          Mitigation: Heavy community engagement, shared identity building, make it OUR team not just A team

          **Risk 3: Competition for talent and resources**
          Mitigation: Clear operational separation, dedicated staff, facility scheduling protocols

          **Risk 4: Poor on-field performance damages launch**
          Mitigation: Realistic expectations, emphasize growth over immediate results, strong coaching hire

          ---

          ### Next Steps (If Approved)

          1. **Board presentation** - Get ownership buy-in (Higgins will help)
          2. **League application** - Begin FA Women's Championship process
          3. **Coaching search** - Find the right leader (someone who gets Richmond)
          4. **Facility planning** - Integrate into 2026 training ground expansion
          5. **Community engagement** - Supporter trust, local councils, schools
          6. **Sponsor development** - Leverage existing partnerships, find women's team-specific sponsors

          **Timeline:** Board presentation in March, decision by April, launch announcement May if approved.

          ---

          ### Personal Note

          When Ted left, he said: "This place isn't about me. It's about what we all built together."

          He was right.

          Richmond isn't about any one person. It's about belief. Growth. Second chances. Community.

          A women's team isn't a departure from that story.

          It's the next chapter.

          Not because it's trendy. Not because it's good PR.

          Because it's who we are.

          ---
      - created: "-1d 08:30"
        content: |
          **@plot, what are the common challenges football clubs face when launching women's teams?**
        ai_query: true
      - created: "-1d 08:30"
        content: |
          **Plot AI Response:**

          **Common challenges when establishing women's football teams:**

          1. **Underfunding & sustainability** - Many clubs treat women's teams as cost centers without long-term investment strategy
          2. **Facility access conflicts** - Training ground scheduling tensions with men's teams
          3. **Brand positioning** - Struggling to integrate women's team into club identity vs treating as separate entity
          4. **Talent recruitment** - Competition for quality players, especially if starting at lower tiers
          5. **Commercial development** - Difficulty securing women's team-specific sponsorships
          6. **Media coverage imbalance** - Club communications often still prioritize men's team disproportionately
          7. **Supporter engagement** - Existing fanbase doesn't automatically transfer loyalty to women's team

          **Successful clubs typically:**
          - Make multi-year financial commitments upfront
          - Integrate women's team into core club identity from day one
          - Invest in dedicated coaching and support staff (not hand-me-downs)
          - Build community programs that engage fans with both teams
          - Set realistic timelines for competitive success

          Richmond's advantage: Established culture of belief and community could translate well if authentically applied to women's team.
      - created: "-1d 08:45"
        content: |
          ---

          Good summary. Richmond has the culture advantage.

          Now I just need to convince the board this is strategic, not sentimental.

          Both can be true.

