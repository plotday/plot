      - author_ref: murph
        created: "-1d 19:15"
        content: |
          Travel's sorted — bus together at 08:30, Stamford Bridge 10:15, walkthrough 11:30. Lads on the coach as a group, no separate cars. Good for the heads before a big one.
        mentions:
