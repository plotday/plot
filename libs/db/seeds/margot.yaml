          Bodies are fresh — loads are green, no new knocks. Only flag: their bench changes the game after 70. We've drilled the triggers all week but legs will be the difference late. Don't want us pressing on empty at 75.
        mentions:
          - murph
      - created: "-1d 18:35"
        content: |
          Honest question, not second-guessing: if we go a goal down early — and at Stamford Bridge it happens — what's the plan? I want to know what you three want from me in the box, which is mostly to sit still and not look panicked.
