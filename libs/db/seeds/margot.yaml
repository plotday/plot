  - priority_ref: womens_team
    title: "Revenue model assumptions"
    created: "-1d"
    twist_ref: plot_ai
    notes:
      - created: "-1d 08:20"
        content: |
          **@plot, stress-test the revenue assumptions for a women's team launching in the FA Women's Championship. Year 1 startup ~£2.5M, projected revenue £800K. I have benchmarking from three comparable clubs. Which assumptions matter most?**
        ai_query: true
      - created: "-1d 08:20"
        content: |
          **Plot AI:**

          The assumptions most likely to make or break a Year 1 model:

          **Attendance (highest variance):** first-season crossover from the men's fanbase runs 8–15%; full brand integration outperforms standalone by ~40%. Conservative 800–1,200 per match, optimistic 1,500–2,000.

          **Sponsorship (most sensitive to positioning):** the women's football sponsorship market is growing ~25% YoY; clubs that announced as "completing the club" secured deals 30–50% larger.

          **Year 3 break-even:** primary driver is whether attendance compounds — a viral launch moment (a founders' scarf, a community unveiling) is exactly that kind of catalyst.

          Model three scenarios — conservative, base (15% YoY), optimistic (25% + sponsorship uplift) — and present all three. It shows rigour and sets honest expectations.

  - priority_ref: womens_team
    title: "Board presentation talking points"
    created: "-1d"
    twist_ref: plot_ai
    notes:
      - created: "-1d 08:40"
        content: |
          **@plot, help me frame a board presentation for launching the women's team. The board will worry about timing — the men's team is in a slump. I want this to read as strategic long-term investment, not a feel-good project.**
        ai_query: true
      - created: "-1d 08:40"
        content: |
          **Plot AI:**

          The frame that lands with a skeptical board: **"This is what stable clubs do."** Don't defend the timing — own it: "The men's run is precisely why now shows the board's long-term conviction." Lead with the benchmarking data, not the vision. Acknowledge the risks before anyone raises them. Close with values, never open with them — and don't lead with Hank; earn the emotional close by winning the analytical argument first.

