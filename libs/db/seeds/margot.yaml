  # ---- Active (Doing now) — connector-backed, varied sources --------------
  - priority_ref: womens_team
    title: "Women's team proposal — vision and viability"
    created: "-0d 09:00"
    state: active
    tags:
      pinned: [user]
      goal: [user]
    links:
      - source_ref: notion
        type: document
        title: "Women's Team Proposal v1.0"
        source_url: "https://notion.so/afcmarlow/womens-team-proposal"
      - source_ref: sheets
        type: spreadsheet
        title: "Women's Team Financial Model"
        source_url: "https://docs.google.com/spreadsheets/d/1x2y3z/edit"
      - source_ref: gmail
        type: email
        title: "Board feedback on proposal"
        source_url: "mailto:board@afcmarlow.com"
    notes:
      - created: "-1d 07:30"
        content: |
          ## AFC Marlow Women's Football Club
          ### Vision document — Draft 1.0

          **Core question:** Can we build a women's team that embodies Marlow values while being financially sustainable?

          **Answer:** Yes. But only if we do it right.

          ---

          ### Why now?

          - Women's football growing rapidly (attendance up 200% in 3 years)
          - Community demand exists (supporter surveys show strong interest)
          - Men's team stable enough to absorb the investment focus
          - Facility expansion already planned for 2026

          This isn't about capitalizing on a trend. This is about what Marlow is. Hank built a club that believes in people. A women's team isn't a departure from that. It's a continuation.

          ---

          ### Financial model (preliminary)

          **Startup (Year 1):** £2.5M — players £800K, staff £400K, facilities £600K, marketing £400K, contingency £300K.
          **Revenue (Year 1):** £800K — match day £200K, sponsorship £400K, merchandise £150K, league £50K.
          **Year 1 net:** −£1.7M investment. **Year 3:** break-even target. **Year 5:** self-sustaining.

          ---

          ### League & timeline

          - **2026:** planning, league application, staff recruitment
          - **2026–27:** launch in FA Women's Championship (Tier 2)
          - **2028–29 target:** promotion push to WSL

          ---

          ### Cultural integration

          This isn't "men's team + women's team." This is AFC Marlow, full stop. Shared badge, shared values, shared community. Not: "Marlow launches women's team." Instead: "Marlow completes its club."

          ---

          ### Next steps (if approved)

          1. Board presentation (Embry to help)
          2. League application
          3. Coaching search
          4. Facility planning
          5. Community engagement
          6. Sponsor development

          Board presentation in May; decision by June; launch announcement if approved.
      - created: "-1d 08:30"
        content: |
          **@plot, what are the common challenges football clubs face when launching women's teams?**
        ai_query: true
      - created: "-1d 08:30"
        content: |
          **Plot AI:**

          The challenges that most often derail a new women's team:

          1. **Underfunding** — treated as a cost centre with no multi-year plan
          2. **Facility conflicts** — scheduling tension with the men's team
          3. **Brand positioning** — bolted on rather than integrated into club identity
          4. **Talent recruitment** — competition for quality players at lower tiers
          5. **Supporter transfer** — existing fans don't automatically follow

          Clubs that succeed make multi-year commitments upfront and integrate the team into the core identity from day one. Marlow's advantage: an established culture of belief and community that translates well if applied authentically.
      - created: "-1d 08:45"
        content: |
          Good summary. Marlow has the culture advantage. Now I just need to convince the board this is strategic, not sentimental. Both can be true.

