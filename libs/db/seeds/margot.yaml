        mentions:
          - wes
          - eli
      - author_ref: eli
        created: "-1d 19:05"
        content: |
          Suits me. And set-pieces — they concede from inswingers, I'll be on those near post. If we get three or four corners in good areas that's a goal in this game.
        mentions:
