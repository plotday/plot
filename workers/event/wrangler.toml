name = "plot-event-sync"
main = "src/index.ts"
compatibility_date = "2023-07-10"

[env.production]
  vars = { ENV = "production" }

[[env.production.queues.consumers]]
  queue = "plot-event-production-queue"
  max_batch_size = 20
  max_batch_timeout = 3
  max_retries = 3

[env.staging]
  vars = { ENV = "staging" }

[[env.staging.queues.consumers]]
  queue = "plot-event-staging-queue"
  max_batch_size = 20
  max_batch_timeout = 3
  max_retries = 3

[env.development]
  vars = { ENV = "development" }

[[env.development.queues.producers]]
  queue = "plot-event-development-queue"
  binding = "QUEUE"

[[env.development.queues.consumers]]
  queue = "plot-event-development-queue"
  max_retries = 0
  max_batch_size = 20
  max_batch_timeout = 3

[placement]
  mode = "smart"

[dev]
  port = 8786
