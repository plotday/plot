name = "event-sync"
main = "src/index.ts"
compatibility_date = "2024-11-18"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[define]
  ENV = '"development"'
  RELEASE = '"dev"'
  PACKAGE = '"event"'

[placement]
  mode = "smart"

[ai]
  binding = "AI"

[observability.logs]
  enabled = true

[env.production]
[[env.production.queues.consumers]]
  queue = "event-sync"
  max_batch_size = 100
  max_batch_timeout = 3
  max_retries = 3


[env.development]
[[env.development.queues.consumers]]
  queue = "event-sync"
  max_batch_size = 10
  max_batch_timeout = 3
  max_retries = 0
