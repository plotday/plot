name = "api"
main = "src/index.ts"
compatibility_date = "2023-12-01"

[env.production]
  vars = { ENV = "production" }

[[env.production.queues.producers]]
  queue = "plot-sync-production-queue"
  binding = "SYNC_QUEUE"

[env.staging]
  vars = { ENV = "staging" }

[[env.staging.queues.producers]]
  queue = "plot-sync-staging-queue"
  binding = "SYNC_QUEUE"
