name = "plot-dev"
main = "src/index.ts"
compatibility_date = "2024-11-18"

[[queues.producers]]
  queue = "plot-sync-development-queue"
  binding = "SYNC_QUEUE"

[[queues.producers]]
  queue = "plot-contact-sync-development-queue"
  binding = "CONTACT_SYNC_QUEUE"

[[queues.producers]]
  queue = "plot-event-development-queue"
  binding = "EVENT_QUEUE"

[[queues.consumers]]
  queue = "plot-sync-development-queue"
  max_batch_size = 1
  max_retries = 0

[[queues.consumers]]
  queue = "plot-contact-sync-development-queue"
  max_batch_size = 1
  max_retries = 0

[[queues.consumers]]
  queue = "plot-event-development-queue"
  max_batch_size = 10
  max_batch_timeout = 3
  max_retries = 0

[dev]
  port = 8780
