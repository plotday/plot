name = "calendar-webhook"
main = "src/index.ts"
compatibility_date = "2024-11-18"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[env.development]
[env.development.define]
  ENV = '"development"'
  RELEASE = '"dev"'
  PACKAGE = '"calendar-webhook"'

[[env.development.queues.producers]]
  queue = "sync-development"
  binding = "SYNC_QUEUE"

[env.production]
[env.production.define]
  ENV = '"production"'
  RELEASE = '"prod"'
  PACKAGE = '"calendar-webhook"'

[env.production.triggers]
  # every 5 minutes
  crons = ["*/5 * * * *"]

[[env.production.queues.producers]]
  queue = "sync-production"
  binding = "SYNC_QUEUE"


[dev]
  port = 8785

[observability.logs]
  enabled = true
