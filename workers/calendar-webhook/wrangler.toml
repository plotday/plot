name = "calendar-webhook"
main = "src/index.ts"
compatibility_date = "2024-11-18"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[define]
  ENV = '"development"'
  RELEASE = '"dev"'
  PACKAGE = '"calendar-webhook"'

[[queues.producers]]
  queue = "sync"
  binding = "SYNC_QUEUE"

[triggers]
  # every 5 minutes
  crons = ["*/5 * * * *"]

[dev]
  port = 8785

[observability.logs]
  enabled = true
