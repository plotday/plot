name = "plot-labeler"
main = "src/index.ts"
compatibility_date = "2023-07-10"

[env.production]
  vars = { ENV = "production" }

[[env.production.queues.consumers]]
  queue = "plot-labeler-production-queue"
  max_batch_size = 20
  max_batch_timeout = 3
  max_retries = 3

[env.staging]
  vars = { ENV = "staging" }

[[env.staging.queues.consumers]]
  queue = "plot-labeler-staging-queue"
  max_batch_size = 20
  max_batch_timeout = 3
  max_retries = 3

[placement]
  mode = "smart"
