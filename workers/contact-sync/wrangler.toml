name = "contact-sync"
main = "src/index.ts"
compatibility_date = "2024-11-18"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[env.development]
[env.development.define]
  ENV = '"development"'
  RELEASE = '"dev"'
  PACKAGE = '"contact-sync"'

[env.production]
[env.production.define]
  ENV = '"production"'
  RELEASE = '"prod"'
  PACKAGE = '"contact-sync"'

[[queues.consumers]]
  queue = "contact-sync"
  max_batch_size = 1
  max_retries = 5

[placement]
  mode = "smart"

[observability.logs]
  enabled = true
